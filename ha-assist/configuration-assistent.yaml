# Smart Climate: de assistent die uitlegt (ONTWERP §7, fase 1).
#
# Plak dit onderaan configuration.yaml. Assist herkent de zin (zie
# custom_sentences/nl/smart_climate.yaml), stelt de vraag aan Smart Climate, en
# spreekt het antwoord uit. Dit leest alleen: Home Assistant schakelt hier
# niets, en de dienst ook niet.
#
# Het adres hieronder is een voorbeeld. Het goede staat in de app, bij
# Instellingen › Bewoners en toegang › Sleutel voor de assistent: in de add-on
# is dat de naam van de add-on in Home Assistant, zoals
# http://abcd1234-hems-climate:8099/api/vraag (besluit 177).

rest_command:
  smart_climate_vraag:
    url: >-
      http://abcd1234-hems-climate:8099/api/vraag?taal=nl&v={{ v }}&kamer={{ kamer | default('') | urlencode }}&wens={{ wens | default('') }}&temperatuur={{ temperatuur | default('') }}
    method: GET
    # De hele app vraagt een inlog (besluit 147); de assistent komt binnen met
    # de sleutel uit Instellingen › Bewoners en toegang › Sleutel voor de
    # assistent. Zet hem in secrets.yaml als:
    #   smart_climate_sleutel: "Bearer <de sleutel>"
    headers:
      Authorization: !secret smart_climate_sleutel
    timeout: 10

intent_script:
  SmartClimateNu:
    action:
      - action: rest_command.smart_climate_vraag
        data:
          v: nu
        response_variable: antwoord
      - stop: ""
        response_variable: antwoord
    speech:
      text: >-
        {{ action_response.content.antwoord if action_response.status == 200
           else 'Smart Climate geeft nu geen antwoord.' }}

  SmartClimateWaarom:
    action:
      - action: rest_command.smart_climate_vraag
        data:
          v: waarom
          kamer: "{{ kamer }}"
        response_variable: antwoord
      - stop: ""
        response_variable: antwoord
    speech:
      text: >-
        {{ action_response.content.antwoord if action_response.status == 200
           else 'Smart Climate geeft nu geen antwoord.' }}

  SmartClimateStraks:
    action:
      - action: rest_command.smart_climate_vraag
        data:
          v: straks
        response_variable: antwoord
      - stop: ""
        response_variable: antwoord
    speech:
      text: >-
        {{ action_response.content.antwoord if action_response.status == 200
           else 'Smart Climate geeft nu geen antwoord.' }}

  SmartClimateZon:
    action:
      - action: rest_command.smart_climate_vraag
        data:
          v: zon
        response_variable: antwoord
      - stop: ""
        response_variable: antwoord
    speech:
      text: >-
        {{ action_response.content.antwoord if action_response.status == 200
           else 'Smart Climate geeft nu geen antwoord.' }}

  # Een opdracht. Tijdens de schaduw zegt de dienst wat hij zou doen, en dat
  # hij nog niet mag schakelen. Er gaat niets naar de airco.
  SmartClimateDoe:
    action:
      - action: rest_command.smart_climate_vraag
        data:
          v: doe
          kamer: "{{ kamer }}"
          wens: "{{ wens }}"
          temperatuur: "{{ temperatuur | default('') }}"
        response_variable: antwoord
      - stop: ""
        response_variable: antwoord
    speech:
      text: >-
        {{ action_response.content.antwoord if action_response.status == 200
           else 'Smart Climate geeft nu geen antwoord.' }}
