  mode: single
- id: '1781866098346'
  alias: 'Voetbal: Oranje Scoort! (Dynamisch)'
  description: Knipperen en golf-wave met instelbare vertraging
  triggers:
  - entity_id: sensor.wc_netherlands
    attribute: team_score
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.team_score | int(0) > \n   trigger.from_state.attributes.team_score
      | int(0) }}\n   "
  - condition: state
    entity_id: media_player.tv_in_tuinhuis_2
    state: 'on'
  actions:
  - delay:
      seconds: '{{ states(''input_number.voetbal_vertraging'') | int(0) }}'
  - action: scene.create
    data:
      scene_id: verlichting_voor_doelpunt
      snapshot_entities:
      - light.achtertuin
      - light.spot_tuinhuis_1
      - light.spot_tuinhuis_2
      - light.spot_tuinhuis_3
      - light.spot_tuinhuis_4
      - light.spot_tuinhuis_5
      - light.spot_tuinhuis_6
  - action: light.turn_on
    data:
      brightness_pct: 10
      transition: 1
    target:
      entity_id:
      - light.spot_tuinhuis_1
      - light.spot_tuinhuis_2
      - light.spot_tuinhuis_3
      - light.spot_tuinhuis_4
      - light.spot_tuinhuis_5
      - light.spot_tuinhuis_6
  - parallel:
    - sequence:
      - repeat:
          count: 4
          sequence:
          - action: light.turn_on
            data:
              color_name: orange
              transition: 0
              brightness_pct: 100
            target:
              entity_id: light.achtertuin
          - delay: 00:00:01
          - action: light.turn_on
            data:
              color_name: red
              transition: 0
              brightness_pct: 100
            target:
              entity_id: light.achtertuin
          - delay: 00:00:01
          - action: light.turn_on
            data:
              color_name: white
              transition: 0
              brightness_pct: 100
            target:
              entity_id: light.achtertuin
          - delay: 00:00:01
          - action: light.turn_on
            data:
              color_name: blue
              transition: 0
              brightness_pct: 100
            target:
              entity_id: light.achtertuin
          - delay: 00:00:01
    - sequence:
      - repeat:
          count: 7
          sequence:
          - repeat:
              for_each:
              - '1'
              - '3'
              - '5'
              - '6'
              - '4'
              - '2'
              sequence:
              - action: light.turn_on
                data:
                  brightness_pct: 100
                  transition: 0.3
                target:
                  entity_id: light.spot_tuinhuis_{{ repeat.item }}
              - delay: '00:00:00.3'
              - action: light.turn_on
                data:
                  brightness_pct: 10
                  transition: 0.8
                target:
                  entity_id: light.spot_tuinhuis_{{ repeat.item }}
              - delay: '00:00:00.1'
  - action: scene.turn_on
    target:
      entity_id: scene.verlichting_voor_doelpunt
  mode: single
- id: '1782651374140'
  alias: F1 Vlagkleur Tuinhuis
  description: Past sfeerverlichting aan op F1-trackstatus (start, pulseren, auto-herstel).
    Start alleen tijdens F1-sessies.
  triggers:
  - trigger: state
    entity_id:
    - sensor.f1_track_status
    - sensor.f1_session_status
  - trigger: state
    entity_id: media_player.tv_in_tuinhuis_2
    from: 'on'
  conditions:
  - condition: template
    value_template: "{{ trigger.entity_id == 'media_player.tv_in_tuinhuis_2' or \n
      \  (trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state
      != trigger.to_state.state) }}"
  - condition: template
    value_template: '{{ states(''sensor.f1_session_status'') | lower in [''pre'',
      ''waiting'', ''formation'', ''warmup'', ''live'', ''finished'', ''finalised'',
      ''ended''] }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ trigger.entity_id == ''media_player.tv_in_tuinhuis_2'' }}'
    - condition: template
      value_template: '{{ states(''sensor.f1_session_status'') | lower in [''finished'',
        ''finalised'', ''ended''] }}'
    - condition: and
      conditions:
      - condition: state
        entity_id: person.ricardo_cornelissen
        state: home
      - condition: state
        entity_id: media_player.tv_in_tuinhuis_2
        state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.entity_id == 'media_player.tv_in_tuinhuis_2' and\n
          \  trigger.to_state.state != 'on' }}"
      sequence:
      - if:
        - condition: state
          entity_id: light.tuinhuis_overstek
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.tuinhuis_overstek
          data:
            rgb_color:
            - 255
            - 214
            - 170
            brightness_pct: 50
        else:
        - action: light.turn_off
          target:
            entity_id: light.tuinhuis_overstek
      - stop: 'Automatisering gestopt: TV is uitgezet'
    - conditions:
      - condition: template
        value_template: "{{ trigger.entity_id == 'sensor.f1_session_status'\n   and
          trigger.from_state is not none\n   and trigger.from_state.state | lower
          in ['pre','waiting','formation','warmup']\n   and trigger.to_state.state
          | lower == 'live'\n   and states('sensor.f1_track_status') == 'CLEAR' }}"
      sequence:
      - repeat:
          count: 5
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 0
              - 0
              transition: 0.2
          - delay: '00:00:00.5'
          - action: light.turn_off
            target:
              entity_id: light.tuinhuis_overstek
          - delay: '00:00:00.5'
      - delay: 00:00:01
      - action: light.turn_on
        target:
          entity_id: light.tuinhuis_overstek
        data:
          transition: 1
          brightness_pct: 100
          rgb_color:
          - 0
          - 255
          - 0
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'CLEAR' and\n   states('sensor.f1_session_status')
          | lower == 'live' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.tuinhuis_overstek
        data:
          transition: 2
          brightness_pct: 100
          rgb_color:
          - 0
          - 255
          - 0
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'YELLOW' and\n   states('sensor.f1_session_status')
          | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') != ''YELLOW'' }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 255
              - 0
              transition: 1.5
          - delay: 00:00:02
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 40
              rgb_color:
              - 120
              - 120
              - 0
              transition: 1.5
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') in ['SC','VSC'] and\n
          \  states('sensor.f1_session_status') | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') not in [''SC'',''VSC'']
              }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 165
              - 0
              transition: 1.5
          - delay: 00:00:02
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 50
              rgb_color:
              - 120
              - 80
              - 0
              transition: 1.5
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'VSC_ENDING' and\n
          \  states('sensor.f1_session_status') | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') != ''VSC_ENDING''
              }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 165
              - 0
              transition: 1.5
          - delay: 00:00:02
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 100
              rgb_color:
              - 0
              - 255
              - 0
              transition: 1.5
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'RED' and\n   states('sensor.f1_session_status')
          | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') != ''RED'' }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 0
              - 0
              transition: 1
          - delay: '00:00:01.5'
          - action: light.turn_on
            target:
              entity_id: light.tuinhuis_overstek
            data:
              brightness_pct: 30
              rgb_color:
              - 120
              - 0
              - 0
              transition: 1
          - delay: '00:00:01.5'
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.f1_session_status'') | lower in [''finished'',''finalised'',''ended'']
          }}'
      sequence:
      - if:
        - condition: state
          entity_id: light.tuinhuis_overstek
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.tuinhuis_overstek
          data:
            rgb_color:
            - 255
            - 214
            - 170
            brightness_pct: 50
        else:
        - action: light.turn_off
          target:
            entity_id: light.tuinhuis_overstek
  mode: restart
- id: '1787932452261'
  alias: Badkamer verlichting + spiegel (Vloeiend Dimmen met Helper)
  description: Kort drukken = 's Nachts nachtlampje, overdag Natuurlijk licht. (Of
    alles uit). Vasthouden = Vloeiend ping-pong dimmen. Spiegel-uit bug na dimmen
    verholpen!
  triggers:
  - trigger: state
    entity_id: event.verlichtingschakelaar_badkamer_button_1
    id: knop_1
    not_to:
    - unknown
    - unavailable
  - trigger: state
    entity_id: light.badkamer
    to: 'off'
    id: badkamer_off
  actions:
  - variables:
      event_type: '{{ trigger.to_state.attributes.event_type if trigger.id == ''knop_1''
        else ''none'' }}'
      previous_event: '{{ trigger.from_state.attributes.event_type if (trigger.id
        == ''knop_1'' and trigger.from_state is not none) else ''none'' }}'
      is_light_on: '{{ is_state(''light.badkamer'', ''on'') }}'
  - choose:
    - conditions:
      - condition: trigger
        id: badkamer_off
      sequence:
      - variables:
          desired: 'off'
          current: '{{ states(''switch.spiegel_badkamer_schakelaar_1'') }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ current != desired }}'
          sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.spiegel_badkamer_schakelaar_1
          - delay: 00:00:01
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ states(''switch.spiegel_badkamer_schakelaar_1'')
                  != desired }}'
              sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.spiegel_badkamer_schakelaar_1
    - conditions:
      - condition: trigger
        id: knop_1
      - condition: template
        value_template: '{{ event_type == ''short_release'' }}'
      - condition: template
        value_template: '{{ previous_event not in [''long_press'', ''repeat''] }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_light_on }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.badkamer
            data:
              transition: 2
          - variables:
              desired: 'off'
              current: '{{ states(''switch.spiegel_badkamer_schakelaar_1'') }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ current != desired }}'
              sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.spiegel_badkamer_schakelaar_1
              - delay: 00:00:01
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ states(''switch.spiegel_badkamer_schakelaar_1'')
                      != desired }}'
                  sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.spiegel_badkamer_schakelaar_1
        - conditions:
          - condition: template
            value_template: '{{ not is_light_on }}'
          sequence:
          - choose:
            - conditions:
              - condition: time
                after: '23:00:00'
                before: 06:00:00
              sequence:
              - action: scene.turn_on
                target:
                  entity_id: scene.badkamer_nachtlampje
                data:
                  transition: 2
            default:
            - action: scene.turn_on
              target:
                entity_id: scene.badkamer_natuurlijk_licht_6
              data:
                transition: 2
            - variables:
                desired: 'on'
                current: '{{ states(''switch.spiegel_badkamer_schakelaar_1'') }}'
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ current != desired }}'
                sequence:
                - action: switch.turn_on
                  target:
                    entity_id: switch.spiegel_badkamer_schakelaar_1
                - delay: 00:00:01
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ states(''switch.spiegel_badkamer_schakelaar_1'')
                        != desired }}'
                    sequence:
                    - action: switch.turn_on
                      target:
                        entity_id: switch.spiegel_badkamer_schakelaar_1
    - conditions:
      - condition: trigger
        id: knop_1
      - condition: template
        value_template: '{{ event_type in [''long_press'', ''repeat''] }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.badkamer
        data:
          brightness_step_pct: '{{ 20 if is_state(''input_boolean.dim_richting_badkamer'',
            ''on'') else -20 }}'
          transition: 1
    - conditions:
      - condition: trigger
        id: knop_1
      - condition: template
        value_template: '{{ event_type == ''long_release'' }}'
      sequence:
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.dim_richting_badkamer
  mode: restart
