    data:
      title: "\U0001F3C1 Formula 1 - Morgen is het zover!"
      message: "{% set race = state_attr('sensor.f1_next_race', 'race_name') %}  {%
        set city = state_attr('sensor.f1_next_race', 'circuit_locality') %}  {% set
        country = state_attr('sensor.f1_next_race', 'circuit_country') %}  {% set
        drivers = state_attr('sensor.f1_driver_standings', 'driver_standings') %}
        \ {% set constructors = state_attr('sensor.f1_constructor_standings', 'constructor_standings')
        %}  Morgen is de {{ race }} in {{ city }}, {{ country }}! \n\U0001F3C6 Top
        drivers: 1. {{ drivers[0].Driver.familyName }} ({{ drivers[0].points }} pts)
        \ 2. {{ drivers[1].Driver.familyName }} ({{ drivers[1].points }} pts)  3.
        {{ drivers[2].Driver.familyName }} ({{ drivers[2].points }} pts) \n\U0001F3CE️
        Top constructors: 1. {{ constructors[0].Constructor.name }} ({{ constructors[0].points
        }} pts)  2. {{ constructors[1].Constructor.name }} ({{ constructors[1].points
        }} pts)  3. {{ constructors[2].Constructor.name }} ({{ constructors[2].points
        }} pts)"
  mode: single
- id: '1741595480065'
  alias: Airco filters reinigen melding
  description: Melding + todo als filterlife onder 20% komt, en automatisch afvinken
    bij reset (zolder/woonkamer).
  triggers:
  - id: zolder
    trigger: numeric_state
    entity_id:
    - sensor.air_conditioning_zolder_filter_remaining_life
    below: 20
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - id: woonkamer
    trigger: numeric_state
    entity_id: sensor.air_conditioning_woonkamer_filter_remaining_life
    below: 20
    for: 00:05:00
  - id: zolder_reset
    trigger: numeric_state
    entity_id: sensor.air_conditioning_zolder_filter_remaining_life
    above: 90
  - id: woonkamer_reset
    trigger: numeric_state
    entity_id: sensor.air_conditioning_woonkamer_filter_remaining_life
    above: 90
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: zolder
      sequence:
      - data:
          title: Airco onderhoud
          message: "\U0001F9FD Filter airco zolder reinigen (filterlife < 20%)."
        action: notify.mobile_app_pixel_10_pro
      - target:
          entity_id: todo.to_do
        data:
          item: Filter airco zolder reinigen
        action: todo.add_item
    - conditions:
      - condition: trigger
        id: woonkamer
      sequence:
      - data:
          title: Airco onderhoud
          message: "\U0001F9FD Filter airco woonkamer reinigen (filterlife < 20%)."
        action: notify.mobile_app_pixel_10_pro
      - target:
          entity_id: todo.to_do
        data:
          item: Filter airco woonkamer reinigen
        action: todo.add_item
    - conditions:
      - condition: trigger
        id: zolder_reset
      sequence:
      - target:
          entity_id: todo.to_do
        data:
          item: Filter airco zolder reinigen
          status: completed
        action: todo.update_item
      - data:
          title: Airco onderhoud voltooid
          message: ✅ Filter airco zolder is gereset! De taak is afgevinkt.
        action: notify.mobile_app_pixel_10_pro
    - conditions:
      - condition: trigger
        id: woonkamer_reset
      sequence:
      - target:
          entity_id: todo.to_do
        data:
          item: Filter airco woonkamer reinigen
          status: completed
        action: todo.update_item
      - data:
          title: Airco onderhoud voltooid
          message: ✅ Filter airco woonkamer is gereset! De taak is afgevinkt.
        action: notify.mobile_app_pixel_10_pro
  mode: single
- id: '1768231124525'
  alias: Nachtlampen automatisch dimmen en uit
  description: Zet nachtlampen slaapkamers op 20%. Badkamer behoudt eigen scène. Na
    5 min alles dimmen naar 10% en uit.
  triggers:
  - trigger: state
    entity_id:
    - light.slaapkamer_matts
    - light.slaapkamer_mylan
    - light.badkamer
    to: 'on'
  conditions:
  - condition: time
    after: '21:30:00'
    before: 07:00:00
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id != ''light.badkamer'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ trigger.entity_id }}'
        data:
          brightness_pct: 20
  - delay: 00:05:00
  - condition: template
    value_template: "{{ is_state('light.slaapkamer_matts','on') or \n   is_state('light.slaapkamer_mylan','on')
      or \n   is_state('light.badkamer','on') }}\n"
  - action: light.turn_on
    target:
      entity_id: "{{ expand('light.slaapkamer_matts', 'light.slaapkamer_mylan', 'light.badkamer')\n
        \  | selectattr('state', 'eq', 'on')\n   | map(attribute='entity_id')\n   |
        list }}\n"
    data:
      brightness_pct: 10
      transition: 10
  - delay: 00:00:10
  - action: light.turn_off
    target:
      entity_id:
      - light.slaapkamer_matts
      - light.slaapkamer_mylan
      - light.badkamer
  mode: restart
- id: '1771237869438'
  alias: Klimaat - Totale Fysieke Sync naar Helpers
  description: Synchroniseert fysieke thermostaatwijzigingen terug naar de dashboard
    sliders. Negeren bij 18.0 en 25.0 (PV-standby grenzen). Inclusief zomer/koelen.
  triggers:
  - entity_id: climate.thermostaat_badkamer
    attribute: temperature
    trigger: state
    id: badkamer
  - entity_id: climate.beneden
    attribute: temperature
    trigger: state
    id: nest
  - entity_id: climate.air_conditioning_woonkamer
    attribute: temperature
    trigger: state
    id: airco_woon
  - entity_id: climate.air_conditioning_zolder
    attribute: temperature
    trigger: state
    id: airco_zolder
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: badkamer
      - condition: template
        value_template: '{{ states(''input_select.verwarming_modus_actief'') in [''dag'',
          ''voorverwarmen''] }}'
      - condition: template
        value_template: '{{ state_attr(''climate.thermostaat_badkamer'', ''temperature'')
          != none }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.badkamer_heat_off_temp_dag
        data:
          value: '{{ state_attr(''climate.thermostaat_badkamer'', ''temperature'')
            | float(18) }}'
    - conditions:
      - condition: trigger
        id: nest
      - condition: state
        entity_id: input_select.verwarming_modus_actief
        state: dag
      - condition: template
        value_template: '{{ state_attr(''climate.beneden'', ''temperature'') != none
          }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.temp_nest_dag
        data:
          value: '{{ state_attr(''climate.beneden'', ''temperature'') | float(20)
            }}'
    - conditions:
      - condition: trigger
        id: nest
      - condition: state
        entity_id: input_select.verwarming_modus_actief
        state: voorverwarmen
      - condition: template
        value_template: '{{ state_attr(''climate.beneden'', ''temperature'') != none
          }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.temp_nest_voorwarm
        data:
          value: '{{ state_attr(''climate.beneden'', ''temperature'') | float(19)
            }}'
    - conditions:
      - condition: trigger
        id: airco_woon
      - condition: state
        entity_id: input_boolean.status_airco_assist_actief
        state: 'on'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_woonkamer'', ''temperature'')
          != none }}'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_woonkamer'', ''temperature'')
          | float(0) not in [18.0, 25.0] }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.temp_airco_woonkamer
        data:
          value: '{{ state_attr(''climate.air_conditioning_woonkamer'', ''temperature'')
            | float(21) }}'
    - conditions:
      - condition: trigger
        id: airco_zolder
      - condition: state
        entity_id: input_boolean.status_airco_assist_actief
        state: 'on'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_zolder'', ''temperature'')
          != none }}'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_zolder'', ''temperature'')
          | float(0) not in [18.0, 25.0] }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.temp_airco_zolder
        data:
          value: '{{ state_attr(''climate.air_conditioning_zolder'', ''temperature'')
            | float(21) }}'
    - conditions:
      - condition: trigger
        id: airco_woon
      - condition: state
        entity_id: input_boolean.zomer_modus_actief
        state: 'on'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_woonkamer'', ''temperature'')
          != none }}'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_woonkamer'', ''temperature'')
          | float(0) not in [18.0, 25.0] }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.temp_airco_woonkamer_koelen
        data:
          value: '{{ state_attr(''climate.air_conditioning_woonkamer'', ''temperature'')
            | float(21) }}'
    - conditions:
      - condition: trigger
        id: airco_zolder
      - condition: state
        entity_id: input_boolean.zomer_modus_actief
        state: 'on'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_zolder'', ''temperature'')
          != none }}'
      - condition: template
        value_template: '{{ state_attr(''climate.air_conditioning_zolder'', ''temperature'')
          | float(0) not in [18.0, 25.0] }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.temp_airco_zolder_koelen
        data:
          value: '{{ state_attr(''climate.air_conditioning_zolder'', ''temperature'')
            | float(21) }}'
  mode: parallel
- id: '1771526165534'
  alias: Klimaat - Automatische Zomer/Winter wissel
  description: Schakelt de zomer/winter layout en zet de strategie veilig op PV koelen
    of Uit.
  triggers:
  - id: zomer_modus
    trigger: numeric_state
    entity_id: sensor.temperatuur
    above: 20
    for:
      minutes: 10
  - id: zomer_modus_zon_door_raam
    trigger: numeric_state
    entity_id: sensor.beneden_temperatuur
    above: 22.5
    for:
      minutes: 30
  - id: winter_modus
    trigger: numeric_state
    entity_id: sensor.beneden_temperatuur
    below: 21
    for:
      minutes: 30
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - zomer_modus
        - zomer_modus_zon_door_raam
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koel_strategie
        data:
          option: Pv koelen
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.zomer_modus_actief
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.pv_verwarmen_actief
    - conditions:
      - condition: trigger
        id: winter_modus
      - condition: template
        value_template: '{{ states(''input_select.koel_strategie'') != ''Handmatig
          koelen'' }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koel_strategie
        data:
          option: Uit
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.zomer_modus_actief
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pv_verwarmen_actief
  mode: single
- id: '1772025487128'
  alias: 'Verwarming: Auto-schakelen (Geoptimaliseerd)'
  description: Schakelt verwarming modus op basis van aanwezigheid met ingebouwde
    stabilisatie.
  triggers:
  - trigger: template
    id: thuiskomst
    value_template: "{{ is_state('person.ricardo_cornelissen', 'home') or\n   is_state('person.shira',
      'home') or\n   is_state('binary_sensor.saskia_thuis_gestabiliseerd', 'on') }}"
  - trigger: template
    id: vertrek
    value_template: "{{ is_state('person.ricardo_cornelissen', 'not_home') and\n   is_state('person.shira',
      'not_home') and\n   is_state('binary_sensor.saskia_thuis_gestabiliseerd', 'off')
      }}"
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: thuiskomst
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.verwarming_modus
          state: automatisch
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.verwarming_modus
        data:
          option: automatisch
    - conditions:
      - condition: trigger
        id: vertrek
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.verwarming_modus
          state: vakantie
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.verwarming_modus
          state: afwezig
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.verwarming_modus
        data:
          option: afwezig
  mode: single
- id: '1772310032235'
  alias: 'Verlichting: Alles uit bij afwezigheid'
  description: Zet light.alles uit zodra er 2 minuten lang niemand meer thuis is.
  triggers:
  - value_template: "{{ not is_state('person.ricardo_cornelissen', 'home') and \n
      \  not is_state('person.shira', 'home') and \n   is_state('binary_sensor.saskia_thuis_gestabiliseerd',
      'off') and \n   is_state('binary_sensor.rob_thuis_gestabiliseerd', 'off') and
      \n   is_state('binary_sensor.dini_thuis_gestabiliseerd', 'off') }}\n"
    for:
      minutes: 2
    trigger: template
  conditions: []
  actions:
  - action: light.turn_off
    target:
      entity_id: light.alles
  mode: single
- id: '1772361340332'
  alias: Sliders direct naar Airco (Manuele Override)
