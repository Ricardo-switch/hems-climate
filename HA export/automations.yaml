    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_number.temp_airco_zolder_koelen''
          }}'
      - condition: template
        value_template: '{{ states(''climate.air_conditioning_zolder'') != ''off''
          }}'
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.air_conditioning_zolder
        data:
          temperature: '{{ states(''input_number.temp_airco_zolder_koelen'') | float(21)
            }}'
  mode: restart
- id: '1773042929925'
  alias: Reset Droger Auto-Start Status
  description: Zet de auto-start schakelaar weer uit als de deur open gaat of de droger
    uit staat.
  triggers:
  - entity_id: binary_sensor.bosch_wtx87mwin_68a40e64ae22_bsh_common_status_doorstate
    to: 'on'
    trigger: state
  - entity_id: select.bosch_wtx87mwin_68a40e64ae22_bsh_common_setting_powerstate
    to: 'off'
    trigger: state
  actions:
  - target:
      entity_id: input_boolean.droger_auto_gestart
    action: input_boolean.turn_off
  mode: single
- id: '1773042965473'
  alias: Droger starten bij zonne-energie of uiterlijk 15:00
  description: Start de droger automatisch bij zon (checkt ook voorspelling) of om
    15:00, en is beveiligd tegen dubbel starten.
  triggers:
  - entity_id: sensor.pv_overschot_w
    above: 600
    for:
      hours: 0
      minutes: 1
      seconds: 0
    trigger: numeric_state
  - at: '15:00:00'
    trigger: time
  - entity_id: binary_sensor.bosch_wtx87mwin_68a40e64ae22_bsh_common_status_remotecontrolstartallowed
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.droger_auto_gestart
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.droger_status
      state: voltooid
    - condition: state
      entity_id: sensor.droger_status
      state: finished
  - condition: state
    entity_id: binary_sensor.bosch_wtx87mwin_68a40e64ae22_bsh_common_status_remotecontrolstartallowed
    state: 'on'
  - condition: or
    conditions:
    - condition: time
      after: '15:00:00'
    - condition: and
      conditions:
      - condition: numeric_state
        entity_id: sensor.pv_overschot_w
        above: 600
      - condition: numeric_state
        entity_id: sensor.power_production_next_hour
        above: 600
  actions:
  - target:
      entity_id: input_boolean.droger_auto_gestart
    action: input_boolean.turn_on
  - target:
      entity_id: button.bosch_wtx87mwin_68a40e64ae22_start_pause
    action: button.press
  mode: single
- id: '1774336936251'
  alias: 'Afval: Aan to-do lijst toevoegen'
  description: ''
  triggers:
  - entity_id: sensor.afval_vandaag_namen
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state not in [''unknown'', ''unavailable'',
      '''', ''geen''] }}

      '
  actions:
  - target:
      entity_id: input_boolean.afval_buiten_gezet
    action: input_boolean.turn_off
  - target:
      entity_id: todo.to_do
    data:
      item: 'Afval aan de straat: {{ trigger.to_state.state }}'
    action: todo.add_item
  mode: single
- id: '1774336982931'
  alias: 'Afval: Taak afgevinkt'
  triggers:
  - entity_id: sensor.to_do_lijst_items
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.afval_buiten_gezet
    state: 'off'
  - condition: template
    value_template: '{% set oud = trigger.from_state.attributes.taken_lijst | default([])
      | join('' '') | lower %} {% set nieuw = trigger.to_state.attributes.taken_lijst
      | default([]) | join('' '') | lower %} {{ ''afval'' in oud and ''afval'' not
      in nieuw }}

      '
  actions:
  - target:
      entity_id: input_boolean.afval_buiten_gezet
