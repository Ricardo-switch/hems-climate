- id: '1739097981551'
  alias: Entree bewegingssensor (hotel niveau + scene)
  description: Schakelt de entree lamp in met de Hue Natuurlijk Licht scène bij beweging.  Na
    30 seconden geen beweging dimt de lamp zachtjes en gaat hij uit.
  triggers:
  - entity_id: binary_sensor.bewegingssensor_entree_bezetting
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.bewegingssensor_entree_licht
    below: 80
  actions:
  - action: scene.turn_on
    target:
      entity_id: scene.entree_natuurlijk_licht_8
    data:
      transition: 2
  - wait_for_trigger:
    - entity_id: binary_sensor.bewegingssensor_entree_bezetting
      to: 'off'
      for: 00:00:30
      trigger: state
  - action: light.turn_on
    target:
      entity_id: light.entree
    data:
      brightness_pct: 5
      transition: 10
  - delay: 00:00:10
  - action: light.turn_off
    target:
      entity_id: light.entree
    data:
      transition: 5
  mode: restart
