- id: '1759077541053'
  alias: Tuinverlichting
  description: Zet tuinverlichting aan bij donker/thuiskomst en uit om 22:00 (tenzij
    tuinhuis aan is) of bij vertrek
  triggers:
  - trigger: sun
    event: sunset
    offset: +00:10:00
    id: turn_on_event
  - trigger: state
    entity_id:
    - person.ricardo_cornelissen
    - person.shira
    to: home
    id: turn_on_event
  - trigger: time
    at: '22:00:00'
    id: turn_off_event
  - trigger: state
    entity_id:
    - person.ricardo_cornelissen
    - person.shira
    to: not_home
    id: turn_off_away
  - trigger: state
    entity_id: light.tuinhuis_binnen
    to: 'off'
    for: 00:01:00
    id: turn_off_delayed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: turn_on_event
      - condition: sun
        after: sunset
        after_offset: +00:10:00
      - condition: time
        before: '22:00:00'
      - condition: or
        conditions:
        - condition: state
          entity_id: person.ricardo_cornelissen
          state: home
        - condition: state
          entity_id: person.shira
          state: home
      sequence:
      - action: scene.turn_on
        target:
          entity_id:
          - scene.border_soho
          - scene.tuinhuis_overstek_soho
      - action: notify.mobile_app_pixel_10_pro
        data:
          message: "\U0001F305 Tuinverlichting is aan (het is donker en iemand is
            thuis)."
    - conditions:
      - condition: trigger
        id: turn_off_event
      - condition: state
        entity_id: light.tuinhuis_binnen
        state: 'off'
      - condition: or
        conditions:
        - condition: state
          entity_id: light.tuinhuis_overstek
          state: 'on'
        - condition: state
          entity_id: light.border
          state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.tuinhuis_overstek
          - light.border
        data:
          transition: 30
      - action: notify.mobile_app_pixel_10_pro
        data:
          message: "\U0001F319 Tuinverlichting uitgezet (het is 22:00)."
    - conditions:
      - condition: trigger
        id: turn_off_away
      - condition: state
        entity_id: person.ricardo_cornelissen
        state: not_home
      - condition: state
        entity_id: person.shira
        state: not_home
      - condition: time
        before: '22:00:00'
      - condition: or
        conditions:
        - condition: state
          entity_id: light.tuinhuis_overstek
          state: 'on'
        - condition: state
          entity_id: light.border
          state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.tuinhuis_overstek
          - light.border
        data:
          transition: 30
      - action: notify.mobile_app_pixel_10_pro
        data:
          message: "\U0001F3C3‍♂️ Tuinverlichting uitgezet (iedereen is van huis)."
    - conditions:
      - condition: trigger
        id: turn_off_delayed
      - condition: time
        after: '22:00:00'
        before: 06:00:00
      - condition: or
        conditions:
        - condition: state
          entity_id: light.tuinhuis_overstek
          state: 'on'
        - condition: state
          entity_id: light.border
          state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.tuinhuis_overstek
          - light.border
        data:
          transition: 30
      - action: notify.mobile_app_pixel_10_pro
        data:
          message: "\U0001F319 Verlichting uitgeschakeld na afsluiten tuinhuis."
  mode: single
- id: bewegingssensor_zolder
  alias: Zolder verlichting (logisch alles-in-1)
  description: 'Beweging + donker (lux < 30) => licht aan (alleen als het uit is).
    Timer per tijdvak. Overdag & avond: directe reset bij beweging. Nacht: reset pas
    na 5 minuten. Daarna automatisch uit met fade.

    '
  mode: restart
  trigger:
  - platform: state
    entity_id: binary_sensor.hue_motion_sensor_zolder_beweging
    to: 'on'
  condition:
  - condition: numeric_state
    entity_id: sensor.hue_motion_sensor_1_licht
    below: 30
  action:
  - variables:
      hour: '{{ now().hour }}'
      period: '{% if 7 <= hour < 18 %}day {% elif 18 <= hour < 22 %}evening {% else
        %}night {% endif %}'
      brightness: '{% if period == ''day'' %}100 {% elif period == ''evening'' %}40
        {% else %}10 {% endif %}'
      duration: '{% if period == ''day'' %}00:10:00 {% elif period == ''evening''
        %}00:07:00 {% else %}00:02:00 {% endif %}'
      night_reset_delay: 300
  - choose:
    - conditions:
      - condition: state
        entity_id: light.zolder
        state: 'off'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.zolder
        data:
          brightness_pct: '{{ brightness | int }}'
          transition: 1
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ period == 'night'\n   and (states('timer.zolder_licht')
          != 'active'\n        or (as_timestamp(now()) - as_timestamp(states.timer.zolder_licht.last_changed))
          >= night_reset_delay) }}"
      sequence:
      - service: timer.start
        target:
          entity_id: timer.zolder_licht
        data:
          duration: '{{ duration }}'
    - conditions:
      - condition: template
        value_template: '{{ period != ''night'' }}'
      sequence:
      - service: timer.start
        target:
          entity_id: timer.zolder_licht
        data:
          duration: '{{ duration }}'
  - wait_for_trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.zolder_licht
  - service: light.turn_off
    target:
      entity_id: light.zolder
    data:
      transition: 5
- id: '1769507423353'
  alias: Klimaat controller - runner
  description: Roept de centrale klimaat controller aan bij relevante wijzigingen  (Aangepast
    voor koel_strategie en slimme afwezigheid).
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time
    at:
    - 06:00:00
    - 08:00:00
    - '22:00:00'
  - trigger: time_pattern
    minutes: /3
  - trigger: numeric_state
    entity_id: sensor.pv_overschot_w
    above: input_number.pv_klimaat_start_overschot_w
    for:
      minutes: 3
  - trigger: numeric_state
    entity_id: sensor.p1_meter_power
    above: input_number.pv_klimaat_stop_import_w
    for:
      minutes: 3
  - trigger: state
    entity_id:
    - person.ricardo_cornelissen
    - person.shira
    - binary_sensor.saskia_thuis_gestabiliseerd
    - binary_sensor.rob_thuis_gestabiliseerd
    - binary_sensor.dini_thuis_gestabiliseerd
    - input_select.verwarming_modus
    - input_boolean.voorverwarmen_aan
    - input_number.temp_nest_dag
    - input_number.temp_nest_voorwarm
    - input_number.temp_nest_eco
    - input_number.badkamer_heat_off_temp_dag
    - input_select.koel_strategie
    - input_boolean.pv_verwarmen_actief
    - input_boolean.airco_toestaan
    - input_boolean.status_airco_assist_actief
    - input_boolean.airco_assist_start_pending
    - input_number.airco_assist_start_na_min
    - input_number.airco_assist_min_on_min
    - input_number.airco_assist_delta_min
    - input_number.temp_airco_woonkamer
    - input_number.temp_airco_zolder
    - input_number.temp_airco_woonkamer_koelen
    - input_number.temp_airco_zolder_koelen
    - timer.airco_assist_start_delay
    - timer.airco_assist_min_on
    - timer.pv_stabilisatie
    - light.sfeerverlichting
    - light.woonkamer_plafonniere
  - trigger: state
    entity_id: climate.beneden
    attribute: hvac_action
  - trigger: state
    entity_id: climate.thermostaat_badkamer
  - trigger: state
    entity_id: climate.thermostaat_badkamer
    attribute: current_temperature
  - trigger: state
    entity_id: input_select.verwarming_modus
    to: afwezig
    id: check_huis_verlaten
  - trigger: state
    entity_id: input_select.koel_strategie
    to:
    - Handmatig koelen
    - Automatisch koelen
    id: check_strategie_gewijzigd
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: check_huis_verlaten
      - condition: state
        entity_id: input_select.koel_strategie
        state:
        - Handmatig koelen
        - Automatisch koelen
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koel_strategie
        data:
          option: Pv koelen
    - conditions:
      - condition: trigger
        id: check_strategie_gewijzigd
      - condition: state
        entity_id: input_select.verwarming_modus
        state: afwezig
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.verwarming_modus
        data:
          option: handmatig
  - delay: 00:00:01
  - if:
    - condition: state
      entity_id: input_select.koel_strategie
      state: Automatisch koelen
    then:
    - action: script.turn_on
      target:
        entity_id: script.koelen_apply_per_ruimte
  - action: script.turn_on
    target:
      entity_id: script.klimaat_controller_apply
  mode: restart
- id: '1769423238948'
  alias: FAILSAFE - Klimaat totaal (airco guard bij onbetrouwbare entiteiten)
  description: 'Failsafe: kapt airco-assist en zet airco''s hard uit als kritieke
    inputs onbetrouwbaar zijn (unknown/unavailable). Laat badkamer met rust.  Hervat
    automatisch de vorige strategie wanneer sensoren herstellen.

    '
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - climate.beneden
    - climate.thermostaat_badkamer
    - sensor.hue_motion_sensor_zolder_temperatuur
    - climate.air_conditioning_woonkamer
    - climate.air_conditioning_zolder
    - sensor.p1_meter_power
    to:
    - unknown
    - unavailable
    for: 00:00:30
  - trigger: state
    entity_id:
    - climate.beneden
    - climate.thermostaat_badkamer
    - sensor.hue_motion_sensor_zolder_temperatuur
    - climate.air_conditioning_woonkamer
    - climate.air_conditioning_zolder
    - sensor.p1_meter_power
    from:
    - unknown
    - unavailable
  - trigger: state
    entity_id: input_boolean.status_airco_assist_actief
  actions:
  - variables:
      nest_state: '{{ states(''climate.beneden'') }}'
      bad_state: '{{ states(''climate.thermostaat_badkamer'') }}'
      zolder_state: '{{ states(''sensor.hue_motion_sensor_zolder_temperatuur'') }}'
      ac_living_state: '{{ states(''climate.air_conditioning_woonkamer'') }}'
      ac_attic_state: '{{ states(''climate.air_conditioning_zolder'') }}'
      p1_state: '{{ states(''sensor.p1_meter_power'') }}'
      nest_bad: '{{ nest_state in [''unknown'',''unavailable''] }}'
      badkamer_bad: '{{ bad_state in [''unknown'',''unavailable''] }}'
      zolder_bad: '{{ zolder_state in [''unknown'',''unavailable''] }}'
      ac_living_bad: '{{ ac_living_state in [''unknown'',''unavailable''] }}'
      ac_attic_bad: '{{ ac_attic_state in [''unknown'',''unavailable''] }}'
      p1_bad: '{{ p1_state in [''unknown'',''unavailable''] }}'
      airco_must_cut: '{{ nest_bad or zolder_bad or ac_living_bad or ac_attic_bad
        or p1_bad }}'
      any_critical_bad: '{{ airco_must_cut or badkamer_bad }}'
      assist_actief: '{{ is_state(''input_boolean.status_airco_assist_actief'',''on'')
        }}'
      airco_any_on: '{{ ac_living_state != ''off'' or ac_attic_state != ''off'' }}'
      something_running: '{{ assist_actief or airco_any_on }}'
      notif_gate_exists: '{{ states(''input_boolean.failsafe_klimaat_melding_actief'')
        not in [''unknown'',''unavailable''] }}'
      notif_already_sent: '{{ notif_gate_exists and is_state(''input_boolean.failsafe_klimaat_melding_actief'',''on'')
        }}'
      issues: '{% set i = [] %}   {% if nest_bad %}{% set i = i + [''Nest (beneden)'']
        %}{% endif %}   {% if badkamer_bad %}{% set i = i + [''Badkamer thermostaat'']
        %}{% endif %}   {% if zolder_bad %}{% set i = i + [''Zolder temp sensor'']
        %}{% endif %}   {% if ac_living_bad %}{% set i = i + [''Airco woonkamer'']
        %}{% endif %}   {% if ac_attic_bad %}{% set i = i + [''Airco zolder''] %}{%
        endif %}   {% if p1_bad %}{% set i = i + [''P1 Meter''] %}{% endif %}   {{
        i | join('', '') }}'
      melding_tekst: "{% if airco_must_cut and something_running %}\n  Failsafe actief:
        {{ issues }} is/zijn onbetrouwbaar. De airco is uit veiligheid hard uitgezet!\n{%
        elif airco_must_cut %}\n  Failsafe actief: {{ issues }} is/zijn onbetrouwbaar.
        Airco was al uit, dus er is niets aangepast.\n{% else %}\n  Netwerkdip gedetecteerd:
        {{ issues }} is/zijn tijdelijk onbereikbaar. Dit heeft géén invloed op de
        airco.\n{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ airco_must_cut and something_running }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.status_airco_assist_actief
      - action: climate.turn_off
        target:
          entity_id:
          - climate.air_conditioning_woonkamer
          - climate.air_conditioning_zolder
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ any_critical_bad and (not notif_already_sent) }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ notif_gate_exists }}'
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.failsafe_klimaat_melding_actief
      - action: persistent_notification.create
        data:
          title: "{% if airco_must_cut %}FAILSAFE Klimaat \U0001F6A8{% else %}Klimaat
            Info ℹ️{% endif %}"
          message: '{{ melding_tekst }}'
    - conditions:
      - condition: template
        value_template: '{{ (not any_critical_bad) and notif_already_sent }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.failsafe_klimaat_melding_actief
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.status_airco_assist_actief
      - action: automation.trigger
        target:
          entity_id: automation.klimaat_controller_runner
      - action: persistent_notification.create
        data:
          title: Failsafe Opgeheven ✅
          message: Alle klimaatsensoren zijn weer betrouwbaar. De airco assist is
            weer ingeschakeld en hervat direct zijn ingestelde strategie.
  mode: restart
- id: '1769644186200'
  alias: Setpoints dagelijks terug naar standaard
  description: Reset setpoints naar standaard en herstelt de koel-strategie (Handmatig/Auto)
    netjes naar de basis.
  triggers:
  - at: 03:00:00
    trigger: time
  actions:
  - if:
    - condition: template
      value_template: '{{ states(''input_select.koel_strategie'') in [''Handmatig
        koelen'', ''Automatisch koelen''] }}'
    then:
    - if:
      - condition: state
        entity_id: input_boolean.zomer_modus_actief
        state: 'on'
      then:
      - action: input_select.select_option
        target:
          entity_id: input_select.koel_strategie
        data:
          option: Pv koelen
      else:
      - action: input_select.select_option
        target:
          entity_id: input_select.koel_strategie
        data:
          option: Uit
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.temp_airco_woonkamer')|float(0)\n
          \ != states('input_number.temp_airco_woonkamer_standaard')|float(0) }}"
      sequence:
      - target:
          entity_id: input_number.temp_airco_woonkamer
        data:
          value: '{{ states(''input_number.temp_airco_woonkamer_standaard'') | float(0)
            }}'
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.temp_airco_zolder')|float(0)\n   !=
          states('input_number.temp_airco_zolder_standaard')|float(0) }}"
      sequence:
      - target:
          entity_id: input_number.temp_airco_zolder
        data:
          value: '{{ states(''input_number.temp_airco_zolder_standaard'') | float(0)
            }}'
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.temp_nest_dag')|float(0)\n   != states('input_number.temp_nest_dag_standaard')|float(0)
          }}"
      sequence:
      - target:
          entity_id: input_number.temp_nest_dag
        data:
          value: '{{ states(''input_number.temp_nest_dag_standaard'') | float(0) }}'
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.temp_nest_eco')|float(0)\n   != states('input_number.temp_nest_eco_standaard')|float(0)
          }}"
      sequence:
      - target:
          entity_id: input_number.temp_nest_eco
        data:
          value: '{{ states(''input_number.temp_nest_eco_standaard'') | float(0) }}'
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.temp_nest_voorwarm')|float(0)\n   !=
          states('input_number.temp_nest_voorwarm_standaard')|float(0) }}"
      sequence:
      - target:
          entity_id: input_number.temp_nest_voorwarm
        data:
          value: '{{ states(''input_number.temp_nest_voorwarm_standaard'') | float(0)
            }}'
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.badkamer_heat_off_temp_dag')|float(0)\n
          \ != states('input_number.badkamer_heat_off_temp_dag_standaard')|float(0)
          }}"
      sequence:
      - target:
          entity_id: input_number.badkamer_heat_off_temp_dag
        data:
          value: '{{ states(''input_number.badkamer_heat_off_temp_dag_standaard'')
            | float(0) }}'
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.temp_airco_woonkamer_koelen')|float(0)\n
          \ != states('input_number.temp_airco_woonkamer_koelen_standaard')|float(0)
          }}"
      sequence:
      - target:
          entity_id: input_number.temp_airco_woonkamer_koelen
        data:
          value: '{{ states(''input_number.temp_airco_woonkamer_koelen_standaard'')
            | float(0) }}'
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ states('input_number.temp_airco_zolder_koelen')|float(0)\n
          \ != states('input_number.temp_airco_zolder_koelen_standaard')|float(0)
          }}"
      sequence:
      - target:
          entity_id: input_number.temp_airco_zolder_koelen
        data:
          value: '{{ states(''input_number.temp_airco_zolder_koelen_standaard'') |
            float(0) }}'
        action: input_number.set_value
  mode: single
- id: '1769500194818'
  alias: Verwarming niet-automatisch -> reset naar automatisch
  description: Zet niet-automatisch terug naar automatisch bij timer-einde, thuiskomst
    of om 22:00.
  triggers:
  - entity_id: timer.verwarming_handmatig
    from: active
    to: idle
    trigger: state
  - at: '22:00:00'
    trigger: time
  - entity_id:
    - person.ricardo_cornelissen
    - person.shira
    - binary_sensor.saskia_thuis_gestabiliseerd
    - binary_sensor.rob_thuis_gestabiliseerd
    - binary_sensor.dini_thuis_gestabiliseerd
    to: home
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ states('input_select.verwarming_modus') != 'automatisch'\n
      \  and states('input_select.verwarming_modus') != 'vakantie' }}"
  actions:
  - target:
      entity_id: input_select.verwarming_modus
    data:
      option: automatisch
    action: input_select.select_option
  mode: single
- id: '1769442945077'
  alias: F1 Vlagkleur Sfeerverlichting
  description: Past sfeerverlichting aan op F1-trackstatus (start, pulseren, auto-herstel).
    Start alleen tijdens F1-sessies.
  triggers:
  - trigger: state
    entity_id:
    - sensor.f1_track_status
    - sensor.f1_session_status
  - trigger: state
    entity_id: media_player.samsung_oled_2
    from: 'on'
  conditions:
  - condition: template
    value_template: "{{ trigger.entity_id == 'media_player.samsung_oled_2' or \n   (trigger.from_state
      is not none and trigger.to_state is not none and trigger.from_state.state !=
      trigger.to_state.state) }}"
  - condition: template
    value_template: '{{ states(''sensor.f1_session_status'') | lower in [''pre'',
      ''waiting'', ''formation'', ''warmup'', ''live'', ''finished'', ''finalised'',
      ''ended''] }}'
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ trigger.entity_id == ''media_player.samsung_oled_2'' }}'
    - condition: template
      value_template: '{{ states(''sensor.f1_session_status'') | lower in [''finished'',
        ''finalised'', ''ended''] }}'
    - condition: and
      conditions:
      - condition: state
        entity_id: person.ricardo_cornelissen
        state: home
      - condition: state
        entity_id: media_player.samsung_oled_2
        state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.entity_id == 'media_player.samsung_oled_2' and\n
          \  trigger.to_state.state != 'on' }}"
      sequence:
      - if:
        - condition: state
          entity_id: light.sfeerlamp
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.hue_color_spot_8
          data:
            rgb_color:
            - 255
            - 214
            - 170
            brightness_pct: 50
        else:
        - action: light.turn_off
          target:
            entity_id: light.hue_color_spot_8
      - stop: 'Automatisering gestopt: TV is uitgezet'
    - conditions:
      - condition: template
        value_template: "{{ trigger.entity_id == 'sensor.f1_session_status'\n   and
          trigger.from_state is not none\n   and trigger.from_state.state | lower
          in ['pre','waiting','formation','warmup']\n   and trigger.to_state.state
          | lower == 'live'\n   and states('sensor.f1_track_status') == 'CLEAR' }}"
      sequence:
      - repeat:
          count: 5
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 0
              - 0
              transition: 0.2
          - delay: '00:00:00.5'
          - action: light.turn_off
            target:
              entity_id: light.hue_color_spot_8
          - delay: '00:00:00.5'
      - delay: 00:00:01
      - action: light.turn_on
        target:
          entity_id: light.hue_color_spot_8
        data:
          transition: 1
          brightness_pct: 100
          rgb_color:
          - 0
          - 255
          - 0
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'CLEAR' and\n   states('sensor.f1_session_status')
          | lower == 'live' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.hue_color_spot_8
        data:
          transition: 2
          brightness_pct: 100
          rgb_color:
          - 0
          - 255
          - 0
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'YELLOW' and\n   states('sensor.f1_session_status')
          | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') != ''YELLOW'' }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 255
              - 0
              transition: 1.5
          - delay: 00:00:02
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 40
              rgb_color:
              - 120
              - 120
              - 0
              transition: 1.5
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') in ['SC','VSC'] and\n
          \  states('sensor.f1_session_status') | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') not in [''SC'',''VSC'']
              }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 165
              - 0
              transition: 1.5
          - delay: 00:00:02
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 50
              rgb_color:
              - 120
              - 80
              - 0
              transition: 1.5
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'VSC_ENDING' and\n
          \  states('sensor.f1_session_status') | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') != ''VSC_ENDING''
              }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 165
              - 0
              transition: 1.5
          - delay: 00:00:02
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 100
              rgb_color:
              - 0
              - 255
              - 0
              transition: 1.5
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: "{{ states('sensor.f1_track_status') == 'RED' and\n   states('sensor.f1_session_status')
          | lower == 'live' }}"
      sequence:
      - repeat:
          until:
          - condition: template
            value_template: '{{ states(''sensor.f1_track_status'') != ''RED'' }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 0
              - 0
              transition: 1
          - delay: '00:00:01.5'
          - action: light.turn_on
            target:
              entity_id: light.hue_color_spot_8
            data:
              brightness_pct: 30
              rgb_color:
              - 120
              - 0
              - 0
              transition: 1
          - delay: '00:00:01.5'
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.f1_session_status'') | lower in [''finished'',''finalised'',''ended'']
          }}'
      sequence:
      - if:
        - condition: state
          entity_id: light.sfeerlamp
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.hue_color_spot_8
          data:
            rgb_color:
            - 255
            - 214
            - 170
            brightness_pct: 50
        else:
        - action: light.turn_off
          target:
            entity_id: light.hue_color_spot_8
  mode: restart
- id: '1746443417419'
  alias: "\U0001F3C1 F1 Update - 1 dag voor race"
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions:
  - condition: template
    value_template: "{% set race_time = as_datetime(state_attr('sensor.f1_next_race',
      'race_start')) %}  {% if race_time %}\n  {{ (race_time.date() - now().date()).days
      == 1 }}\n{% else %}\n  false\n{% endif %}"
  actions:
