<style>
  /*
   * Vast en gepland (besluit 234, schetsen Wand-Gepland en Tel-Gepland): wat
   * het huis vanzelf doet, een keer of steeds. Bovenaan de dag als boog met de
   * zon en elke opdracht op zijn moment; eronder de lijst met een schakelaar om
   * te pauzeren; een tik opent Aanpassen. gepland.js tekent hem.
   */
  #wand main { position: relative; padding: 22px 26px 20px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; height: 100%; box-sizing: border-box; }
  .gp-kop { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .gp-kop .lead { max-width: 64ch; margin-top: 6px; }
  .gp-kop .lead q { color: var(--tekst); font-weight: 600; }
  .gp-nieuw { flex: none; height: 44px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--tekst); color: var(--inkt); font: inherit; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
  .gp-dag { position: relative; height: 270px; flex: none; overflow: hidden; }
  .gp-dag h2 { position: absolute; left: 20px; top: 14px; margin: 0; font-family: var(--kop); font-size: 17px; font-weight: 600; }
  .gp-dag h2 span { font-family: var(--romp); font-size: 13px; font-weight: 600; color: var(--gedempt); margin-left: 8px; }
  .gp-dag svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gp-dag svg text { font-family: var(--romp); }
  .gp-dag svg .t { font-family: var(--kop); font-size: 16px; font-weight: 700; }
  .gp-dag svg .w { font-size: 13.5px; font-weight: 600; }
  .gp-veld { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .gp-lijst { padding: 10px 18px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .gp-lijst h3 { margin: 4px 0 2px; font-size: 13px; font-weight: 700; color: var(--gedempt); }
  .gp-lijst .tip { margin-top: auto; font-size: 12.5px; color: var(--gedempt); padding-top: 8px; }
  .gp-regel { display: grid; grid-template-columns: 26px 64px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 8px 0; border-top: 1px solid rgb(var(--wit) / 0.06); cursor: pointer; }
  .gp-regel:first-of-type { border-top: 0; }
  .gp-regel > svg { width: 22px; height: 22px; color: var(--zacht); }
  .gp-regel .uur { font-family: var(--kop); font-size: 20px; font-weight: 600; }
  .gp-regel .uur small { display: block; font-family: var(--romp); font-size: 11.5px; font-weight: 600; color: var(--gedempt); margin-top: 1px; }
  .gp-regel b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gp-regel span.hoe { display: block; font-size: 13px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gp-regel span.hoe em { font-style: normal; color: var(--zon-t); }
  .gp-regel.gedaan { opacity: 0.45; }
  .gp-regel.uit .uur, .gp-regel.uit b { color: var(--gedempt); }
  .gp-regel.gekozen { background: rgb(var(--wit) / 0.07); border-radius: 12px; margin: 0 -8px; padding: 8px; border-top-color: transparent; }
  .gp-leeg { font-size: 14px; color: var(--zacht); margin: 8px 0; }

  /* Aanpassen: neemt de lijst over, de boog blijft. Eén keuze tegelijk open. */
  .gp-blad { position: absolute; inset: 0; padding: 16px 22px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 12px 30px; background: rgb(var(--nacht) / 0.97); z-index: 5; }
  .gp-blad[hidden], .gp-achter[hidden] { display: none; }
  .gp-blad .boven { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  .gp-blad .boven h2 { flex: 1; margin: 0; font-family: var(--kop); font-size: 24px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gp-blad .sluit { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 17px; cursor: pointer; }
  .gp-kolom { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .gp-vraag { display: flex; flex-direction: column; gap: 8px; }
  .gp-vraag[hidden], .gp-rij[hidden], .gp-onder[hidden] { display: none; }
  .gp-vraag > span { font-size: 12.5px; font-weight: 700; color: var(--gedempt); }
  .gp-waarde { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: rgb(var(--wit) / 0.05); border: 0; color: inherit; font: inherit; font-size: 15px; text-align: left; width: 100%; box-sizing: border-box; }
  .gp-waarde b { flex: 1; font-weight: 600; }
  .gp-waarde i { font-style: normal; color: var(--gedempt); font-size: 18px; }
  button.gp-waarde { cursor: pointer; }
  .gp-stapper { display: flex; align-items: center; gap: 10px; }
  .gp-stapper button { width: 36px; height: 36px; border-radius: 11px; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 19px; font-weight: 600; cursor: pointer; }
  .gp-stapper b { min-width: 170px; text-align: center; font-size: 15px; font-weight: 600; }
  /* Wanneer: één balk (besluit 228), de gewone knoppen zonder rand. */
  .gp-blad .chips.seg { display: flex; }
  .gp-blad .chips.seg > .chip { border: 0; height: 34px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .gp-tijd { height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font: inherit; font-size: 17px; font-weight: 600; width: 130px; color-scheme: dark; }
  .gp-zo { font-size: 13px; color: var(--zon-t); }
  .gp-keus { display: flex; flex-direction: column; border-radius: 14px; background: rgb(var(--wit) / 0.05); padding: 2px 14px; }
  .gp-keus button { display: flex; align-items: center; padding: 6px 0; border: 0; border-top: 1px solid rgb(var(--wit) / 0.06); background: none; color: inherit; font: inherit; font-size: 14.5px; text-align: left; cursor: pointer; }
  .gp-keus button:first-child { border-top: 0; }
  .gp-keus button span { flex: 1; }
  .gp-keus button[aria-pressed='true'] { font-weight: 700; }
  .gp-keus button[aria-pressed='true']::after { content: '✓'; color: var(--mint); font-weight: 800; }
  .gp-dagen { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgb(var(--wit) / 0.06); }
  .gp-dagen button { flex: 1; height: 30px; border: 0; border-radius: 9px; background: transparent; color: var(--zacht); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .gp-dagen button[aria-pressed='true'] { background: rgb(var(--wit) / 0.14); color: var(--tekst); }
  .gp-rij { display: flex; align-items: center; gap: 12px; font-size: 14.5px; }
  .gp-rij span { flex: 1; }
  .gp-rij small { display: block; font-size: 12.5px; color: var(--gedempt); }
  .gp-onder { margin-top: auto; display: flex; align-items: center; gap: 12px; }
  .gp-onder .weg { border: 0; background: none; color: var(--gloed-t); font: inherit; font-weight: 600; font-size: 14px; padding: 0; cursor: pointer; }
  .gp-onder .bewaar { margin-left: auto; height: 42px; padding: 0 22px; border-radius: 14px; border: 0; background: var(--tekst); color: var(--inkt); font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .gp-fout { color: var(--gloed-t); font-size: 13px; }

  /* De telefoon: alles onder elkaar, Aanpassen van onderen. */
  #tel .inhoud { padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .gp-kop h1 { font-size: 32px; }
  #tel .gp-kop .lead { display: none; }
  #tel .gp-nieuw { height: 38px; padding: 0 14px; font-size: 14px; }
  #tel .gp-dag { height: 190px; }
  #tel .gp-dag svg .w { display: none; }
  #tel .gp-veld { display: flex; flex-direction: column; gap: 14px; }
  #tel .gp-lijst { overflow: visible; }
  #tel .gp-regel { grid-template-columns: 54px minmax(0, 1fr) auto; }
  #tel .gp-regel > svg { display: none; }
  #tel .gp-regel .uur { font-size: 18px; }
  #tel .gp-achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.6); z-index: 60; }
  #tel .gp-blad { position: fixed; inset: auto 8px 8px 8px; max-height: 88vh; overflow-y: auto; border-radius: 26px; display: flex; flex-direction: column; background: rgb(var(--nacht)); z-index: 61; }
  #tel .gp-blad[hidden] { display: none; }
  #tel .gp-stapper b { flex: 1; min-width: 0; }

  /*
   * Nieuw (besluit 240, schetsen Wand-Gepland-Nieuw en Tel-Gepland-Nieuw), van
   * plannen.js. Op de wand een blad over de pagina: links de stappen, in het
   * midden de keus, rechts de zin en de boog. Op de telefoon van onderen, één
   * stap per scherm.
   */
  /* Het blad ligt in dezelfde cel als de pagina; allebei een vaste plek, anders schuift de pagina een rij omlaag. */
  #wand > main, .pl-laag { grid-column: 2; grid-row: 1; }
  .pl-laag { position: relative; z-index: 6; min-height: 0; }
  /* In het voorbeeldhuis staat de balk van de dag onderaan: op de wand stopt het blad erboven, op de telefoon gaat het eroverheen. */
  html.sc-voorbeeld #wand .pl-wiz { bottom: 112px; }
  html.sc-voorbeeld #tel .pl-laag { z-index: 93; }
  .pl-wiz { position: absolute; inset: 18px 22px 18px 18px; display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; border-radius: 28px; overflow: hidden; background: rgb(var(--nacht) / 0.97); border: 1px solid var(--glas-rand); box-shadow: 0 30px 90px rgb(0 0 0 / 0.55); }
  .pl-wiz.kies { display: flex; }
  .pl-wiz > section { padding: 26px 28px; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .pl-sluit { position: absolute; right: 18px; top: 16px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 18px; z-index: 2; cursor: pointer; }
  .pl-wiz button { font: inherit; color: inherit; cursor: pointer; }
  .pl-wiz button:disabled { cursor: default; opacity: 0.45; }
  .pl-fout { margin: 0; font-size: 14px; color: #ffb090; }
  .pl-leeg { color: var(--zacht); }

  /* Het begin: zeg het, of kies het zelf. */
  .pl-begin { flex: 1; padding: 40px 48px !important; gap: 24px !important; }
  .pl-begin h2 { margin: 0; font-family: var(--kop); font-size: 40px; font-weight: 600; padding-right: 40px; }
  .pl-wegen { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; }
  .pl-weg { display: flex; flex-direction: column; gap: 14px; padding: 28px 30px; border-radius: 26px; min-height: 0; }
  .pl-weg h3 { margin: 0; font-family: var(--kop); font-size: 30px; font-weight: 600; }
  .pl-weg p { margin: 0; font-size: 16px; color: var(--zacht); line-height: 1.45; max-width: 44ch; }
  .pl-weg.zeg { background: radial-gradient(120% 90% at 0% 0%, rgb(143 134 255 / 0.28), rgb(143 134 255 / 0.05) 60%), rgb(var(--wit) / 0.03); border: 1px solid rgb(143 134 255 / 0.35); }
  .pl-weg.zelf { background: radial-gradient(120% 90% at 100% 0%, rgb(247 181 72 / 0.22), rgb(247 181 72 / 0.04) 60%), rgb(var(--wit) / 0.03); border: 1px solid rgb(247 181 72 / 0.3); }
  .pl-invoer { display: flex; align-items: center; gap: 8px; padding: 7px; border-radius: 18px; background: rgb(5 10 20 / 0.6); border: 1px solid rgb(143 134 255 / 0.4); }
  .pl-invoer input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 0; background: none; color: var(--tekst); font: inherit; font-size: 16px; outline: none; }
  .pl-mic { width: 44px; height: 44px; flex: none; border-radius: 14px; border: 0; background: rgb(143 134 255 / 0.2); color: var(--violet-t); display: grid; place-items: center; }
  .pl-mic.aan { background: var(--violet); color: #0b1424; }
  .pl-mic svg { width: 21px; height: 21px; }
  .pl-maak { height: 44px; padding: 0 20px; flex: none; border-radius: 14px; border: 0; background: var(--violet); color: #0b1424 !important; font-weight: 700 !important; }
  .pl-voorbeelden { display: flex; flex-direction: column; border-radius: 16px; background: rgb(var(--wit) / 0.04); padding: 2px 16px; margin-top: auto; }
  .pl-voorbeelden button { display: flex; gap: 10px; align-items: center; padding: 11px 0; border: 0; border-top: 1px solid rgb(var(--wit) / 0.06); background: none; text-align: left; font-size: 15px; }
  .pl-voorbeelden button:first-child { border-top: 0; }
  .pl-voorbeelden button span { flex: 1; }
  .pl-voorbeelden button span::before { content: '“ '; font-family: var(--kop); color: var(--violet-t); }
  .pl-voorbeelden button i { font-style: normal; color: var(--gedempt); font-size: 18px; }
  .pl-vier { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: auto; }
  .pl-vier div { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; background: rgb(var(--wit) / 0.05); font-size: 15px; font-weight: 600; }
  .pl-vier i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; background: rgb(247 181 72 / 0.2); color: var(--zon-t); }
  .pl-gaan { align-self: flex-start; height: 50px; padding: 0 26px; border-radius: 16px; border: 0; background: var(--zon); color: #0b1424 !important; font-size: 16px !important; font-weight: 700 !important; }

  /* Links: de stappen, met wat je koos; een tik gaat terug naar die stap. */
  .pl-stappen { background: rgb(var(--wit) / 0.025); border-right: 1px solid rgb(var(--wit) / 0.06); }
  .pl-stappen h2 { margin: 0; font-family: var(--kop); font-size: 26px; font-weight: 600; }
  .pl-stappen ol { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .pl-stappen li button { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 12px; align-items: center; padding: 10px; border: 0; border-radius: 14px; background: none; text-align: left; }
  .pl-stappen li i { grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; border: 2px solid rgb(var(--wit) / 0.18); color: var(--gedempt); box-sizing: border-box; }
  .pl-stappen li b { font-size: 15px; font-weight: 600; color: var(--gedempt); }
  .pl-stappen li span { font-size: 13px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-stappen li.klaar i { background: var(--mint); border-color: var(--mint); color: #0b1424; }
  .pl-stappen li.klaar b { color: var(--tekst); }
  .pl-stappen li.klaar span { color: var(--zacht); }
  .pl-stappen li.nu button { background: rgb(var(--wit) / 0.07); }
  .pl-stappen li.nu i { border-color: var(--tekst); color: var(--tekst); }
  .pl-stappen li.nu b { color: var(--tekst); }
  .pl-hulp { margin: auto 0 0; font-size: 13px; color: var(--gedempt); line-height: 1.45; }
  .pl-hulp button { border: 0; background: none; padding: 0; color: var(--violet-t) !important; font-weight: 700; }

  /* Midden: de stap van nu. */
  .pl-kop { margin: 0; font-family: var(--kop); font-size: 30px; font-weight: 600; line-height: 1.1; padding-right: 30px; }
  .pl-seg { display: flex; padding: 3px; border-radius: 14px; background: rgb(var(--wit) / 0.06); }
  .pl-seg button { flex: 1; min-width: 0; height: 40px; padding: 0 6px; border: 0; border-radius: 11px; background: transparent; color: var(--zacht) !important; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
  .pl-seg button svg { width: 19px; height: 19px; flex: none; }
  .pl-seg button[aria-pressed='true'] { background: rgb(var(--wit) / 0.14); color: var(--tekst) !important; }
  .pl-dingen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-height: 0; overflow-y: auto; align-content: start; }
  .pl-ding { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid transparent; background: rgb(var(--wit) / 0.05); text-align: left; min-width: 0; }
  .pl-ding svg { width: 22px; height: 22px; color: var(--zacht); }
  .pl-ding b { font-size: 15px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-ding span { font-size: 12.5px; color: var(--gedempt); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-ding.alle { background: linear-gradient(160deg, rgb(247 181 72 / 0.16), rgb(247 181 72 / 0.04)); }
  .pl-ding[aria-pressed='true'] { border-color: var(--tekst); background: rgb(var(--wit) / 0.09); }
  .pl-ding[aria-pressed='true']::after { content: '✓'; position: absolute; right: 12px; top: 10px; color: var(--mint); font-weight: 800; }
  .pl-vraag { display: flex; flex-direction: column; gap: 8px; }
  .pl-vraag > span { font-size: 12.5px; font-weight: 700; color: var(--gedempt); }
  .pl-stapper { display: flex; align-items: center; gap: 12px; }
  .pl-stapper button { width: 44px; height: 44px; border-radius: 13px; border: 0; background: rgb(var(--wit) / 0.08); font-size: 21px; font-weight: 600; }
  .pl-stapper b { min-width: 170px; text-align: center; font-family: var(--kop); font-size: 24px; font-weight: 600; }
  .pl-tijd { align-self: flex-start; height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--glas-rand); background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; font-family: var(--kop); font-size: 26px; color-scheme: dark; }
  .pl-zo { font-size: 14px; color: var(--zon-t); }
  .pl-keus { display: flex; flex-direction: column; border-radius: 16px; background: rgb(var(--wit) / 0.05); padding: 2px 16px; }
  .pl-keus > button, .pl-keus > div { display: flex; align-items: center; padding: 11px 0; border: 0; border-top: 1px solid rgb(var(--wit) / 0.06); background: none; font-size: 15px; text-align: left; }
  .pl-keus > :first-child { border-top: 0; }
  .pl-keus span { flex: 1; }
  .pl-keus small { color: var(--gedempt); font-size: 13px; }
  .pl-keus > [aria-pressed='true'] { font-weight: 700; }
  .pl-keus > [aria-pressed='true']::after { content: '✓'; color: var(--mint); font-weight: 800; }
  .pl-dagen { display: flex; gap: 5px; padding: 3px; border-radius: 13px; background: rgb(var(--wit) / 0.06); }
  .pl-dagen button { flex: 1; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--zacht) !important; font-size: 14px; font-weight: 700; }
  .pl-dagen button[aria-pressed='true'] { background: rgb(var(--wit) / 0.14); color: var(--tekst) !important; }
  .pl-rij { display: flex; align-items: center; gap: 14px; font-size: 15px; padding: 12px 16px; border-radius: 16px; background: rgb(var(--wit) / 0.05); }
  .pl-rij span { flex: 1; }
  .pl-rij small { display: block; font-size: 13px; color: var(--gedempt); }
  .pl-knoppen { margin-top: auto; display: flex; align-items: center; gap: 12px; }
  .pl-terug { border: 0; background: none; padding: 0; color: var(--zacht) !important; font-weight: 600; font-size: 15px; }
