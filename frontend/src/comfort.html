<style>
  /* Comfort (besluit 130, schets Wand-Instellingen-Comfort): per kamer een band per dagdeel. */
  .bovenrij { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .nu-temp { font-family: var(--kop); font-size: 15px; color: var(--zacht); }
  .nu-temp b { font-size: 22px; color: var(--tekst); }
  .band { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 18px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); }
  .band:first-of-type { border-top: 0; }
  .band .naam b { display: block; font-size: 15px; font-weight: 600; }
  .band .naam span { font-size: 12.5px; color: var(--gedempt); }
  .schaal { position: relative; height: 42px; touch-action: none; }
  .schaal .baan { position: absolute; left: 0; right: 0; top: 15px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255, 122, 77, 0.35), rgba(255, 255, 255, 0.08) 40%, rgba(255, 255, 255, 0.08) 60%, rgba(111, 211, 255, 0.35)); }
  .schaal .goed { position: absolute; top: 13px; height: 12px; border-radius: 6px; background: rgba(110, 231, 183, 0.55); }
  .schaal .greep { position: absolute; top: 7px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; border: 0; padding: 0; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); display: grid; place-items: center; cursor: ew-resize; touch-action: none; }
  .schaal .greep i { width: 9px; height: 9px; border-radius: 50%; }
  .schaal .greep:focus-visible { outline: 3px solid var(--tekst); outline-offset: 2px; }
  .schaal .maat { position: absolute; top: 32px; font-size: 10.5px; color: var(--gedempt); transform: translateX(-50%); pointer-events: none; }
  /* Per dagdeel twee regels, met de uitleg na een tik (besluit 133, schets Wand-Comfort-Regels). */
  .regels { grid-column: 2; display: grid; grid-template-columns: 1fr; gap: 6px; }
  .regel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 8px 6px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); }
  .regel .wat { display: flex; align-items: center; gap: 6px; min-height: 30px; border: 0; padding: 0; background: none; color: var(--tekst); font: inherit; font-size: 13.5px; font-weight: 600; white-space: nowrap; text-align: left; cursor: pointer; }
  .regel .wat i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .regel .wat b { font-family: var(--kop); font-size: 15px; }
  .regel .wat em { font-style: normal; font-weight: 500; color: var(--zacht); }
  .regel .wat:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; border-radius: 8px; }
  .regel.uit .wat { color: var(--gedempt); }
  .regel small { grid-column: 1 / 3; padding: 0 0 4px; font-size: 12px; color: var(--gedempt); line-height: 1.45; }
  .regel small .z { color: var(--zon); }
  .schaal .zonband { position: absolute; top: 13px; height: 12px; border-radius: 6px; background: repeating-linear-gradient(135deg, rgba(247, 181, 72, 0.55) 0 4px, rgba(247, 181, 72, 0.15) 4px 8px); pointer-events: none; }
  .schaal .zonstip { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--zon); box-shadow: 0 0 8px rgba(247, 181, 72, 0.7); pointer-events: none; }
  .zonnet { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.07); }
  .zonnet .blok { padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.04); display: flex; flex-direction: column; gap: 8px; }
  .zonnet .label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .zonnet .uitleg { margin: 0; font-size: 12.5px; color: var(--gedempt); line-height: 1.45; }
  .zonnet .stapper b { font-size: 17px; min-width: 96px; }
  .kamerkeuze { display: flex; gap: 6px; flex-wrap: wrap; }
  .kamerkeuze button { height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, 0.07); color: var(--zacht); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .kamerkeuze button[aria-pressed='true'] { background: var(--tekst); color: var(--inkt); }
  .schakel { position: relative; flex: none; width: 36px; height: 20px; border-radius: 999px; border: 0; padding: 0; background: rgba(255, 255, 255, 0.14); cursor: pointer; transition: background 0.15s; }
  .schakel::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #c9d3dc; transition: left 0.15s; }
  .schakel[aria-checked='true'].heat { background: var(--gloed); }
  .schakel[aria-checked='true'].cool { background: var(--ijs); }
  .schakel[aria-checked='true']::after { left: 18px; background: #fff; }
  .schakel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .rij2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.07); }
  .rij2 .label { font-size: 14.5px; font-weight: 600; display: block; margin-bottom: 6px; }
  .rij2 .uitleg { font-size: 12.5px; color: var(--gedempt); margin: 6px 0 0; }
  .stapper { display: flex; align-items: center; gap: 10px; }
  .stapper button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; }
  .stapper b { font-family: var(--kop); font-size: 22px; min-width: 64px; text-align: center; }
  .stapper .geen { width: auto; border-radius: 12px; padding: 0 12px; font-size: 13px; font-weight: 700; }
  .uren { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dag { height: 34px; border-radius: 10px; overflow: hidden; display: flex; margin-top: 4px; }
  .dag i { height: 100%; }
  .dagmaat { position: relative; height: 16px; font-size: 10.5px; color: var(--gedempt); margin-top: 4px; }
  .dagmaat span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .dagmaat span:first-child { transform: none; }
  .dagmaat span:last-child { transform: translateX(-100%); }
  .daglegenda { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--zacht); }
  .daglegenda span { display: inline-flex; align-items: center; gap: 6px; }
  .daglegenda i { width: 10px; height: 10px; border-radius: 3px; }
  .schaal .niets { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: var(--gedempt); background: var(--diep, #101b2d); padding: 0 8px; border-radius: 6px; }
  .kamerlijst { display: flex; flex-direction: column; }
  .kamerlijst a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); color: inherit; text-decoration: none; font-size: 14px; }
  .kamerlijst a:first-child { border-top: 0; }
  .kamerlijst span { color: var(--gedempt); }
  #tel .band { grid-template-columns: 1fr; gap: 8px; }
  #tel .regels, #tel .zonnet { grid-column: 1; grid-template-columns: 1fr; }
  #tel .regel { padding: 8px 10px 8px 12px; }
  #tel .regel .wat { font-size: 15px; }
  #tel .schakel { width: 40px; height: 24px; }
  #tel .schakel::after { width: 18px; height: 18px; top: 3px; left: 3px; }
  #tel .schakel[aria-checked='true']::after { left: 19px; }
  #tel .rij2, #tel .uren { grid-template-columns: 1fr; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
</style>
