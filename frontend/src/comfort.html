<style>
  /* Comfort (besluit 130, schets Wand-Instellingen-Comfort): per kamer een band per dagdeel. */
  .bovenrij { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .nu-temp { font-family: var(--kop); font-size: 15px; color: var(--zacht); }
  .nu-temp b { font-size: 22px; color: var(--tekst); }
  .band { display: grid; grid-template-columns: 120px minmax(0, 1fr) 160px; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); }
  .band:first-of-type { border-top: 0; }
  .band .naam b { display: block; font-size: 15px; font-weight: 600; }
  .band .naam span { font-size: 12.5px; color: var(--gedempt); }
  .schaal { position: relative; height: 42px; touch-action: none; }
  .schaal .baan { position: absolute; left: 0; right: 0; top: 15px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255, 122, 77, 0.35), rgba(255, 255, 255, 0.08) 40%, rgba(255, 255, 255, 0.08) 60%, rgba(111, 211, 255, 0.35)); }
  .schaal .goed { position: absolute; top: 13px; height: 12px; border-radius: 6px; background: rgba(110, 231, 183, 0.55); }
  .schaal .greep { position: absolute; top: 7px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; border: 0; padding: 0; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); display: grid; place-items: center; cursor: ew-resize; touch-action: none; }
  .schaal .greep i { width: 9px; height: 9px; border-radius: 50%; }
  .schaal .greep:focus-visible { outline: 3px solid var(--tekst); outline-offset: 2px; }
  .schaal .maat { position: absolute; top: 32px; font-size: 10.5px; color: var(--gedempt); transform: translateX(-50%); pointer-events: none; }
  .waarden { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--zacht); text-align: right; }
  .waarden b { font-family: var(--kop); font-size: 15px; color: var(--tekst); }
  .waarden button { border: 0; background: none; padding: 0; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--ijs); cursor: pointer; }
  .waarden button.weg { color: var(--gedempt); margin-left: 6px; }
  .rij2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.07); }
  .rij2 .label { font-size: 14.5px; font-weight: 600; display: block; margin-bottom: 6px; }
  .rij2 .uitleg { font-size: 12.5px; color: var(--gedempt); margin: 6px 0 0; }
  .stapper { display: flex; align-items: center; gap: 10px; }
  .stapper button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; }
  .stapper b { font-family: var(--kop); font-size: 22px; min-width: 64px; text-align: center; }
  .stapper .geen { width: auto; border-radius: 12px; padding: 0 12px; font-size: 13px; font-weight: 700; }
  .uren { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dag { height: 34px; border-radius: 10px; overflow: hidden; display: flex; margin-top: 4px; }
  .dag i { height: 100%; }
  .dagmaat { position: relative; height: 16px; font-size: 10.5px; color: var(--gedempt); margin-top: 4px; }
  .dagmaat span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .dagmaat span:first-child { transform: none; }
  .dagmaat span:last-child { transform: translateX(-100%); }
  .daglegenda { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--zacht); }
  .daglegenda span { display: inline-flex; align-items: center; gap: 6px; }
  .daglegenda i { width: 10px; height: 10px; border-radius: 3px; }
  .schaal .niets { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: var(--gedempt); background: var(--diep, #101b2d); padding: 0 8px; border-radius: 6px; }
  .kamerlijst { display: flex; flex-direction: column; }
  .kamerlijst a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); color: inherit; text-decoration: none; font-size: 14px; }
  .kamerlijst a:first-child { border-top: 0; }
  .kamerlijst span { color: var(--gedempt); }
  #tel .band { grid-template-columns: 1fr; gap: 6px; }
  #tel .waarden { text-align: left; flex-direction: row; justify-content: space-between; }
  #tel .rij2, #tel .uren { grid-template-columns: 1fr; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
</style>
