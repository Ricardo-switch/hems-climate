<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Apparaten · Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png">
<link rel="apple-touch-icon" href="icoon-192.png">
<script>(function () { var d = document.documentElement; function s() { d.classList.toggle('tel-stand', innerWidth < 900 || innerHeight > innerWidth); d.style.setProperty('--wandschaal', Math.min(innerWidth / 1280, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  #wand main { display: flex; flex-direction: column; gap: 16px; height: 100%; }
  .kop { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .zonchip { display: flex; align-items: center; gap: 16px; padding: 14px 18px; flex: none; }
  .raster { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-content: start; }
  .app { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .app .boven { display: flex; align-items: center; gap: 14px; }
  .app .boven > div { min-width: 0; }
  .ring { width: 72px; height: 72px; flex: none; }
  .app b { font-size: 18px; display: block; }
  .app .zin { margin: 0; }
  .strook { position: relative; height: 26px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
  .strook i { position: absolute; top: 7px; height: 12px; border-radius: 6px; }
  .strook .nu { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--tekst); }
  .uren { display: flex; justify-content: space-between; font-size: 11px; color: var(--gedempt); margin-top: 4px; }
  .niet { border-style: dashed; background: transparent; }
  a.app { color: inherit; text-decoration: none; }
  .gezegd:empty { display: none; }

  /* Waar de zon nu heen gaat: één balk over de breedte. */
  .verdeling { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .balkje { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: rgba(255, 255, 255, 0.05); }
  .balkje i { display: block; height: 100%; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--zacht); }
  .legenda span { display: inline-flex; align-items: center; gap: 8px; }
  .legenda .stip { width: 10px; height: 10px; }
  .legenda b { color: var(--tekst); font-weight: 700; }

  /* De dag van de apparaten, naast de zon. */
  .dag { padding: 16px 20px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #wand .dag { flex: 1; justify-content: center; overflow: hidden; }
  .dagkop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
  .legenda-dag { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; }
  .legenda-dag > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legenda-dag .vlak { display: inline-block; width: 14px; height: 8px; border-radius: 4px; background: #B8C4CF; }
  .legenda-dag .vlak.zou { opacity: 0.35; }
  .legenda-dag .streep { display: inline-block; width: 16px; border-top: 2px dashed rgba(247, 181, 72, 0.6); }
  .dag .as { font-family: Figtree, sans-serif; font-size: 13px; fill: #7F8E9C; }
  /* Met veel apparaten is er op de wand geen plek voor de dag; die staat ook op Vandaag. */
  #wand .raster.vol + .dag { display: none; }

  /* De telefoon. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 12px; }
  #tel .app { padding: 16px; }
  #tel .ring { width: 64px; height: 64px; }
  #tel .verdeling { margin-top: 0; }

  .sectie { font-size: 13px; font-weight: 700; color: var(--gedempt); margin: 8px 2px 0; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="kop">
        <div><h1 class="kop-1">Apparaten</h1><p class="lead" style="max-width: 60ch; margin-top: 8px">Wat op zon kan draaien. De airco's gaan voor, en nooit meer tegelijk dan je zekering aankan.</p></div>
        <div class="glas zonchip" data-zonchip></div>
      </div>
      <div class="raster" data-apparaten></div>
      <section class="glas dag" data-dag></section>
      <section class="glas verdeling" data-verdeling></section>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h1 class="kop-1" style="font-size: 34px">Apparaten</h1>
        <a class="pil" aria-label="Instellingen" style="height: 32px; width: 32px; padding: 0; justify-content: center" data-tandwiel></a>
      </div>
      <div class="glas zonchip" data-zonchip></div>
      <div data-apparaten style="display: flex; flex-direction: column; gap: 12px"></div>
      <section class="glas dag" data-dag></section>
      <section class="glas verdeling" data-verdeling></section>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
  </div>
  <script src="kit/nav.js"></script>
  <script src="basis.js"></script>
  <script src="apparaten.js"></script>
</body>
</html>
