<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Instellingen · Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<script>(function () { var d = document.documentElement; function s() { d.classList.toggle('tel-stand', innerWidth < 900 || innerHeight > innerWidth); d.style.setProperty('--wandschaal', Math.min(innerWidth / 1280, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  /* De wand (schetsen Instellingen en Wand-Leren): comfort, wie stuurt, wat het huis weet, je huis. */
  #wand main { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 16px; height: 100%; }
  .kop { grid-column: 1 / -1; }
  .kolom { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .kaart { padding: 6px 18px 10px; }
  .kaart h2 { margin: 12px 0 2px; }
  .rij { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); color: inherit; text-decoration: none; }
  .rij:first-of-type { border-top: 0; }
  .rij .l { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .rij .l b { font-size: 15px; }
  .rij .l span { font-size: 12.5px; color: var(--gedempt); }
  a.rij:hover b { text-decoration: underline; text-underline-offset: 3px; }
  a.rij:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; border-radius: 8px; }
  .pijl { color: var(--gedempt); font-size: 20px; }
  .band { width: 120px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); position: relative; flex: none; }
  .band i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--ijs), var(--mint), var(--gloed)); }
  .fase { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); flex: none; }
  .fase i { font-style: normal; font-size: 11.5px; font-weight: 700; padding: 5px 8px; border-radius: 8px; color: var(--gedempt); }
  .fase i.leren { background: rgba(143, 134, 255, 0.25); color: #c9c3ff; }
  .fase i.kijken { background: rgba(111, 211, 255, 0.2); color: #a9e6ff; }
  .fase i.regelen { background: rgba(110, 231, 183, 0.2); color: var(--mint); }
  .bewijs { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; }
  .bewijs .balkje { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .bewijs .balkje i { display: block; height: 100%; background: var(--ijs); }
  .weet { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; font-size: 14px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .weet:first-of-type { border-top: 0; }
  .weet .uit { color: var(--gedempt); }
  .stip5 { display: inline-flex; gap: 3px; margin-left: 8px; }
  .stip5 i { width: 14px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); }
  .stip5 i.ja { background: var(--violet); }
  .klopte { padding: 0 0 8px; }
  .terugrij { display: grid; grid-template-columns: 56px 1fr 86px; gap: 10px; align-items: center; font-size: 13px; color: var(--zacht); padding: 3px 0; }
  .terugrij i { position: relative; height: 8px; border-radius: 4px; background: rgba(247, 181, 72, 0.12); }
  .terugrij i b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--zon); }
  .terugrij i em { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--tekst); }
  .terugrij span:last-child { text-align: right; color: var(--tekst); font-weight: 600; }
  .terugrij small { color: var(--gedempt); font-weight: 500; }
  .inlog button { border: 0; background: none; color: var(--ijs); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }

  /* De telefoon. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  .sectie { font-size: 13px; font-weight: 700; color: var(--gedempt); margin: 6px 2px -4px; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="kop"><h1 class="kop-1" style="font-size: 40px">Instellingen</h1><p class="lead" style="margin-top: 6px; max-width: 70ch">Bedienen doe je in het huis: tik op een kamer of een apparaat. Hier staat wat het huis weet, wie stuurt, en hoe het is ingericht.</p></div>
      <div class="kolom"><section class="glas kaart" data-comfort></section><section class="glas kaart" data-inlog></section></div>
      <div class="kolom"><section class="glas kaart" data-stuurt></section></div>
      <div class="kolom"><section class="glas kaart" data-weet></section><section class="glas kaart" data-huis></section></div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="klein" href="thuis.html" style="font-weight: 600">‹ Thuis</a>
      <h1 class="kop-1" style="font-size: 34px">Instellingen</h1>
      <p class="klein" style="margin: -6px 0 0">Bedienen doe je in het huis: tik op een kamer of een apparaat.</p>
      <div class="sectie">Comfort per kamer</div><section class="glas kaart" data-comfort></section>
      <div class="sectie">Wie stuurt</div><section class="glas kaart" data-stuurt></section>
      <div class="sectie">Wat het huis al weet</div><section class="glas kaart" data-weet></section>
      <div class="sectie">Je huis</div><section class="glas kaart" data-huis></section>
      <section class="glas kaart" data-inlog></section>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
  </div>
  <script src="kit/nav.js"></script>
  <script src="basis.js"></script>
  <script src="instellingen.js"></script>
</body>
</html>
