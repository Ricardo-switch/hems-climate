<style>
  /*
   * Instellingen (besluit 130, schets Wand-Instellingen): alles op één plek, in
   * zes groepen. Bovenaan wat er nog mist, met een knop ernaartoe, en een
   * zoekveld voor wie weet wat hij zoekt.
   */
  #wand main { display: flex; flex-direction: column; gap: 16px; height: 100%; min-height: 0; }
  .kopregel { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .zoekvak { position: relative; width: 380px; }
  .zoek { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 16px; background: rgb(var(--wit) / 0.06); border: 1px solid var(--glas-rand); color: var(--gedempt); }
  .zoek svg { width: 18px; height: 18px; flex: none; }
  .zoek input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--tekst); font: inherit; font-size: 15px; outline: none; }
  .zoek:focus-within { border-color: rgb(var(--wit) / 0.35); }
  .gevonden { position: absolute; z-index: 10; left: 0; right: 0; top: 54px; padding: 6px; border-radius: 16px; background: #0e1626; border: 1px solid var(--glas-rand); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); }
  .gevonden a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--tekst); text-decoration: none; font-size: 14.5px; font-weight: 600; }
  .gevonden a span { color: var(--gedempt); font-weight: 500; font-size: 13px; }
  .gevonden a:hover, .gevonden a:focus-visible { background: rgb(var(--wit) / 0.08); outline: none; }
  .gevonden p { margin: 8px 12px; font-size: 13.5px; color: var(--gedempt); }

  .boven { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
  .mist { padding: 14px 20px; border-color: rgba(255, 122, 77, 0.35); background: linear-gradient(160deg, rgba(255, 122, 77, 0.1), rgb(var(--wit) / 0.03)); }
  .mist.klaar { border-color: rgba(110, 231, 183, 0.3); background: linear-gradient(160deg, rgba(110, 231, 183, 0.08), rgb(var(--wit) / 0.03)); }
  .mist h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
  .mist .regel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; padding: 9px 0; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .mist .regel:first-of-type { border-top: 0; }
  .mist .regel b { font-size: 15px; }
  .mist .regel span { display: block; font-size: 13px; color: var(--zacht); }
  .doe { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--op-accent); font-weight: 700; font-size: 13.5px; white-space: nowrap; text-decoration: none; }
  .kan { padding: 16px 20px; display: block; color: inherit; text-decoration: none; }
  .kan .standen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .stand { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .stand::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .stand.werkt { color: var(--mint-t); background: rgba(110, 231, 183, 0.1); }
  .stand.leert, .stand.kijkt { color: var(--ijs-t); background: rgba(111, 211, 255, 0.1); }
  .stand.mis { color: var(--gloed-t); background: rgba(255, 122, 77, 0.12); }
  .stand.nodig { color: var(--zon-t); box-shadow: inset 0 0 0 1px rgba(247, 181, 72, 0.45); }
  .stand.uit { color: var(--gedempt); background: rgb(var(--wit) / 0.06); }

  .groepen { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 14px; min-height: 0; }
  .tegel { padding: 16px 18px 14px; display: flex; flex-direction: column; color: inherit; text-decoration: none; min-height: 0; }
  .tegel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .tegel .titel { display: flex; align-items: center; gap: 12px; }
  .tegel .icoon { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); flex: none; }
  .tegel .icoon svg { width: 22px; height: 22px; }
  .tegel h3 { margin: 0; font-family: var(--kop); font-size: 19px; font-weight: 600; }
  .tegel .pijl { margin-left: auto; color: var(--gedempt); font-size: 22px; }
  .tegel ul { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; color: var(--zacht); }
  .tegel li { display: flex; justify-content: space-between; gap: 12px; }
  .tegel li b { color: var(--tekst); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tegel li b.leeg { color: var(--gloed-t); }
  .tegel .onder { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; color: var(--gedempt); }
  .tegel.aandacht { border-color: rgba(255, 122, 77, 0.4); }

  /* De telefoon. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .zoekvak { width: auto; }
  #tel .boven, #tel .groepen { grid-template-columns: 1fr; display: flex; flex-direction: column; }
  /* Jij (besluit 181): je profiel, bovenaan; eerst stond hier alleen Weergave (besluit 164). */
  .jijregel { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: inherit; text-decoration: none; }
  .jijregel > span:not(.jijrondje):not(.pijl) { flex: 1; }
  .jijregel b { display: block; font-size: 16px; }
  .jijregel span span { font-size: 13px; color: var(--gedempt); }
  .jijregel .pijl { color: var(--gedempt); font-size: 18px; }
  .jijrondje { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--op-accent); font-family: var(--kop); font-weight: 700; font-size: 18px; flex: none; }
  .pil.jijpil { height: 48px; padding: 0 16px 0 6px; gap: 10px; color: var(--tekst); text-decoration: none; }
  .jijpil .jijrondje { width: 36px; height: 36px; font-size: 16px; }
</style>
</head>

      <a class="knop knop-licht" href="inrichten.html" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none">Inrichten, stap voor stap</a>
