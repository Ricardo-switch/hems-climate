<style>
  /* Functies (besluit 130): camera's, de deurbel, licht en screens, het weer, en praten met je huis (148). */
  .vorm .uitleg { font-size: 13px; color: var(--zacht); margin: 0; line-height: 1.45; }
  .vorm .mini { margin: 0; }
  /* Terug naar standaard (besluit 204): klein, rechtsboven in het vak. */
  .vorm { position: relative; }
  .vorm .stdknop { position: absolute; top: 18px; right: 22px; height: 30px; padding: 0 12px; font-size: 13px; z-index: 1; }
  .vorm.metstd > h2:first-of-type { padding-right: 200px; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  /* Praten met je huis (besluit 148): het vaste antwoord naast eigen woorden, en wat er naar buiten gaat. */
  .proef { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .proef div { padding: 12px 14px; border-radius: 14px; background: rgb(var(--wit) / 0.04); font-size: 14px; line-height: 1.45; }
  .proef div span { display: block; font-size: 11.5px; font-weight: 700; color: var(--gedempt); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .proef .eigen { background: rgba(143, 134, 255, 0.1); border: 1px solid rgba(143, 134, 255, 0.25); }
  .buiten { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; line-height: 1.45; color: var(--zacht); }
  .buiten b { display: block; font-size: 13px; margin-bottom: 2px; }
  .buiten .wel { color: var(--zon-t); }
  .buiten .niet { color: var(--mint-t); }
  #tel .proef, #tel .buiten { grid-template-columns: 1fr; }
  /* Licht en screens per kamer (besluit 167): knopjes per lamp en screen, op de wand in twee kolommen. */
  .lichtkamers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  #tel .lichtkamers { grid-template-columns: 1fr; }
  .lichtkamer { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lichtkamer b { font-size: 14px; }
  .lichtkamer .keuzes button { height: 32px; padding: 0 11px; font-size: 13px; }
  .lichtkamer .keuzes button small { font-weight: 600; opacity: 0.7; }
