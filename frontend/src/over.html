<style>
  /*
   * Over deze app (1 november 2026): het logo groot en voluit, wat de naam
   * betekent, de versie met wat er nieuw is, en waar de broncode staat. Een
   * tik op het logo bij de klok of in de balk brengt je hier.
   */
  .over { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 28px; height: 100%; min-height: 0; align-items: center; }
  .voluit { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .voluit img { width: 400px; height: auto; }

  .voluit .arc b { color: var(--zon-t); font-weight: 800; }
  .overvak { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
  .overvak h2 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--gedempt); }
  .overvak p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--zacht); }
  .overvak .versie { font-family: var(--kop); font-size: 26px; font-weight: 600; color: var(--tekst); }
  .overvak ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 14px; color: var(--zacht); }
  .overvak li { display: flex; gap: 8px; }

  .overvak a { color: var(--ijs-t); font-weight: 600; text-decoration: none; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 18px; }
  #tel .voluit { padding: 20px 0 6px; }
  #tel .voluit img { width: 220px; }
  #tel .voluit .woord { font-size: 64px; margin-top: 12px; }
