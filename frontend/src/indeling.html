<head>

<script>(function () { var d = document.documentElement; function s() { var b = Math.min(1700, Math.max(1280, Math.round(800 * innerWidth / innerHeight))); d.classList.toggle('tel-stand', innerWidth < 900 || innerHeight > innerWidth); d.style.setProperty('--wandbreedte', b + 'px'); d.style.setProperty('--wandschaal', Math.min(innerWidth / b, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  /* De wand (schets Wand-Indeling): de etages links, het huis in het midden, het blad rechts, onderin wat nog nergens staat. */
  #wand main { position: relative; }
  #wand .kop { position: absolute; left: 22px; right: 26px; top: 22px; display: flex; justify-content: space-between; align-items: end; gap: 16px; }
  .terugnaar { font-size: 14px; font-weight: 600; color: var(--zacht); text-decoration: none; }
  .terugnaar:hover { color: var(--tekst); }
  .acties { display: flex; gap: 10px; align-items: center; }
  .acties .knop { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; text-decoration: none; }
  .status { font-size: 12.5px; color: var(--gedempt); max-width: 34ch; text-align: right; }
  .status.fout { color: #ffb090; }
  #wand .etages { position: absolute; left: 22px; top: 120px; width: 190px; display: flex; flex-direction: column; gap: 8px; }
  .etage { padding: 12px 14px; border-radius: 16px; border: 1px solid var(--glas-rand); background: var(--glas); display: flex; flex-direction: column; gap: 2px; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .etage b { font-size: 15px; }
  .etage span { font-size: 12.5px; color: var(--gedempt); }
  .etage[aria-pressed='true'] { border-color: rgba(111, 211, 255, 0.55); background: rgba(111, 211, 255, 0.1); }
  .etage.nieuw { border-style: dashed; background: transparent; color: var(--ijs); font-weight: 700; font-size: 14px; align-items: center; }
  #wand .etages { max-height: 520px; overflow: auto; }
  .etage.doel { border-color: var(--mint); box-shadow: 0 0 0 1px var(--mint); }
  .etage:focus-visible, .chip:focus-visible, .app:focus-visible, .kamerrij:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  #wand .podium { position: absolute; left: 226px; top: 92px; width: 580px; height: 560px; }
  #wand .blad { position: absolute; right: 26px; top: 96px; bottom: 118px; width: 330px; padding: 18px; overflow: auto; }
  .blad { display: flex; flex-direction: column; gap: 14px; }
  .blad > * { flex-shrink: 0; }
  .bladkop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .bladkop h2 { margin: 0; }
  .label { font-size: 12.5px; color: var(--gedempt); margin-bottom: 6px; display: block; }
  .soortlabel { display: flex; align-items: center; gap: 6px; }
  .veld { width: 100%; height: 42px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.05); color: var(--tekst); padding: 0 12px; font: inherit; font-size: 15px; font-weight: 600; }
  .veld:focus { outline: 2px solid var(--ijs); outline-offset: 1px; }
  select.veld { cursor: pointer; }
  select.veld option { background: #13203a; color: var(--tekst); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 600; color: var(--tekst); border: 0; cursor: pointer; touch-action: none; user-select: none; }
  .chip.plus { background: transparent; border: 1px dashed rgba(111, 211, 255, 0.6); color: var(--ijs); touch-action: auto; }
  .chip.zon { background: transparent; border: 1px dashed var(--zon); }
  .chip[aria-pressed='true'] { background: var(--tekst); color: #0b1424; }
  .chip.uitchip { color: var(--zacht); }
  .chip .weg { color: var(--gedempt); font-weight: 700; }
  .app { display: flex; align-items: center; gap: 10px; padding: 8px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.06); background: none; width: 100%; color: inherit; font: inherit; font-size: 14px; text-align: left; cursor: pointer; touch-action: none; user-select: none; }
  .app:first-of-type { border-top: 0; }
  .greep { color: var(--gedempt); letter-spacing: -2px; font-weight: 700; }
  .app .l { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .app .l span { font-size: 12px; color: var(--gedempt); }
  .kamerrij { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.06); background: none; width: 100%; color: inherit; font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
  .kamerrij:first-of-type { border-top: 0; }
  .kamerrij span { font-size: 12.5px; font-weight: 500; color: var(--gedempt); }
  .rijknoppen { display: flex; gap: 8px; flex-wrap: wrap; }
  .gevaar { color: #ffb090; border-color: rgba(255, 122, 77, 0.35); }
  .terug { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--zacht); background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; align-self: start; }
  #wand .bak { position: absolute; left: 22px; right: 26px; bottom: 20px; height: 82px; }
  .bak { border-radius: 22px; border: 1px dashed rgba(247, 181, 72, 0.5); background: rgba(247, 181, 72, 0.05); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
  .bak .uitleg { flex: 0 0 300px; }
  .bak .chips { flex: 1; flex-wrap: nowrap; overflow-x: auto; padding: 4px 0; }
  .bak .chips .chip { flex: none; }
  .bak.leeg { border-color: rgba(110, 231, 183, 0.35); background: rgba(110, 231, 183, 0.04); }
  /* Slepen: een kaartje onder de vinger. */
  .sleep { position: fixed; z-index: 50; display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 10px; border-radius: 14px; background: #f2f6f9; color: #0b1424; font-weight: 700; font-size: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); transform: translate(-30%, -70%) rotate(-3deg); pointer-events: none; }
  .sleep i { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff2d8, #ffc27a); display: block; }
  .sleept { opacity: 0.4; }

  /* De telefoon. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .etages { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  #tel .etage { flex: none; padding: 8px 12px; }
  #tel .podium { width: 100%; height: 260px; }
  #tel .blad { padding: 16px; }
  #tel .bak { flex-direction: column; align-items: stretch; padding: 14px 16px; gap: 10px; }
  #tel .bak .uitleg { flex: none; }
  #tel .bak .chips { flex-wrap: wrap; }
</style>
</head>

  <script src="kit/nav.js"></script>
