<head>

<style>
  /*
   * Kamers en indeling als groep (besluit 193, schets Wand-Indeling-Groep), net
   * als Energie: links de delen (de etages, Buiten, wat nog geen plek heeft en
   * wat verborgen is), rechts het gekozen deel. Een etage is de tekening zonder
   * dak met het blad ernaast, en eronder de strook met wat nog in te delen is.
   */
  .groep .groepkop .status { margin-left: auto; }
  .status { font-size: 13.5px; font-weight: 600; color: var(--gedempt); max-width: 46ch; text-align: right; }
  .status.fout { color: var(--gloed-zacht); }
  .vormkop { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .vormkop h2 { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vormkop .mini { margin: 0; white-space: nowrap; }
  .vormkop [data-ongedaan] { margin-left: auto; flex: none; white-space: nowrap; }
  #wand .vormvak .vorm { padding: 18px 24px 0; gap: 12px; }
  #wand .binnen { flex: 1 1 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; min-height: 0; }
  #wand .links { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #wand .podium { flex: 1 1 0; position: relative; min-height: 0; overflow: hidden; margin: -6px 0 0 -14px; }
  #wand .blad { padding: 14px 16px; border-radius: 18px; background: rgb(var(--wit) / 0.045); border: 1px solid rgb(var(--wit) / 0.07); overflow: auto; overscroll-behavior: contain; touch-action: pan-y; min-height: 0; }
  #wand .bak { flex: none; min-height: 64px; }
  #wand [data-lijst] { flex: 1 1 0; min-height: 0; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; }
  /* Nog in te delen en Verborgen: een lijst in plaats van de tekening; een nieuwe etage: alleen het blad. */
  .binnen.lijstdeel .podium, .binnen.lijstdeel .bak, .binnen.alleenblad .podium, .binnen.alleenblad .bak { display: none; }
  .binnen:not(.lijstdeel) [data-lijst] { display: none; }
  #wand .binnen.alleenblad { grid-template-columns: minmax(0, 540px); }
  #wand .binnen.alleenblad .links { display: none; }
  .bak.leeg { display: none; }
  .applijst { display: flex; flex-direction: column; gap: 6px; }
  .applijst .app { padding: 10px 12px; border: 1px solid transparent; border-radius: 14px; background: rgb(var(--wit) / 0.045); }
  .applijst .app[aria-pressed='true'] { background: rgb(var(--wit) / 0.1); border-color: rgb(var(--wit) / 0.2); }
  .applijst .pijl { color: var(--gedempt); font-size: 20px; }
  .lijstkop { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .lijstkop .chip { align-self: start; }
  /* Rond het huis (besluit 158, 193): hetzelfde lijstje als Inrichten › Buiten. */
  .rondrij { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 7px 0; border-top: 1px solid rgb(var(--wit) / 0.06); }
  .rondrij:first-child { border-top: 0; }
  .rondrij.in { padding-left: 20px; }
  .rondrij > i { display: grid; color: var(--zacht); }
  .rondrij > i svg { width: 20px; height: 20px; }
  .rondrij b { display: block; font-size: 14px; }
  .rondrij .zin { display: block; font-size: 12px; color: var(--gedempt); }
  .rondrij .onder { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .rondrij .onder .veld { height: 36px; font-size: 13px; }
  .schakel[disabled] { opacity: 0.35; cursor: default; }
  .deel.doel { box-shadow: inset 0 0 0 2px var(--mint); }
  .blad { display: flex; flex-direction: column; gap: 14px; }
  .blad > * { flex-shrink: 0; }
  .bladkop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .bladkop h2 { margin: 0; }
  .label { font-size: 12.5px; color: var(--gedempt); margin-bottom: 6px; display: block; }
  .soortlabel { display: flex; align-items: center; gap: 6px; }
  .veld { width: 100%; height: 42px; border-radius: 12px; border: 1px solid rgb(var(--wit) / 0.18); background: rgb(var(--wit) / 0.05); color: var(--tekst); padding: 0 12px; font: inherit; font-size: 15px; font-weight: 600; }
  .veld:focus { outline: 2px solid var(--ijs); outline-offset: 1px; }
  select.veld { cursor: pointer; }
  select.veld option { background: #13203a; color: var(--tekst); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 32px; padding: 0 12px; border-radius: 999px; background: rgb(var(--wit) / 0.07); display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 600; color: var(--tekst); border: 0; cursor: pointer; user-select: none; }
  .chip.plus { background: transparent; border: 1px dashed rgba(111, 211, 255, 0.6); color: var(--ijs-t); }
  .chip:focus-visible, .app:focus-visible, .kamerrij:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  /*
   * Slepen en vegen samen (16 oktober 2026): op een apparaat schuift verticaal
   * vegen de lijst, en zijwaarts trekken pakt het op. In de balk onderaan, die
   * zelf zijwaarts schuift, is het andersom: omhoog trekken pakt het op.
   */
  [data-app] { touch-action: pan-y; }
  .bak [data-app] { touch-action: pan-x; }
  .chip.zon { background: transparent; border: 1px dashed var(--zon); }
  .chip[aria-pressed='true'] { background: var(--accent); color: var(--op-accent); }
  .chip.uitchip { color: var(--zacht); }
  .chip .weg { color: var(--gedempt); font-weight: 700; }
  .app { display: flex; align-items: center; gap: 10px; padding: 8px 0; border: 0; border-top: 1px solid rgb(var(--wit) / 0.06); background: none; width: 100%; color: inherit; font: inherit; font-size: 14px; text-align: left; cursor: pointer; user-select: none; }
  .app:first-of-type { border-top: 0; }
  .greep { color: var(--gedempt); letter-spacing: -2px; font-weight: 700; }
  .app .l { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .app .l span { font-size: 12px; color: var(--gedempt); }
  .kamerrij { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid rgb(var(--wit) / 0.06); background: none; width: 100%; color: inherit; font: inherit; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
  .kamerrij:first-of-type { border-top: 0; }
  .kamerrij span { font-size: 12.5px; font-weight: 500; color: var(--gedempt); }
  .rijknoppen { display: flex; gap: 8px; flex-wrap: wrap; }
  .gevaar { color: var(--gloed-zacht); border-color: rgba(255, 122, 77, 0.35); }
  .terug { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--zacht); background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; align-self: start; }
  .bak { border-radius: 22px; border: 1px dashed rgba(247, 181, 72, 0.5); background: rgba(247, 181, 72, 0.05); display: flex; align-items: center; gap: 16px; padding: 0 20px; }
  .bak .uitleg { flex: 0 0 300px; }
  .bak .chips { flex: 1; flex-wrap: nowrap; overflow-x: auto; padding: 4px 0; }
  .bak .chips .chip { flex: none; }
  .bak.leeg { border-color: rgba(110, 231, 183, 0.35); background: rgba(110, 231, 183, 0.04); }
  /* Slepen: een kaartje onder de vinger. */
  .sleep { position: fixed; z-index: 50; display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 10px; border-radius: 14px; background: #f2f6f9; color: #0b1424; font-weight: 700; font-size: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); transform: translate(-30%, -70%) rotate(-3deg); pointer-events: none; }
  .sleep i { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff2d8, #ffc27a); display: block; }
  .sleept { opacity: 0.4; }

  /* Verwarmen en koelen per kamer (besluit 132, schets Wand-Indeling-Warmte). */
  .kamertabs { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 4px; padding: 4px; border-radius: 12px; background: rgb(var(--wit) / 0.06); }
  .kamertabs button { height: 32px; white-space: nowrap; border: 0; border-radius: 9px; background: none; color: var(--zacht); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .kamertabs button[aria-selected='true'] { background: var(--accent); color: var(--op-accent); }
  .bron { padding: 12px 14px; border-radius: 16px; background: rgb(var(--wit) / 0.05); border: 1px solid rgb(var(--wit) / 0.07); display: flex; flex-direction: column; gap: 8px; }
  .bron[data-bron-open] { cursor: pointer; }
  .bron[data-bron-open]:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .bron .boven { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .bron .ikoon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 122, 77, 0.14); }
  .bron .ikoon.koel { background: rgba(111, 211, 255, 0.14); }
  .bron .ikoon svg { width: 20px; height: 20px; }
  .bron b { display: block; font-size: 15px; }
  .bron .wat { font-size: 12.5px; color: var(--gedempt); }
  .bron .w { font-family: var(--kop); font-size: 16px; font-weight: 600; color: var(--zacht); white-space: nowrap; }
  .bron .regelt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--zacht); padding-top: 8px; border-top: 1px solid rgb(var(--wit) / 0.06); }
  .bron .regelt b { display: inline; font-size: 13px; }
  .bron .regelt .mini, .bron .regelt .stand { margin-left: auto; }
  .stand { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .stand::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .stand.slim { color: var(--mint-t); background: rgba(110, 231, 183, 0.1); }
  .stand.hand { color: var(--zacht); background: rgb(var(--wit) / 0.07); }
  .bron .opzon { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--zacht); }
  .schakel { position: relative; flex: none; margin-left: auto; width: 44px; height: 26px; border-radius: 999px; border: 0; padding: 0; background: rgb(var(--wit) / 0.14); cursor: pointer; }
  .schakel::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #c9d3dc; transition: left 0.15s; }
  .schakel[aria-checked='true'] { background: var(--mint); }
  .schakel[aria-checked='true']::after { left: 21px; background: #fff; }
  .bron .idee { padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(247, 181, 72, 0.3); background: rgba(247, 181, 72, 0.06); font-size: 13px; color: var(--zacht); line-height: 1.45; }
  .bron .idee b { display: block; color: var(--zon-t); font-size: 13px; margin-bottom: 2px; }
  /* De regeling per kamer (besluit 138). */
  .rolrij { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; border-top: 1px solid rgb(var(--wit) / 0.06); font-size: 13px; color: var(--gedempt); }
  .rolrij .veld { width: auto; height: 34px; padding: 0 10px; font-size: 13px; font-weight: 700; }
  .rolzin { margin: 0; font-size: 12.5px; color: var(--gedempt); line-height: 1.4; }
  .keuzes { display: flex; flex-direction: column; gap: 6px; }
  .keuze { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid transparent; background: rgb(var(--wit) / 0.04); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  /* Zo hoog als de tekst (besluit 167): de knoppen van basis.css hebben een vaste hoogte, en dan liep de uitleg over de volgende keuze. */
  .keuzes button.keuze { height: auto; font-weight: inherit; font-size: inherit; color: inherit; border-color: transparent; }
  .keuzes button.keuze.aan { border-color: rgb(var(--wit) / 0.35); }
  .keuze.aan { border-color: rgb(var(--wit) / 0.35); background: rgb(var(--wit) / 0.08); }
  .keuze i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gedempt); margin-top: 2px; box-sizing: border-box; }
  .keuze.aan i { border: 5px solid var(--tekst); }
  .keuze b { display: block; font-size: 13.5px; }
  .keuze span span { font-size: 12px; color: var(--gedempt); line-height: 1.35; }
  .uitleg { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--gedempt); line-height: 1.45; }
  .uitleg b { color: var(--zacht); }
  .vraagknop { align-self: start; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px dashed rgba(111, 211, 255, 0.55); background: none; color: var(--ijs-t); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .plus { height: 42px; border-radius: 14px; border: 1px dashed rgba(111, 211, 255, 0.55); background: none; color: var(--ijs-t); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .vraag { display: flex; flex-direction: column; gap: 6px; }
  .vraag .label { margin: 0; }
  .invoer { display: flex; align-items: center; gap: 8px; height: 42px; border-radius: 12px; border: 1px solid rgb(var(--wit) / 0.18); background: rgb(var(--wit) / 0.05); padding: 0 12px; }
  .invoer input { flex: 1; min-width: 0; border: 0; background: none; color: var(--tekst); font: inherit; font-size: 15px; font-weight: 600; }
  .invoer input:focus { outline: none; }
  .invoer:focus-within { outline: 2px solid var(--ijs); outline-offset: 1px; }
  .invoer span { color: var(--gedempt); font-size: 13px; }
  .knoppenrij { display: flex; gap: 8px; flex-wrap: wrap; }
  .knoppenrij .knop { flex: 1; }
  /* Een zone per rij: naam, soort, schuiven en weghalen (besluit 145). */
  .zonerij { display: grid; grid-template-columns: minmax(0, 1fr) 40px 40px; grid-template-areas: "naam naam weg" "soort links rechts"; gap: 6px; align-items: center; margin-bottom: 10px; }
  .zonerij.enkel { grid-template-areas: "naam naam weg" "soort soort soort"; }
  .zonerij .veld { min-width: 0; }
  .zonerij [data-zone-naam] { grid-area: naam; }
  .zonerij [data-zone-soort] { grid-area: soort; }
  .zonerij [data-zone-schuif="-1"] { grid-area: links; }
  .zonerij [data-zone-schuif="1"] { grid-area: rechts; }
  .zonerij [data-zone-weg] { grid-area: weg; }
  .zonerij .klein-knop { width: 40px; min-width: 40px; height: 40px; padding: 0; justify-content: center; }
  .zonerij .klein-knop[disabled] { opacity: 0.35; }

  #wand .bak { padding: 0 16px; gap: 14px; }
  #wand .bak .uitleg { flex: 0 1 250px; }

  /* De telefoon: een deel als eigen scherm, de tekening boven het blad. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .groepkop .status { text-align: left; }
  #tel .vorm { padding: 16px; gap: 12px; }
  #tel .vormkop h2 { font-size: 26px; flex: 1; }
  /* Wat het deel bevat, staat al in de lijst; op de telefoon is er alleen plek voor de naam en Ongedaan maken. */
  #tel .vormkop .mini { display: none; }
  #tel .binnen, #tel .links { display: flex; flex-direction: column; gap: 12px; }
  #tel .podium { height: 260px; margin: 0 -10px; }
  #tel .blad { padding-top: 14px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  #tel .binnen.alleenblad .blad { padding-top: 0; border-top: 0; }
  #tel .bak { flex-direction: column; align-items: stretch; padding: 14px 16px; gap: 10px; }
  #tel .bak .uitleg { flex: none; }
  #tel .bak .chips { flex-wrap: wrap; }
</style>
</head>
<body class="lucht lucht-dag">

    <nav class="balk" id="balk" data-t-aria-label="nav.hoofdmenu"></nav>
    <main class="groep">
      <div class="groepkop">
        <a class="terugje" href="instellingen.html" data-t="jij.terugInstellingen"></a>
        <h1 class="kop-1" data-t="indeling.kop"></h1>
        <span class="samen" data-samen></span>
        <span class="status" data-status aria-live="polite" data-t="indeling.nietsInHA"></span>
      </div>
      <div class="groepveld">
        <nav class="glas delen schuift" data-t-aria-label="indeling.delen" data-delen></nav>
        <div class="glas vormvak" data-waarvoor-vak>
          <section class="vorm" data-vorm>
          <div class="vormkop"><h2 class="kop-2" data-deelkop></h2><span class="mini" data-deelzin></span><button type="button" class="knop" data-ongedaan disabled data-t="indeling.ongedaan"></button></div>
          <div class="binnen" data-binnen>
            <div class="links">
              <div class="podium" id="podium-wand"></div>
              <div data-lijst></div>
              <div class="bak" data-bak></div>
            </div>
            <aside class="blad" data-blad data-t-aria-label="indeling.gekozenBlad"></aside>
          </div>
          </section>
          <div class="voet"><button type="button" class="waarvoor" data-waarvoor aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.1-2.4 3.8"/><path d="M12 17h.01"/></svg><span data-t="groep.waarvoor"></span></button><div class="verder" data-verder></div></div>
          <aside class="naast" data-naast></aside>
        </div>
      </div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="terugje" href="instellingen.html" data-terug data-t="jij.terugInstellingen"></a>
      <div class="groepkop"><h1 class="kop-1" style="font-size: 34px" data-t="indeling.kop"></h1><span class="status" data-status aria-live="polite" data-t="indeling.nietsInHA"></span></div>
      <span class="samen" data-samen></span>
      <nav class="glas delen" data-t-aria-label="indeling.delen" data-delen></nav>
      <section class="glas vorm" data-vorm>
          <div class="vormkop"><h2 class="kop-2" data-deelkop></h2><span class="mini" data-deelzin></span><button type="button" class="knop" data-ongedaan disabled data-t="indeling.ongedaan"></button></div>
          <div class="binnen" data-binnen>
            <div class="links">
              <div class="podium" id="podium-tel"></div>
              <div data-lijst></div>
              <div class="bak" data-bak></div>
            </div>
            <aside class="blad" data-blad data-t-aria-label="indeling.gekozenBlad"></aside>
          </div>
      </section>
      <div class="naast" data-naast></div>
      <div class="verder" data-verder></div>
    </div>
    <nav class="tabs" id="tabs" data-t-aria-label="nav.hoofdmenu"></nav>
  </div>
  <script src="kit/teksten.nl.js"></script>
  <script src="kit/teksten.en.js"></script>
  <script src="kit/taal.js"></script>
  <script src="kit/nav.js"></script>
  <script src="kit/huis.js"></script>
  <script src="basis.js"></script>
  <script src="groep.js"></script>
  <script src="huismodel.js"></script>
  <script src="indeling.js"></script>
</body>
</html>
