<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Vandaag · Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png">
<link rel="apple-touch-icon" href="icoon-192.png">
<script>(function () { var d = document.documentElement; function s() { var b = Math.min(1700, Math.max(1280, Math.round(800 * innerWidth / innerHeight))); d.classList.toggle('tel-stand', innerHeight > innerWidth || innerWidth < 560); d.style.setProperty('--wandbreedte', b + 'px'); d.style.setProperty('--wandschaal', Math.min(innerWidth / b, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  /* De wand (schets Wand-Vandaag): de dag als tijdlijn, en wat er gebeurde en komt. */
  #wand main { display: flex; flex-direction: column; gap: 16px; height: 100%; }
  .kopregel { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .wissel { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); }
  .wissel button { height: 34px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--zacht); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  .wissel button[aria-pressed='true'] { background: var(--tekst); color: #0b1424; }
  .wissel button:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .tijdlijn { padding: 16px 20px 10px; }
  .tijdlijn svg { display: block; width: 100%; height: auto; }
  .tijdlijn .stip { cursor: pointer; }
  .tijdlijn .stip:focus-visible { outline: none; stroke: #fff; stroke-width: 3; }
  .kaarten { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  .kaart { padding: 18px 22px; display: flex; flex-direction: column; min-height: 0; }
  .kaart .wanneer { font-family: var(--kop); font-size: 15px; font-weight: 600; }
  .kaart .bovenrij { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .kaart .bladeren { display: flex; gap: 6px; margin-top: auto; padding-top: 12px; }
  .kaart .bladeren button { height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--glas-rand); background: rgba(255, 255, 255, 0.05); color: var(--zacht); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .kaart .bladeren button:disabled { opacity: 0.35; cursor: default; }
  .plan { border-color: rgba(143, 134, 255, 0.3); }

  /* De telefoon (schets Vandaag): de dag als lijst van momenten. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .wissel { display: grid; grid-template-columns: repeat(3, 1fr); }
  #tel .wissel button { height: 36px; }
  .zonkaart { padding: 14px 16px 8px; }
  .lijn { position: relative; padding-left: 72px; display: flex; flex-direction: column; gap: 12px; }
  .lijn::before { content: ''; position: absolute; left: 58px; top: 6px; bottom: 6px; width: 2px; background: rgba(255, 255, 255, 0.1); }
  .moment { position: relative; padding: 12px 14px; }
  .moment .tijd { position: absolute; left: -74px; top: 12px; width: 44px; text-align: right; font-family: var(--kop); font-weight: 600; font-size: 14px; color: var(--zacht); }
  .moment::before { content: ''; position: absolute; left: -19px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--kleur, var(--zacht)); box-shadow: 0 0 0 4px #0f1b2e; }
  .moment b { display: block; font-size: 15px; }
  .moment.verwacht { border-style: dashed; border-color: rgba(143, 134, 255, 0.4); background: rgba(143, 134, 255, 0.06); }
  .nu { position: relative; display: flex; align-items: center; gap: 10px; margin: 2px 0; }
  .nu span { background: var(--tekst); color: #0b1424; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px; position: absolute; left: -74px; }
  .nu i { flex: 1; height: 2px; background: var(--tekst); margin-left: -14px; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="kopregel">
        <div><h1 class="kop-1">Vandaag</h1><p class="lead" style="max-width: 62ch; margin-top: 8px" data-lead></p></div>
        <div class="wissel" role="group" aria-label="Dag" data-wissel></div>
      </div>
      <section class="glas tijdlijn" data-tijdlijn></section>
      <div class="kaarten">
        <section class="glas kaart" data-momentkaart aria-live="polite"></section>
        <section class="glas kaart plan" data-verwacht></section>
      </div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <h1 class="kop-1" style="font-size: 34px">Vandaag</h1>
      <div class="wissel" role="group" aria-label="Dag" data-wissel></div>
      <section class="glas zonkaart" data-zonkaart></section>
      <div class="lijn" data-lijn></div>
      <p class="mini" style="margin: 0 2px" data-voet></p>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
  </div>
  <script src="kit/nav.js"></script>
  <script src="basis.js"></script>
  <script src="vandaag.js"></script>
</body>
</html>
