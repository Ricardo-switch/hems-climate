<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Inrichten · Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png">
<link rel="apple-touch-icon" href="icoon-192.png">
<script>(function () { var d = document.documentElement, w0 = 0, h0 = 0; function s() { var a = document.activeElement; if (w0 === innerWidth && innerHeight < h0 && a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return; w0 = innerWidth; h0 = innerHeight; var b = Math.min(1700, Math.max(1280, Math.round(800 * innerWidth / innerHeight))); d.classList.toggle('tel-stand', innerHeight > innerWidth || innerWidth < 560); d.style.setProperty('--wandbreedte', b + 'px'); d.style.setProperty('--wandschaal', Math.min(innerWidth / b, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  /*
   * Inrichten in één keer (besluit 139, schets Wand-Inrichten): over het hele
   * scherm, zonder menu. Bovenaan de stappen, links het huis dat meegroeit,
   * rechts één vraag tegelijk.
   */
  #wand { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding: 20px 26px 22px; gap: 10px; }
  .veld { height: 38px; padding: 0 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.06); color: var(--tekst); font: inherit; font-size: 14px; font-weight: 600; color-scheme: dark; }
  .veld option { background: #14203a; color: var(--tekst); }
  .bovenbalk { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .merk { display: flex; align-items: center; gap: 12px; font-family: var(--kop); font-weight: 600; font-size: 20px; color: var(--tekst); text-decoration: none; }
  .merk i { width: 34px; height: 34px; border-radius: 10px; background: conic-gradient(from 200deg, #ff7a4d, #f7b548, #6ee7b7, #6fd3ff, #8f86ff, #ff7a4d); display: block; }
  .stappen { display: flex; gap: 4px; flex-wrap: wrap; justify-content: end; }
  .stap { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 6px; border-radius: 999px; border: 0; background: none; color: var(--gedempt); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .stap .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: rgba(255, 255, 255, 0.08); color: var(--zacht); }
  .stap.klaar .n { background: rgba(110, 231, 183, 0.2); color: var(--mint); }
  .stap.nu { background: rgba(255, 255, 255, 0.1); color: var(--tekst); }
  .stap.nu .n { background: var(--tekst); color: #0b1424; }
  .stap:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  /* Per hoofdstuk de stapjes erin (besluit 144). */
  .stap .stipjes { display: inline-flex; gap: 3px; }
  .stap .stipjes i { width: 10px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); }
  .stap .stipjes i.al { background: var(--mint); }
  .stap .stipjes i.nu { background: var(--tekst); }
  #tel .stap .stipjes { display: none; }
  .veldje { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 20px; min-height: 0; }
  .podium { min-height: 0; display: grid; place-items: center; }
  .kaart { padding: 26px 28px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: hidden; }
  .kaart .waar { font-size: 13.5px; font-weight: 600; color: var(--gedempt); }
  .kaart h1 { margin: 0; }
  .kaart .uitleg { margin: 0; font-size: 16px; line-height: 1.5; color: var(--zacht); max-width: 46ch; }
  .rijen { display: flex; flex-direction: column; min-height: 0; overflow: auto; overscroll-behavior: contain; margin: 0 -6px; padding: 0 6px; }
  .rij { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .rij:first-child { border-top: 0; }
  .rij > b { font-size: 15px; padding-top: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 34px; padding: 0 11px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--tekst); font: inherit; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .chip.aan { background: var(--tekst); color: #0b1424; }
  .chip.gevonden { background: rgba(110, 231, 183, 0.12); color: var(--mint); cursor: default; }
  .chip.plus { background: none; border: 1px dashed rgba(111, 211, 255, 0.55); color: var(--ijs); }
  .chip:focus-visible, .veld:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .zacht { font-size: 13.5px; color: var(--gedempt); padding-top: 7px; }
  .bewerk { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); }
  .bewerk .veld { width: auto; flex: 1; min-width: 120px; height: 36px; }
  .toestel { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 4px 4px 4px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); font-size: 13.5px; font-weight: 600; }
  .toestel .veld { width: auto; height: 32px; padding: 0 8px; font-size: 12.5px; font-weight: 700; }
  .kolom { display: flex; flex-direction: column; gap: 6px; }
  .schuif { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13.5px; color: var(--zacht); }
  .schuif input { width: 100%; accent-color: var(--ijs); }
  .schuif.warm input { accent-color: var(--gloed); }
  .schuif b { font-family: var(--kop); font-size: 18px; text-align: right; color: var(--tekst); }
  .cijfers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cijfers div { padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); }
  .cijfers b { display: block; font-family: var(--kop); font-size: 28px; font-weight: 700; }
  .cijfers span { font-size: 13.5px; color: var(--zacht); }
  .noot { padding: 12px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); font-size: 14px; line-height: 1.5; color: var(--zacht); }
  .noot.later { border: 1px solid rgba(247, 181, 72, 0.35); background: rgba(247, 181, 72, 0.06); }
  .noot a { color: var(--ijs); font-weight: 600; text-decoration: none; }
  .voet { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; }
  .voet .zachtknop { border: 0; background: none; color: var(--zacht); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 0; text-decoration: none; }
  .voet .knop { text-decoration: none; display: inline-flex; align-items: center; }
  .prijs { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); font-size: 13.5px; font-weight: 600; }
  .prijs input { width: 64px; border: 0; background: none; color: var(--tekst); font: inherit; font-weight: 700; }
  .prijs input:focus { outline: none; }
  .prijs:focus-within { outline: 2px solid var(--ijs); }
  .filmkaart { position: relative; height: 210px; border-radius: 20px; border: 0; background: radial-gradient(120% 120% at 30% 10%, #1e3157 0%, #0e1830 70%); color: var(--tekst); font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: end; padding: 16px 18px; cursor: pointer; text-align: left; }
  .filmkaart .speel { position: absolute; left: 50%; top: 44%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: var(--tekst); }
  .filmkaart .speel::after { content: ''; position: absolute; left: 29px; top: 22px; border-left: 22px solid #0b1424; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .filmkaart:focus-visible { outline: 2px solid var(--tekst); outline-offset: 3px; }
  .melding-inr { min-height: 18px; font-size: 13px; color: var(--mint); }
  .melding-inr.fout { color: var(--gloed); }
  /* De telefoon: de stappen klein bovenaan, het huis klein, de vraag eronder. */
  #tel .inhoud { padding: 16px 14px 28px; display: flex; flex-direction: column; gap: 12px; }
  #tel .stappen { justify-content: start; flex-wrap: nowrap; overflow-x: auto; }
  #tel .stap span:not(.n) { display: none; }
  #tel .stap.nu span:not(.n) { display: inline; }
  #tel .podium { height: 220px; }
  #tel .kaart { padding: 20px 18px; overflow: visible; }
  #tel .rij { grid-template-columns: 1fr; gap: 6px; }
  #tel .rij > b { padding-top: 0; }
  #tel .bewerk { grid-column: 1; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <div class="bovenbalk"><a class="merk" href="thuis.html"><i aria-hidden="true"></i>Smart Climate</a><nav class="stappen" aria-label="Stappen" data-stappen></nav></div>
    <div class="veldje">
      <div class="podium" data-podium="wand" aria-hidden="true"></div>
      <section class="glas kaart" data-kaart aria-live="polite"></section>
    </div>
  </div>
  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="merk" href="thuis.html"><i aria-hidden="true"></i>Smart Climate</a>
      <nav class="stappen" aria-label="Stappen" data-stappen></nav>
      <div class="podium" data-podium="tel" aria-hidden="true"></div>
      <section class="glas kaart" data-kaart aria-live="polite"></section>
    </div>
  </div>
  <script src="kit/nav.js"></script>
  <script src="kit/huis.js"></script>
  <script src="basis.js"></script>
  <script src="huismodel.js"></script>
  <script src="film.js"></script>
  <script src="inrichten.js"></script>
</body>
</html>
