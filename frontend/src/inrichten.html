<style>
  /*
   * Inrichten in één keer (besluit 139 en 190, schets Wand-Inrichten-3): over
   * het hele scherm, zonder menu. Bovenaan het pad van acht hoofdstukken,
   * links het eiland dat meegroeit, rechts één vraag tegelijk.
   */
  #wand { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding: 18px 26px 22px; gap: 12px; }
  .veld { height: 38px; padding: 0 10px; border-radius: 12px; border: 1px solid rgb(var(--wit) / 0.14); background: rgb(var(--wit) / 0.06); color: var(--tekst); font: inherit; font-size: 14px; font-weight: 600; color-scheme: dark; }
  .veld option { background: #14203a; color: var(--tekst); }
  .bovenbalk { display: flex; align-items: center; gap: 16px; }
  .bovenbalk .stappen { flex: 1; min-width: 0; }
  .merk { display: flex; align-items: center; gap: 12px; font-family: var(--kop); font-weight: 600; font-size: 20px; color: var(--tekst); text-decoration: none; }
  .merk i { width: 34px; height: 34px; border-radius: 10px; background: conic-gradient(from 200deg, #ff7a4d, #f7b548, #6ee7b7, #6fd3ff, #8f86ff, #ff7a4d); display: block; }
  /*
   * Het pad (besluit 190, schets Wand-Inrichten-3): acht hoofdstukken naast
   * het logo, elk met zijn naam en een streepje per stap.
   */
  .stappen { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .stap { display: flex; flex-direction: column; gap: 6px; padding: 7px 10px 8px; border-radius: 14px; border: 1px solid transparent; background: rgb(var(--wit) / 0.04); color: var(--tekst); font: inherit; cursor: pointer; text-decoration: none; min-width: 0; }
  .stap .naam { font-size: 12.5px; font-weight: 700; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stap.klaar .naam { color: var(--zacht); }
  .stap.nu .naam { color: var(--tekst); }
  .stap .n, .stap .kort, .stap .sub { display: none; }
  .stap.nu { border-color: rgb(var(--wit) / 0.16); background: rgb(var(--wit) / 0.09); }
  .stap:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .stap .stipjes { display: flex; gap: 3px; }
  .stap .stipjes i { flex: 1; height: 3px; border-radius: 2px; background: rgb(var(--wit) / 0.12); }
  .stap .stipjes i.al { background: var(--mint); }
  .stap .stipjes i.nu { background: var(--tekst); }
  /* Al ingevuld uit Home Assistant, nog niet nagelopen (besluit 158): omlijnd. */
  .stap .stipjes i.half { background: none; box-shadow: inset 0 0 0 1px var(--mint); }
  /* Wat elk apparaat doet: drie knoppen naast elkaar, zon in zijn kleur. */
  .seg { display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: rgb(var(--wit) / 0.05); }
  /* Het apparaat boven, de drie knoppen eronder over de volle breedte: zo past "Op temperatuur". */
  .toestel:has(.seg) { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; }
  .toestel:has(.seg) > .seg { width: 100%; box-sizing: border-box; }
  .seg button { flex: 1 1 auto; white-space: nowrap; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--gedempt); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: rgb(var(--wit) / 0.15); color: var(--tekst); }
  .seg button.zon[aria-pressed="true"] { background: rgba(247, 181, 72, 0.22); color: var(--zon-t); }
  .seg button:focus-visible { outline: 2px solid var(--tekst); outline-offset: 1px; }
  /* Een vak met een waarde rechts: de prijs, de zekering. */
  .invul { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; padding: 0 8px 0 14px; border-radius: 12px; background: rgb(var(--wit) / 0.05); font-size: 15px; font-weight: 600; }
  .invul + .invul { margin-top: 8px; }
  .invul .waarde { display: inline-flex; align-items: center; gap: 4px; font-family: var(--kop); font-size: 17px; font-weight: 700; }
  /* Breed genoeg voor vijf cijfers achter de komma (besluit 166): 0,27451 viel er eerst half buiten. */
  .invul input { width: 7.5ch; field-sizing: content; min-width: 3ch; max-width: 9ch; border: 0; background: none; color: var(--tekst); font: inherit; text-align: right; }
  /* Een leeg vak zegt dat het leeg is, en lijkt niet op een ingevuld getal. */
  .invul input::placeholder { font-family: var(--tekstletter, inherit); font-size: 13px; font-weight: 500; font-style: italic; color: var(--gedempt); }
  .invul input:placeholder-shown { width: 7ch; }
  .paar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .paar .invul + .invul { margin-top: 0; }
  .invul input:focus { outline: none; }
  .invul:focus-within { outline: 2px solid var(--ijs); }
  .invul .veld { height: 34px; font-family: var(--kop); font-size: 16px; font-weight: 700; }
  .invul .klein { font-family: inherit; font-size: 13px; font-weight: 600; color: var(--gedempt); }
  /* Buiten: een vraagje boven de keuzes, en wat erbij hoort als schakelaar. */
  .vraagje { font-size: 12.5px; font-weight: 600; color: var(--gedempt); }
  .schakelrij { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; padding: 8px 10px 8px 14px; border: 0; border-radius: 12px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }
  .schakelrij i { position: relative; width: 44px; height: 26px; border-radius: 13px; background: rgb(var(--wit) / 0.16); flex-shrink: 0; transition: background 0.15s; }
  .schakelrij i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  .schakelrij[aria-checked="true"] i { background: var(--mint); }
  .schakelrij[aria-checked="true"] i::after { transform: translateX(18px); }
  .schakelrij:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  /* Wie woont hier (besluit 147): de code om in te loggen. */
  .erbij { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; }
  .qr { width: 96px; height: 96px; border-radius: 12px; background: #eef3f7; padding: 7px; box-sizing: border-box; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; }
  .waarderij { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgb(var(--wit) / 0.07); font-size: 15px; }
  .waarderij:first-child { border-top: 0; }
  .waarderij span { color: var(--zacht); text-align: right; }
  /* Een bewoner om aan te tikken (besluit 166), en buiten: een deel met zijn ruimte. */
  .bewonerrij { width: 100%; border: 0; border-top: 1px solid rgb(var(--wit) / 0.07); background: none; color: var(--tekst); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; }
  .bewonerrij.open, .bewonerrij:hover { color: var(--ijs-t); }
  .bewonerrij:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .rijen > .bewerk { margin: 2px 0 8px; }
  .deel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .deel > .schakelrij { width: 100%; margin-top: 0; }
  .koppel { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 0 14px; font-size: 12.5px; font-weight: 600; color: var(--gedempt); }
  .koppel .veld { height: 32px; min-width: 0; flex: 1; max-width: 150px; font-size: 13px; }
  .veldje { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 20px; min-height: 0; }
  /* Het huis vult zijn vak, hoe breed het scherm ook is (besluit 166): eerst groeide de tekening op 16:9 onder de rand uit. */
  .podium { min-height: 0; display: grid; place-items: center; position: relative; }
  #wand .podium > svg { position: absolute; inset: 0; }
  /* Slepen in het huis (besluit 166): de gepakte kamer en waar hij heen gaat. */
  #wand .podium .sc-tik { cursor: grab; touch-action: none; }
  #wand .podium .sc-tik.sc-gepakt { fill: rgba(111, 211, 255, 0.12); stroke: var(--ijs); stroke-width: 2; stroke-dasharray: 7 5; cursor: grabbing; }
  #wand .podium .sc-tik.sc-doel { fill: rgba(110, 231, 183, 0.18); stroke: var(--mint); stroke-width: 2; }
  .kaart { padding: 26px 28px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: hidden; }
  /* Volgende blijft altijd in beeld; is er te weinig plek, dan wijkt eerst de tip (besluit 166). */
  .kaart > .voet { flex: none; }
  .kaart > .noot { flex-shrink: 1; min-height: 0; overflow: hidden; }
  .kaart .waar { font-size: 13.5px; font-weight: 600; color: var(--gedempt); }
  .kaart h1 { margin: 0; }
  .kaart .uitleg { margin: 0; font-size: 16px; line-height: 1.5; color: var(--zacht); max-width: 46ch; }
  .rijen { display: flex; flex-direction: column; min-height: 0; overflow: auto; overscroll-behavior: contain; margin: 0 -6px; padding: 0 6px; }
  /* Loopt de lijst verder dan de kaart, dan vervaagt de onderkant (besluit 158). */
  .rijen.meer { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); }
  .rij { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid rgb(var(--wit) / 0.06); }
  /* Een apparaat en zijn kamer: de naam krijgt de ruimte, de keuze een vaste breedte. */
  .rij.breed { grid-template-columns: minmax(0, 1fr) 210px; align-items: center; }
  .rij.breed > b { padding-top: 0; }
  .rij:first-child { border-top: 0; }
  .rij > b { font-size: 15px; padding-top: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 34px; padding: 0 11px; border-radius: 999px; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font: inherit; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .chip.aan { background: var(--accent); color: var(--op-accent); }
  .chip.gevonden { background: rgba(110, 231, 183, 0.12); color: var(--mint-t); cursor: default; }
  .chip.plus { background: none; border: 1px dashed rgba(111, 211, 255, 0.55); color: var(--ijs-t); }
  .chip.stil { cursor: default; background: rgb(var(--wit) / 0.05); }
  .chip.weg span { color: var(--gedempt); font-size: 15px; }
  .chip.weg:hover span { color: var(--gloed-t); }
  .chip.gevaar { background: rgba(255, 122, 77, 0.12); color: var(--gloed-t); white-space: nowrap; justify-self: start; }
  .chip:disabled, .schakelrij:disabled { opacity: 0.4; cursor: default; }
  .chip:focus-visible, .veld:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .zacht { font-size: 13.5px; color: var(--gedempt); padding-top: 7px; }
  .bewerk { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; padding: 10px; border-radius: 14px; background: rgb(var(--wit) / 0.05); }
  .bewerk > .veld { width: auto; min-width: 0; height: 36px; }
  .bewerk .veld { height: 36px; }
  /* Elk veld met zijn naam erboven (besluit 158): zo zie je dat de keuzelijst de etage is. */
  .veldlabel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .veldlabel > span { font-size: 12px; font-weight: 600; color: var(--gedempt); }
  .veldlabel.breed { grid-column: 1 / -1; }
  .veldlabel .veld { width: 100%; box-sizing: border-box; }
  .zonerij { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; }
  .rondom { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rondom .schakelrij { margin-top: 0; }
  .toestel { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 4px 4px 4px 12px; border-radius: 12px; background: rgb(var(--wit) / 0.05); font-size: 13.5px; font-weight: 600; }
  .toestel .veld { width: auto; height: 32px; padding: 0 8px; font-size: 12.5px; font-weight: 700; }
  .kolom { display: flex; flex-direction: column; gap: 6px; }
  .schuif { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13.5px; color: var(--zacht); }
  .schuif input { width: 100%; accent-color: var(--ijs); }
  .schuif.warm input { accent-color: var(--gloed); }
  .schuif b { font-family: var(--kop); font-size: 18px; text-align: right; color: var(--tekst); }
  .cijfers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* De getallen van het startscherm tikken open tot een lijst (besluit 158). */
  .cijfers .vak { position: relative; padding: 11px 16px; border: 0; border-radius: 16px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; text-align: left; cursor: pointer; }
  .cijfers .vak:hover { background: rgb(var(--wit) / 0.09); }
  .cijfers .vak:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .cijfers b { display: block; font-family: var(--kop); font-size: 26px; font-weight: 700; }
  .cijfers span { font-size: 13.5px; color: var(--zacht); }
  .cijfers .vak i { position: absolute; right: 14px; top: 12px; font-style: normal; font-size: 20px; color: var(--gedempt); }
  .noot { padding: 12px 16px; border-radius: 14px; background: rgb(var(--wit) / 0.05); font-size: 14px; line-height: 1.5; color: var(--zacht); }
  .noot.later { border: 1px solid rgba(247, 181, 72, 0.35); background: rgba(247, 181, 72, 0.06); }
  .noot a { color: var(--ijs-t); font-weight: 600; text-decoration: none; }
  .voet { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; }
  .voet .zachtknop { border: 0; background: none; color: var(--zacht); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 0; text-decoration: none; }
  .voet .knop { text-decoration: none; display: inline-flex; align-items: center; }
  .voet .rechts { display: flex; align-items: center; gap: 18px; }
  .prijs { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 999px; background: rgb(var(--wit) / 0.08); font-size: 13.5px; font-weight: 600; }
  .prijs input { width: 64px; border: 0; background: none; color: var(--tekst); font: inherit; font-weight: 700; }
  .prijs input:focus { outline: none; }
  .prijs:focus-within { outline: 2px solid var(--ijs); }
  .filmkaart { position: relative; height: 150px; flex: none; border-radius: 20px; border: 0; background: radial-gradient(120% 120% at 30% 10%, #1e3157 0%, #0e1830 70%); color: var(--tekst); font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: end; padding: 16px 18px; cursor: pointer; text-align: left; }
  .filmkaart .speel { position: absolute; left: 50%; top: 44%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: var(--tekst); }
  .filmkaart .speel::after { content: ''; position: absolute; left: 29px; top: 22px; border-left: 22px solid #0b1424; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .filmkaart:focus-visible { outline: 2px solid var(--tekst); outline-offset: 3px; }
  .melding-inr { min-height: 18px; font-size: 13px; color: var(--mint-t); }
  .melding-inr.fout { color: var(--gloed-t); }
  .kaart > .melding-inr:empty { min-height: 0; margin-top: -10px; }

  /*
   * De bouwstenen van Inrichten 3.0 (besluit 190, schets Wand-Inrichten-3):
   * regels met een icoon, getallen, tegels met een klein huis, bewoners met
   * hun kleur, een raster per dagdeel, de wand in het klein en de punten van
   * Klaarzetten.
   */
  .lijst { display: flex; flex-direction: column; gap: 6px; }
  .etagekop { font-size: 12px; font-weight: 700; color: var(--gedempt); margin: 6px 2px 0; }
  .etagekop:first-child { margin-top: 0; }
  .regel { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; width: 100%; box-sizing: border-box; flex: none; padding: 7px 10px; border: 0; border-radius: 13px; background: rgb(var(--wit) / 0.045); color: var(--tekst); font: inherit; text-align: left; text-decoration: none; }
  button.regel, a.regel { cursor: pointer; }
  button.regel:hover, a.regel:hover, .regel.open { background: rgb(var(--wit) / 0.08); }
  .regel:focus-visible, .tegel:focus-visible, .teller:focus-visible, .bewoner:focus-visible, .schakel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .regel .ik { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); color: var(--zacht); }
  .regel .ik svg { width: 18px; height: 18px; }
  .regel .tekst, .bewoner .tekst, .klaarregel .tekst { min-width: 0; }
  .regel .tekst b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .regel .tekst span { display: block; font-size: 12px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .regel .rechts { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--zacht); white-space: nowrap; }
  .regel .rechts.mint { color: var(--mint-t); }
  .regel .rechts.ijs { color: var(--ijs-t); }
  .regel .rechts.zon { color: var(--zon-t); }
  .regel.uit { background: transparent; border: 1px dashed rgb(var(--wit) / 0.14); }
  .regel .onder { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .regel .onder .koppel { padding: 0; }
  .regel .onder .koppel .veld { max-width: 200px; }
  .schakel { position: relative; flex: none; width: 42px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: rgb(var(--wit) / 0.16); cursor: pointer; }
  .schakel::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  .schakel[aria-checked="true"] { background: var(--mint); }
  .schakel[aria-checked="true"]::after { transform: translateX(16px); background: #0b2a1f; }
  .schakel:disabled { opacity: 0.4; cursor: default; }
  .tip { flex-shrink: 1; min-height: 0; overflow: hidden; padding: 10px 12px; border-radius: 14px; background: rgba(111, 211, 255, 0.08); color: var(--zacht); font-size: 13px; line-height: 1.45; }
  .tellen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .teller { padding: 10px 12px; border: 0; border-radius: 14px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; text-align: left; }
  button.teller { cursor: pointer; }
  button.teller:hover { background: rgb(var(--wit) / 0.09); }
  .teller b { display: block; margin-bottom: 4px; font-family: var(--kop); font-size: 26px; font-weight: 600; line-height: 1; }
  .teller span { font-size: 12px; color: var(--zacht); }
  .tegels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex: none; }
  .tegel { position: relative; height: 112px; padding: 0; border: 1.5px solid transparent; border-radius: 16px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; overflow: hidden; cursor: pointer; }
  .tegel[aria-pressed="true"] { border-color: var(--ijs); background: rgba(111, 211, 255, 0.1); }
  .tegel .mini { position: absolute; inset: 0 0 30px 0; }
  .tegel .mini svg { width: 100%; height: 100%; }
