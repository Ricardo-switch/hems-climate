<style>
  /*
   * Inrichten in één keer (besluit 139 en 190, schets Wand-Inrichten-3): over
   * het hele scherm, zonder menu. Bovenaan het pad van acht hoofdstukken,
   * links het eiland dat meegroeit, rechts één vraag tegelijk.
   */
  #wand { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding: 18px 26px 22px; gap: 12px; }
  .veld { height: 38px; padding: 0 10px; border-radius: 12px; border: 1px solid rgb(var(--wit) / 0.14); background: rgb(var(--wit) / 0.06); color: var(--tekst); font: inherit; font-size: 14px; font-weight: 600; color-scheme: dark; }
  .veld option { background: #14203a; color: var(--tekst); }
  .bovenbalk { display: flex; align-items: center; gap: 16px; }
  .bovenbalk .stappen { flex: 1; min-width: 0; }
  .merk { display: flex; align-items: center; gap: 12px; font-family: var(--kop); font-weight: 600; font-size: 20px; color: var(--tekst); text-decoration: none; }
  .merk i { width: 34px; height: 34px; border-radius: 10px; background: conic-gradient(from 200deg, #ff7a4d, #f7b548, #6ee7b7, #6fd3ff, #8f86ff, #ff7a4d); display: block; }
  /*
   * Het pad (besluit 190, schets Wand-Inrichten-3): acht hoofdstukken naast
   * het logo, elk met zijn naam en een streepje per stap.
   */
  .stappen { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .stap { display: flex; flex-direction: column; gap: 6px; padding: 7px 10px 8px; border-radius: 14px; border: 1px solid transparent; background: rgb(var(--wit) / 0.04); color: var(--tekst); font: inherit; cursor: pointer; text-decoration: none; min-width: 0; }
  .stap .naam { font-size: 12.5px; font-weight: 700; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stap.klaar .naam { color: var(--zacht); }
  .stap.nu .naam { color: var(--tekst); }
  .stap .n, .stap .kort, .stap .sub { display: none; }
  .stap.nu { border-color: rgb(var(--wit) / 0.16); background: rgb(var(--wit) / 0.09); }
  .stap:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .stap .stipjes { display: flex; gap: 3px; }
  .stap .stipjes i { flex: 1; height: 3px; border-radius: 2px; background: rgb(var(--wit) / 0.12); }
  .stap .stipjes i.al { background: var(--mint); }
  .stap .stipjes i.nu { background: var(--tekst); }
  /* Al ingevuld uit Home Assistant, nog niet nagelopen (besluit 158): omlijnd. */
  .stap .stipjes i.half { background: none; box-shadow: inset 0 0 0 1px var(--mint); }
  /* Wat elk apparaat doet: drie knoppen naast elkaar, zon in zijn kleur. */
  .seg { display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: rgb(var(--wit) / 0.05); }
  /* Het apparaat boven, de drie knoppen eronder over de volle breedte: zo past "Op temperatuur". */
  .toestel:has(.seg) { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; }
  .toestel:has(.seg) > .seg { width: 100%; box-sizing: border-box; }
  .seg button { flex: 1 1 auto; white-space: nowrap; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--gedempt); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: rgb(var(--wit) / 0.15); color: var(--tekst); }
  .seg button.zon[aria-pressed="true"] { background: rgba(247, 181, 72, 0.22); color: var(--zon-t); }
  .seg button:focus-visible { outline: 2px solid var(--tekst); outline-offset: 1px; }
  /* Een vak met een waarde rechts: de prijs, de zekering. */
  .invul { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; padding: 0 8px 0 14px; border-radius: 12px; background: rgb(var(--wit) / 0.05); font-size: 15px; font-weight: 600; }
  .invul + .invul { margin-top: 8px; }
  .invul .waarde { display: inline-flex; align-items: center; gap: 4px; font-family: var(--kop); font-size: 17px; font-weight: 700; }
  /* Breed genoeg voor vijf cijfers achter de komma (besluit 166): 0,27451 viel er eerst half buiten. */
  .invul input { width: 7.5ch; field-sizing: content; min-width: 3ch; max-width: 9ch; border: 0; background: none; color: var(--tekst); font: inherit; text-align: right; }
  /* Een leeg vak zegt dat het leeg is, en lijkt niet op een ingevuld getal. */
  .invul input::placeholder { font-family: var(--tekstletter, inherit); font-size: 13px; font-weight: 500; font-style: italic; color: var(--gedempt); }
  .invul input:placeholder-shown { width: 7ch; }
  .paar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .paar .invul + .invul { margin-top: 0; }
  .invul input:focus { outline: none; }
  .invul:focus-within { outline: 2px solid var(--ijs); }
  .invul .veld { height: 34px; font-family: var(--kop); font-size: 16px; font-weight: 700; }
  .invul .klein { font-family: inherit; font-size: 13px; font-weight: 600; color: var(--gedempt); }
  /* Buiten: een vraagje boven de keuzes, en wat erbij hoort als schakelaar. */
  .vraagje { font-size: 12.5px; font-weight: 600; color: var(--gedempt); }
  .schakelrij { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; padding: 8px 10px 8px 14px; border: 0; border-radius: 12px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }
  .schakelrij i { position: relative; width: 44px; height: 26px; border-radius: 13px; background: rgb(var(--wit) / 0.16); flex-shrink: 0; transition: background 0.15s; }
  .schakelrij i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  .schakelrij[aria-checked="true"] i { background: var(--mint); }
  .schakelrij[aria-checked="true"] i::after { transform: translateX(18px); }
  .schakelrij:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  /* Wie woont hier (besluit 147): de code om in te loggen. */
  .erbij { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; }
  .qr { width: 96px; height: 96px; border-radius: 12px; background: #eef3f7; padding: 7px; box-sizing: border-box; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; }
  .waarderij { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgb(var(--wit) / 0.07); font-size: 15px; }
  .waarderij:first-child { border-top: 0; }
  .waarderij span { color: var(--zacht); text-align: right; }
  /* Een bewoner om aan te tikken (besluit 166), en buiten: een deel met zijn ruimte. */
  .rijen > .bewerk { margin: 2px 0 8px; }
  .deel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .deel > .schakelrij { width: 100%; margin-top: 0; }
  .veldje { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 20px; min-height: 0; }
  .veldje.breed { grid-template-columns: minmax(0, 1fr) 724px; }
  /* De kop zegt het al; zo past een apparaat met veel punten, met zijn rol onderaan, in beeld. */
  .veldje.breed .uitleg { display: none; }
  /*
   * Wat elk apparaat kan (besluit 197, schets Wand-Inrichten-Klimaat): links de
   * apparaten met in een paar woorden hoe het ervoor staat, rechts het apparaat
   * dat open staat. Groen werkt, een halve stip werkt met een omweg, een
   * vraagteken vraagt iets, een streep kan dat apparaat niet.
   */
  .kanstap { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; }
  .klijst { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: auto; }
  .kapp { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border: 0; border-radius: 14px; background: none; color: var(--tekst); font: inherit; text-align: left; cursor: pointer; }
  .kapp.open { background: rgb(var(--wit) / 0.09); }
  .kapp:focus-visible { outline: 2px solid var(--tekst); outline-offset: 1px; }
  .kik { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; }
  .kik.koel { background: rgba(111, 211, 255, 0.14); color: var(--ijs); }
  .kik.warm { background: rgba(255, 122, 77, 0.14); color: var(--gloed); }
  .kapp b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kapp small { display: block; font-size: 12px; color: var(--gedempt); margin-top: 1px; }
  .kst { font-weight: 700; }
  .kst.ok { color: var(--mint-t); }
  .kst.om { color: var(--zon-t); }
  .kst.mee { color: var(--zacht); }
  .kst.beperkt { color: var(--gloed); }
  .kmist { margin-top: 6px; padding: 9px 12px; border-radius: 14px; border: 1px dashed rgba(111, 211, 255, 0.45); background: none; color: var(--ijs); font: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; }
  .ksamen { margin: auto 0 0; padding: 8px 4px 0; font-size: 12.5px; color: var(--gedempt); line-height: 1.5; }
  .klos { display: flex; flex-direction: column; gap: 4px; padding: 10px 16px; border-radius: 18px; background: rgb(var(--wit) / 0.04); min-height: 0; overflow: auto; }
  .kkop { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .kkop b { font-family: var(--kop); font-size: 19px; }
  .kkop span { font-size: 13px; color: var(--gedempt); }
  .kpunten { display: flex; flex-direction: column; }
  .kpunt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 3px 0; border-top: 1px solid rgb(var(--wit) / 0.06); font-size: 14px; }
  .kpunt:first-child { border-top: 0; }
  .kpunt i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; margin-top: 1px; }
  .kpunt.ok i { background: rgba(110, 231, 183, 0.18); color: var(--mint); }
  .kpunt.om i { background: conic-gradient(var(--zon) 0 50%, rgba(247, 181, 72, 0.18) 0); }
  .kpunt.vraag i { background: rgba(111, 211, 255, 0.18); color: var(--ijs); }
  .kpunt.nee i { background: rgb(var(--wit) / 0.07); color: var(--gedempt); }
  .kpunt.nee > span > b { color: var(--zacht); }
  .kpunt small { display: block; color: var(--gedempt); font-size: 12.5px; line-height: 1.35; margin-top: 1px; }
  .kpunt .chips { margin-top: 4px; }
  .veld.klein { height: 32px; font-size: 13px; padding: 0 8px; }
  .kweet { padding: 7px 11px; border-radius: 12px; background: rgba(143, 134, 255, 0.08); border: 1px solid rgba(143, 134, 255, 0.22); font-size: 12.5px; color: var(--zacht); line-height: 1.45; }
  .kweet b { color: var(--violet-t, #b3adff); }
  .krol { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid rgb(var(--wit) / 0.08); }
  .krol > b { font-size: 13px; color: var(--zacht); white-space: nowrap; }
  .krol .seg { flex: 1; }
  #tel .klos { margin: 2px 0 8px; }
  #tel .krol { flex-direction: column; align-items: stretch; }
  /* Het huis vult zijn vak, hoe breed het scherm ook is (besluit 166): eerst groeide de tekening op 16:9 onder de rand uit. */
  .podium { min-height: 0; display: grid; place-items: center; position: relative; }
  #wand .podium > svg { position: absolute; inset: 0; }
  /* Slepen in het huis (besluit 166): de gepakte kamer en waar hij heen gaat. */
  #wand .podium .sc-tik { cursor: grab; touch-action: none; }
  #wand .podium .sc-tik.sc-gepakt { fill: rgba(111, 211, 255, 0.12); stroke: var(--ijs); stroke-width: 2; stroke-dasharray: 7 5; cursor: grabbing; }
  #wand .podium .sc-tik.sc-doel { fill: rgba(110, 231, 183, 0.18); stroke: var(--mint); stroke-width: 2; }
  .kaart { padding: 26px 28px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: hidden; }
  /* Volgende blijft altijd in beeld; is er te weinig plek, dan wijkt eerst de tip (besluit 166). */
  .kaart > .voet { flex: none; }
  .kaart > .noot { flex-shrink: 1; min-height: 0; overflow: hidden; }
  .kaart .waar { font-size: 13.5px; font-weight: 600; color: var(--gedempt); }
  .kaart h1 { margin: 0; }
  .kaart .uitleg { margin: 0; font-size: 16px; line-height: 1.5; color: var(--zacht); max-width: 46ch; }
  .rijen { display: flex; flex-direction: column; min-height: 0; overflow: auto; overscroll-behavior: contain; margin: 0 -6px; padding: 0 6px; }
  /* Loopt de lijst verder dan de kaart, dan vervaagt de onderkant (besluit 158). */
  .rijen.meer { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); }
  .rij { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid rgb(var(--wit) / 0.06); }
  /* Een apparaat en zijn kamer: de naam krijgt de ruimte, de keuze een vaste breedte. */
  .rij.breed { grid-template-columns: minmax(0, 1fr) 210px; align-items: center; }
  .rij.breed > b { padding-top: 0; }
  .rij:first-child { border-top: 0; }
  .rij > b { font-size: 15px; padding-top: 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 34px; padding: 0 11px; border-radius: 999px; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font: inherit; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .chip.aan { background: var(--accent); color: var(--op-accent); }
  .chip.gevonden { background: rgba(110, 231, 183, 0.12); color: var(--mint-t); cursor: default; }
  .chip.plus { background: none; border: 1px dashed rgba(111, 211, 255, 0.55); color: var(--ijs-t); }
  .chip.stil { cursor: default; background: rgb(var(--wit) / 0.05); }
  .chip.weg span { color: var(--gedempt); font-size: 15px; }
  .chip.weg:hover span { color: var(--gloed-t); }
  .chip.gevaar { background: rgba(255, 122, 77, 0.12); color: var(--gloed-t); white-space: nowrap; justify-self: start; }
  .chip:disabled, .schakelrij:disabled { opacity: 0.4; cursor: default; }
  .chip:focus-visible, .veld:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .zacht { font-size: 13.5px; color: var(--gedempt); padding-top: 7px; }
  .bewerk { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; padding: 10px; border-radius: 14px; background: rgb(var(--wit) / 0.05); }
  .bewerk > .veld { width: auto; min-width: 0; height: 36px; }
  .bewerk .veld { height: 36px; }
  /* Elk veld met zijn naam erboven (besluit 158): zo zie je dat de keuzelijst de etage is. */
  .veldlabel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .veldlabel > span { font-size: 12px; font-weight: 600; color: var(--gedempt); }
  .veldlabel.breed { grid-column: 1 / -1; }
  .veldlabel .veld { width: 100%; box-sizing: border-box; }
  .zonerij { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; }
  .rondom { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rondom .schakelrij { margin-top: 0; }
  .toestel { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 4px 4px 4px 12px; border-radius: 12px; background: rgb(var(--wit) / 0.05); font-size: 13.5px; font-weight: 600; }
  .toestel .veld { width: auto; height: 32px; padding: 0 8px; font-size: 12.5px; font-weight: 700; }
  .kolom { display: flex; flex-direction: column; gap: 6px; }
  .schuif { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13.5px; color: var(--zacht); }
  .schuif input { width: 100%; accent-color: var(--ijs); }
  .schuif.warm input { accent-color: var(--gloed); }
  .schuif b { font-family: var(--kop); font-size: 18px; text-align: right; color: var(--tekst); }
  .cijfers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* De getallen van het startscherm tikken open tot een lijst (besluit 158). */
  .cijfers .vak { position: relative; padding: 11px 16px; border: 0; border-radius: 16px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; text-align: left; cursor: pointer; }
  .cijfers .vak:hover { background: rgb(var(--wit) / 0.09); }
  .cijfers .vak:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .cijfers b { display: block; font-family: var(--kop); font-size: 26px; font-weight: 700; }
  .cijfers span { font-size: 13.5px; color: var(--zacht); }
  .cijfers .vak i { position: absolute; right: 14px; top: 12px; font-style: normal; font-size: 20px; color: var(--gedempt); }
  .noot { padding: 12px 16px; border-radius: 14px; background: rgb(var(--wit) / 0.05); font-size: 14px; line-height: 1.5; color: var(--zacht); }
  .noot.later { border: 1px solid rgba(247, 181, 72, 0.35); background: rgba(247, 181, 72, 0.06); }
  .noot a { color: var(--ijs-t); font-weight: 600; text-decoration: none; }
  .voet { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; }
  .voet .zachtknop { border: 0; background: none; color: var(--zacht); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 0; text-decoration: none; }
  .voet .knop { text-decoration: none; display: inline-flex; align-items: center; }
  .voet .rechts { display: flex; align-items: center; gap: 18px; }
  .prijs { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 999px; background: rgb(var(--wit) / 0.08); font-size: 13.5px; font-weight: 600; }
  .prijs input { width: 64px; border: 0; background: none; color: var(--tekst); font: inherit; font-weight: 700; }
  .prijs input:focus { outline: none; }
  .prijs:focus-within { outline: 2px solid var(--ijs); }
  .filmkaart { position: relative; height: 150px; flex: none; border-radius: 20px; border: 0; background: radial-gradient(120% 120% at 30% 10%, #1e3157 0%, #0e1830 70%); color: var(--tekst); font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: end; padding: 16px 18px; cursor: pointer; text-align: left; }
  .filmkaart .speel { position: absolute; left: 50%; top: 44%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: var(--tekst); }
  .filmkaart .speel::after { content: ''; position: absolute; left: 29px; top: 22px; border-left: 22px solid #0b1424; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .filmkaart:focus-visible { outline: 2px solid var(--tekst); outline-offset: 3px; }
  .melding-inr { min-height: 18px; font-size: 13px; color: var(--mint-t); }
  .melding-inr.fout { color: var(--gloed-t); }
  .kaart > .melding-inr:empty { min-height: 0; margin-top: -10px; }

  /*
   * De bouwstenen van Inrichten 3.0 (besluit 190, schets Wand-Inrichten-3):
   * regels met een icoon, getallen, tegels met een klein huis, bewoners met
   * hun kleur, een raster per dagdeel, de wand in het klein en de punten van
   * Klaarzetten.
   */
  .lijst { display: flex; flex-direction: column; gap: 6px; }
  .etagekop { font-size: 12px; font-weight: 700; color: var(--gedempt); margin: 6px 2px 0; }
  .etagekop:first-child { margin-top: 0; }
  .regel { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; width: 100%; box-sizing: border-box; flex: none; padding: 7px 10px; border: 0; border-radius: 13px; background: rgb(var(--wit) / 0.045); color: var(--tekst); font: inherit; text-align: left; text-decoration: none; }
  button.regel, a.regel { cursor: pointer; }
  button.regel:hover, a.regel:hover, .regel.open { background: rgb(var(--wit) / 0.08); }
  .regel:focus-visible, .tegel:focus-visible, .teller:focus-visible, .bewoner:focus-visible, .schakel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .regel .ik { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); color: var(--zacht); }
  .regel .ik svg { width: 18px; height: 18px; }
  .regel .tekst, .bewoner .tekst, .klaarregel .tekst { min-width: 0; }
  .regel .tekst b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .regel .tekst span { display: block; font-size: 12px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .regel .rechts { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--zacht); white-space: nowrap; }
  .regel .rechts.mint { color: var(--mint-t); }
  .regel .rechts.ijs { color: var(--ijs-t); }
  .regel .rechts.zon { color: var(--zon-t); }
  .regel.uit { background: transparent; border: 1px dashed rgb(var(--wit) / 0.14); }
  .regel .onder { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .schakel { position: relative; flex: none; width: 42px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: rgb(var(--wit) / 0.16); cursor: pointer; }
  .schakel::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  .schakel[aria-checked="true"] { background: var(--mint); }
  .schakel[aria-checked="true"]::after { transform: translateX(16px); background: #0b2a1f; }
  .schakel:disabled { opacity: 0.4; cursor: default; }
  /* Een eigen account voor de wand (besluit 202): waarom, en hoe in drie stappen. */
  .accblok { display: flex; flex-direction: column; gap: 10px; flex: none; padding: 14px 16px; border-radius: 18px; background: rgb(var(--wit) / 0.05); border: 1px solid rgb(var(--wit) / 0.08); }
  .accblok > b { font-size: 15px; }
  .acckop { display: flex; align-items: center; gap: 12px; }
  .acckop .ik { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgb(var(--wit) / 0.08); color: var(--zacht); }
  .acckop .ik svg { width: 20px; height: 20px; }
  .acckop b { display: block; font-size: 15px; }
  .acckop span { display: block; font-size: 12.5px; color: var(--zacht); }
  .accwaarom, .accstappen { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
  .accwaarom li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; font-size: 13px; color: var(--zacht); line-height: 1.4; }
  .accwaarom li::before { content: '✓'; color: var(--mint-t); font-weight: 800; }
  .accstappen li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; color: var(--zacht); line-height: 1.4; }
  .accstappen .nr { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: rgb(var(--wit) / 0.08); }
  .accblok .knop { align-self: stretch; }
  /* De assistent met één knop (besluit 202): de bol, wat er gebeurt, en de knop. */
  .asblok { display: flex; flex-direction: column; gap: 10px; flex: none; padding: 14px 16px; border-radius: 18px; background: linear-gradient(160deg, rgba(143, 134, 255, 0.16), rgba(111, 211, 255, 0.08)); border: 1px solid rgba(143, 134, 255, 0.35); }
  .askop { display: flex; align-items: center; gap: 12px; }
  .askop .bol { width: 40px; height: 40px; flex: none; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #fff 0%, #bfe3ff 16%, #6fb7ff 40%, #6a5cff 72%, #2a1f6b 100%); box-shadow: 0 0 24px rgba(111, 170, 255, 0.5); }
  .askop b { display: block; font-size: 15.5px; }
  .askop span { display: block; font-size: 12.5px; color: var(--zacht); line-height: 1.35; }
  .askop span.fout { color: var(--gloed-t); }
  .asstappen li { grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; }
  .asstappen small { font-size: 12px; color: var(--gedempt); }
  .asstappen .nr.klaar { background: var(--mint); color: #062a1c; }
  .asstappen .nr.bezig { background: transparent; box-shadow: inset 0 0 0 2px var(--ijs); animation: asdraai 1s linear infinite; border-radius: 50%; }
  @keyframes asdraai { 0% { box-shadow: inset 0 0 0 2px rgba(111, 211, 255, 0.25); } 50% { box-shadow: inset 0 0 0 2px var(--ijs); } 100% { box-shadow: inset 0 0 0 2px rgba(111, 211, 255, 0.25); } }
  .asblok .knop { align-self: stretch; height: 46px; }
  /* Wachten op Home Assistant voor de rondleiding (besluit 202). */
  .aswacht { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(6, 10, 20, 0.88); backdrop-filter: blur(6px); }
  .aswacht > div { width: min(440px, 100%); }
  .aswacht p { margin: 12px 0 0; text-align: center; font-size: 13.5px; color: var(--zacht); }
  /* Hoe praat je huis (besluit 203, schets #stem): twee keuzes, met wat erbij hoort eronder. */
  .keuzes-stem { display: grid; gap: 10px; flex: none; }
  .stemkeuze { display: grid; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgb(var(--wit) / 0.04); border: 1.5px solid transparent; }
  .stemkeuze.aan { border-color: var(--ijs); background: rgba(111, 211, 255, 0.08); }
  .keuzekop { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .keuzekop .rond { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgb(var(--wit) / 0.3); margin-top: 2px; box-sizing: border-box; }
  .stemkeuze.aan .rond { border-color: var(--ijs); box-shadow: inset 0 0 0 4px #0b1424; background: var(--ijs); }
  .keuzekop b { display: block; font-size: 15px; }
  .keuzekop .zin { display: block; margin-top: 3px; font-size: 12.5px; color: var(--zacht); line-height: 1.4; }
  .stemkeuze .label { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; vertical-align: 2px; }
  .stemkeuze .label.mint { background: rgba(110, 231, 183, 0.14); color: var(--mint-t); }
  .stemkeuze .label.gedempt { background: rgb(var(--wit) / 0.08); color: var(--zacht); }
  .stemkeuze .onder { margin-left: 32px; display: grid; gap: 6px; }
  .stemkeuze .onder .mini { margin: 0; }
  .stemkeuze .onder .mini.klaar { color: var(--mint-t); font-weight: 700; }
  .stemkeuze .onder .mini.fout { color: var(--gloed-t); }
  .stemkeuze .onder > .knop { height: 40px; justify-self: start; }
  .addon { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px; background: rgb(var(--wit) / 0.05); font-size: 13px; }
  .addon b { font-size: 13.5px; }
  .addon span { display: block; font-size: 11.5px; color: var(--gedempt); }
  .addon .ok { font-size: 12px; font-weight: 800; color: var(--mint-t); }
  .addon .ok.gevonden { color: var(--ijs); }
  .addon .knop { height: 32px; padding: 0 12px; font-size: 13px; }
  .schakelrij { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--zacht); line-height: 1.4; }
  .tip { flex-shrink: 1; min-height: 0; overflow: hidden; padding: 10px 12px; border-radius: 14px; background: rgba(111, 211, 255, 0.08); color: var(--zacht); font-size: 13px; line-height: 1.45; }
  .tellen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .teller { padding: 10px 12px; border: 0; border-radius: 14px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; text-align: left; }
  button.teller { cursor: pointer; }
  button.teller:hover { background: rgb(var(--wit) / 0.09); }
  .teller b { display: block; margin-bottom: 4px; font-family: var(--kop); font-size: 26px; font-weight: 600; line-height: 1; }
  .teller span { font-size: 12px; color: var(--zacht); }
  .tegels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex: none; }
  .tegel { position: relative; height: 112px; padding: 0; border: 1.5px solid transparent; border-radius: 16px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; overflow: hidden; cursor: pointer; }
  .tegel[aria-pressed="true"] { border-color: var(--ijs); background: rgba(111, 211, 255, 0.1); }
  .tegel .mini { position: absolute; inset: 0 0 30px 0; }
  .tegel .mini svg { width: 100%; height: 100%; }
  .tegel b { position: absolute; left: 10px; right: 8px; bottom: 7px; font-size: 12.5px; line-height: 1.15; text-align: left; }
  .bewoner { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; width: 100%; flex: none; padding: 10px 12px; border: 0; border-radius: 15px; background: rgb(var(--wit) / 0.05); color: var(--tekst); font: inherit; text-align: left; cursor: pointer; }
  .bewoner.open, .bewoner:hover { background: rgb(var(--wit) / 0.09); }
  .bewoner .tekst b { display: block; font-size: 15px; }
  .bewoner .tekst span { font-size: 12px; color: var(--gedempt); }
  .bewoner .rechts { font-size: 18px; color: var(--gedempt); }
  .gezicht { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--op-accent); font-family: var(--kop); font-weight: 700; }
  .stapper { display: inline-flex; align-items: center; gap: 6px; }
  .stapper button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgb(var(--wit) / 0.08); color: var(--tekst); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .stapper button:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .stapper b { min-width: 44px; text-align: center; font-family: var(--kop); font-size: 16px; color: var(--tekst); }
  .dagdelen { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, 62px); gap: 5px; align-items: center; font-size: 12px; }
  .dagdelen.drie { grid-template-columns: minmax(0, 1fr) repeat(3, 62px); }
  .dagdelen > small { font-weight: 700; color: var(--gedempt); text-align: center; }
  .dagdelen > b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dagdelen > span { height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgb(var(--wit) / 0.06); font-family: var(--kop); font-size: 15px; font-weight: 600; color: var(--gedempt); }
  .dagdelen > span.warm { background: rgba(255, 122, 77, 0.16); color: #ffb090; }
  .dagdelen > span.nacht { background: rgba(143, 134, 255, 0.16); color: #c1bcff; }
  .dagdelen > span.koel { background: rgba(111, 211, 255, 0.14); color: var(--ijs-t); }
  .wandje { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; flex: none; height: 124px; grid-template-rows: minmax(0, 1fr); margin-bottom: 6px; padding: 10px; border-radius: 16px; background: rgb(var(--wit) / 0.04); border: 1px solid rgb(var(--wit) / 0.08); box-sizing: border-box; }
  .wandje .huisvak { position: relative; display: block; border-radius: 10px; background: linear-gradient(160deg, rgb(111 211 255 / 0.12), rgb(255 255 255 / 0.03)); overflow: hidden; }
  .wandje .huisvak svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Zoveel kaartjes als er passen: met meer kaarten groeide de rij eerst onder het kader uit (25 oktober 2026). */
  .wandje .kaartjes { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 24px; gap: 5px; align-content: start; min-height: 0; overflow: hidden; }
  .wandje .kaartjes i { border-radius: 7px; background: rgb(var(--wit) / 0.09); }
  .wandje .kaartjes i.breed { grid-column: span 2; }
  .klaarlijst { gap: 0; }
  .klaarregel { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; flex: none; padding: 7px 4px; border-top: 1px solid rgb(var(--wit) / 0.06); }
  .klaarregel:first-child { border-top: 0; }
  .klaarregel > i { width: 8px; height: 8px; border-radius: 50%; }
  .klaarregel b { display: block; font-size: 13.5px; }
  .klaarregel .tekst span, .klaarregel small { display: block; font-size: 12px; color: var(--gedempt); }
  .getal input { width: 5ch; height: 32px; border: 1px solid rgb(var(--wit) / 0.14); border-radius: 10px; background: rgb(var(--wit) / 0.06); color: var(--tekst); font: inherit; font-family: var(--kop); font-size: 15px; font-weight: 700; text-align: center; }
  .getal input:focus { outline: 2px solid var(--ijs); }
  .getal input::placeholder { color: var(--gedempt); }

  /*
   * Groot welkom (besluit 200, schetsen Wand- en Tel-Inrichten-Welkom): over het
   * hele scherm, nog zonder de stappen. Op de wand rechts het huis met de
   * labels eraan en links het welkom; op de telefoon alles onder elkaar.
   */
  [data-welkom] { display: none; }
  body.inr-groot #wand > .bovenbalk, body.inr-groot #wand > .veldje, body.inr-groot #tel > .inhoud { display: none; }
  body.inr-groot [data-welkom] { display: block; }
  #wand { position: relative; }
  #wand .welkom-groot { position: absolute; inset: 0; overflow: hidden; }
  .welkom-groot .wk-merk { display: flex; align-items: center; gap: 12px; font-family: var(--kop); font-weight: 600; font-size: 19px; }
  .welkom-groot .wk-merk i { width: 34px; height: 34px; border-radius: 10px; background: conic-gradient(from 200deg, #ff7a4d, #f7b548, #6ee7b7, #6fd3ff, #8f86ff, #ff7a4d); display: block; }
  .welkom-groot .wk-hallo { font-size: 17px; font-weight: 700; color: var(--mint-t); letter-spacing: 0.02em; }
  /* Licht: het verloop is te zacht op een lichte lucht, dan één donkere kleur. */
  .sc-licht .welkom-groot .wk-kop em { background: none; color: var(--gloed-t); }
  .welkom-groot .wk-kop { margin: -8px 0 0; font-family: var(--kop); font-size: 92px; font-weight: 700; line-height: 0.95; letter-spacing: -0.035em; }
  .welkom-groot .wk-kop em { font-style: normal; background: linear-gradient(90deg, #f7b548, #ff7a4d 50%, #8f86ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .welkom-groot .wk-zin { margin: 0; max-width: 34ch; font-size: 19px; line-height: 1.5; color: var(--zacht); }
  .welkom-groot .wk-zin b { color: var(--tekst); font-weight: 600; }
  .welkom-groot .wk-beloof { list-style: none; padding: 0; margin: 2px 0 0; display: grid; gap: 12px; }
  .welkom-groot .wk-beloof li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: center; }
  .welkom-groot .wk-beloof .wk-ik { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); }
  .welkom-groot .wk-beloof .wk-ik svg { width: 22px; height: 22px; }
  .welkom-groot .wk-beloof b { display: block; font-size: 16px; }
  .welkom-groot .wk-beloof span { font-size: 14px; color: var(--zacht); }
  .welkom-groot .wk-begin { height: 60px; padding: 0 30px; font-size: 18px; border-radius: 18px; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 10px 40px rgba(111, 211, 255, 0.35); }
  .welkom-groot .wk-begin svg { width: 20px; height: 20px; }
  .welkom-groot .wk-terug { font-size: 15px; font-weight: 600; color: var(--zacht); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgb(var(--wit) / 0.25); }
  #wand .wk-podium { position: absolute; left: 30%; right: 0; top: 20px; bottom: 0; }
  #wand .wk-podium > svg { position: absolute; inset: 0; }
  #wand .wk-lijn { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #wand .wk-labels { position: absolute; inset: 0; pointer-events: none; }
  #wand .wk-label { position: absolute; display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 999px; white-space: nowrap; transform: translate(-50%, -50%); pointer-events: auto; color: var(--tekst); font: inherit; animation: wk-label 0.6s cubic-bezier(0.2, 0.9, 0.25, 1.3) both; }
  #wand button.wk-label { cursor: pointer; }
  .welkom-groot .wk-label .wk-ik, .welkom-groot .wk-getal .wk-ik { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgb(var(--wit) / 0.08); }
  .welkom-groot .wk-label .wk-ik svg, .welkom-groot .wk-getal .wk-ik svg { width: 17px; height: 17px; }
  .welkom-groot .wk-label b { font-family: var(--kop); font-size: 22px; font-weight: 700; }
  .welkom-groot .wk-label > span:last-child { font-size: 14px; color: var(--zacht); font-weight: 600; }
  @keyframes wk-label { from { opacity: 0; transform: translate(-50%, -30%) scale(0.85); } to { opacity: 1; transform: translate(-50%, -50%); } }
  #wand .wk-links { position: absolute; left: 56px; top: 40px; bottom: 40px; width: 470px; display: flex; flex-direction: column; }
  #wand .wk-midden { margin: auto 0; display: flex; flex-direction: column; gap: 22px; }
  #wand .wk-doen { display: flex; align-items: center; gap: 22px; margin-top: 8px; }
  #wand .wk-voet { font-size: 13px; color: var(--gedempt); }
  #wand .wk-zoekt { position: absolute; right: 48px; bottom: 34px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 13.5px; font-weight: 700; color: var(--mint-t); }
  #wand .wk-zoekt i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: wk-puls 1.6s infinite; }
  #wand .wk-zoekt.klaar i { animation: none; }
  @keyframes wk-puls { 0% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.6); } 70% { box-shadow: 0 0 0 9px rgba(110, 231, 183, 0); } 100% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0); } }
  /* Alleen bij het welkom (28 oktober 2026): zonder body.inr-groot stond het op de telefoon onder elke stap. */
  body.inr-groot #tel .welkom-groot { position: relative; min-height: 100dvh; display: flex; flex-direction: column; }
  #tel .wk-merk { position: absolute; left: 22px; top: 20px; z-index: 1; font-size: 16px; gap: 10px; }
  #tel .wk-merk i { width: 28px; height: 28px; border-radius: 9px; }
  #tel .wk-podium { height: 300px; flex: none; margin: 18px -10px 0; }

  #tel .wk-getal { flex: none; display: flex; align-items: center; gap: 7px; padding: 6px 13px 6px 6px; border-radius: 999px; font: inherit; font-size: 13px; color: var(--zacht); font-weight: 600; }
  #tel .wk-getal b { font-family: var(--kop); font-size: 18px; color: var(--tekst); }
  #tel .wk-lezen { font-size: 13.5px; color: var(--zacht); }
  #tel .wk-tekst { padding: 18px 22px 0; display: flex; flex-direction: column; gap: 12px; }
  #tel .wk-hallo { font-size: 14px; }
  #tel .wk-kop { margin: -4px 0 0; font-size: 54px; }
  #tel .wk-zin { font-size: 15.5px; line-height: 1.45; }
  #tel .wk-beloof { gap: 9px; }
  #tel .wk-beloof li { grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
  #tel .wk-beloof .wk-ik { width: 32px; height: 32px; border-radius: 10px; }
  #tel .wk-beloof .wk-ik svg { width: 18px; height: 18px; }
  #tel .wk-beloof b { font-size: 14.5px; }
  #tel .wk-beloof span { font-size: 13px; }
  #tel .wk-doen { margin-top: auto; padding: 14px 22px 26px; display: flex; flex-direction: column; gap: 12px; }
  #tel .wk-begin { height: 56px; justify-content: center; }
  #tel .wk-onder { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--gedempt); }
  #tel .wk-onder .wk-terug { font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) { .welkom-groot .wk-label, #wand .wk-zoekt i { animation: none; } }
  html.sc-stil .welkom-groot .wk-label, html.sc-stil #wand .wk-zoekt i { animation: none; }

  /*
   * De telefoon (schets Tel-Inrichten-3): bovenin het hoofdstuk en hoe ver je
   * bent, het huis klein, dan de vraag; Terug, Later en Volgende vast onderaan.
   */
