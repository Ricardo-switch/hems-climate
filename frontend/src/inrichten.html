<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Inrichten · Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png">
<link rel="apple-touch-icon" href="icoon-192.png">
<script>(function () { var d = document.documentElement; function s() { var b = Math.min(1700, Math.max(1280, Math.round(800 * innerWidth / innerHeight))); d.classList.toggle('tel-stand', innerHeight > innerWidth || innerWidth < 560); d.style.setProperty('--wandbreedte', b + 'px'); d.style.setProperty('--wandschaal', Math.min(innerWidth / b, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  /* De wizard (besluit 114): de stappen links, de gekozen stap groot rechts. */
  #wand main { display: grid; grid-template-columns: 330px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 18px; height: 100%; }
  .kop { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: end; gap: 16px; }
  .terugnaar { font-size: 14px; font-weight: 600; color: var(--zacht); text-decoration: none; }
  .stappenlijst { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; }
  .stapknop { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--glas-rand); background: var(--glas); color: inherit; text-decoration: none; }
  .stapknop.nu { border-color: rgba(111, 211, 255, 0.55); background: rgba(111, 211, 255, 0.1); }
  .stapknop:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .stapknop .l { display: flex; flex-direction: column; gap: 2px; }
  .stapknop .l b { font-size: 15px; }
  .stapknop .l span { font-size: 12.5px; color: var(--gedempt); }
  .nummer { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: rgba(255, 255, 255, 0.08); color: var(--zacht); flex: none; }
  .nummer.klaar { background: rgba(110, 231, 183, 0.2); color: var(--mint); }
  .stapblad { padding: 30px 34px; display: flex; flex-direction: column; min-height: 0; }
  .wat { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
  .wat li { display: flex; gap: 10px; align-items: baseline; }
  .wat li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ijs); flex: none; transform: translateY(-1px); }
  .knoppenrij { margin-top: auto; padding-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }
  .knoppenrij .knop { display: inline-flex; align-items: center; text-decoration: none; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .stapblad { padding: 20px; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="kop">
        <div><a class="terugnaar" href="instellingen.html">‹ Instellingen</a><h1 class="kop-1" style="font-size: 40px; margin-top: 6px">Inrichten</h1><p class="lead" style="margin-top: 6px">Alles wat per huis verschilt, stap voor stap.</p></div>
        <span class="pil" style="color: var(--mint)" data-voortgang></span>
      </div>
      <nav class="stappenlijst" aria-label="Stappen" data-stappen></nav>
      <section class="glas stapblad" data-stapblad aria-live="polite"></section>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="klein" href="instellingen.html" style="font-weight: 600">‹ Instellingen</a>
      <h1 class="kop-1" style="font-size: 30px">Inrichten</h1>
      <span class="pil" style="color: var(--mint); align-self: start" data-voortgang></span>
      <section class="glas stapblad" data-stapblad aria-live="polite"></section>
      <nav class="stappenlijst" aria-label="Stappen" data-stappen></nav>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
  </div>
  <script src="kit/nav.js"></script>
  <script src="basis.js"></script>
  <script src="inrichten.js"></script>
</body>
</html>
