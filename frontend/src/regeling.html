<style>
  /* Regeling (besluit 130): wie wat regelt, en apparaten op zon. */
  .fase { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); flex: none; }
  .fase i { font-style: normal; font-size: 11.5px; font-weight: 700; padding: 5px 8px; border-radius: 8px; color: var(--gedempt); }
  .fase i.leren { background: rgba(143, 134, 255, 0.25); color: #c9c3ff; }
  .fase i.kijken { background: rgba(111, 211, 255, 0.2); color: #a9e6ff; }
  .fase i.regelen { background: rgba(110, 231, 183, 0.2); color: var(--mint); }
  .bewijs { display: flex; align-items: center; gap: 10px; }
  .bewijs .balkje { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .bewijs .balkje i { display: block; height: 100%; background: var(--ijs); }
  .regelrij .l b { font-size: 15px; }
  /* Per kamer wat er regelt (besluit 138): een tik gaat naar de kamer. */
  a.kamerrij { color: inherit; text-decoration: none; }
  a.kamerrij .pijl { color: var(--gedempt); font-size: 18px; }
  .vorm p a { color: var(--ijs); text-decoration: none; font-weight: 600; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
