<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Wat je huis kan · Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<script>(function () { var d = document.documentElement; function s() { d.classList.toggle('tel-stand', innerWidth < 900 || innerHeight > innerWidth); d.style.setProperty('--wandschaal', Math.min(innerWidth / 1280, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  /* Schets Wand-Huis-groeit: het huis groeit met wat je koppelt. */
  #wand main { display: flex; flex-direction: column; gap: 18px; height: 100%; }
  .kop { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .rij { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; flex: 1; min-height: 0; }
  .stap { padding: 14px 16px 18px; display: flex; flex-direction: column; min-height: 0; }
  .stap.nu { border-color: rgba(110, 231, 183, 0.45); background: linear-gradient(180deg, rgba(110, 231, 183, 0.08), rgba(255, 255, 255, 0.03)); }
  .stap.straks { border-style: dashed; background: transparent; }
  .stap .huisje { height: 280px; margin: 0 -12px; }
  .kan { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 7px; font-size: 14px; }
  .kan li { display: flex; gap: 8px; align-items: baseline; }
  .kan li::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); flex: none; transform: translateY(-1px); }
  .kan li.niet::before { background: transparent; border: 1.5px solid var(--gedempt); }
  .kan li.niet { color: var(--gedempt); }
  .moeite { margin-top: auto; padding-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); color: var(--zacht); }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .rij { grid-template-columns: 1fr; }
  #tel .stap .huisje { height: 220px; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="kop">
        <div><a class="klein" href="instellingen.html" style="font-weight: 600">‹ Instellingen</a><h1 class="kop-1" style="margin-top: 6px">Wat je huis kan</h1><p class="lead" style="max-width: 62ch; margin-top: 8px">Het huis groeit met wat je koppelt. Elke stap maakt meer mogelijk; wat er nog niet is, staat gestippeld, met wat ervoor nodig is.</p></div>
        <span class="pil" style="color: var(--mint)" data-stap></span>
      </div>
      <div class="rij" data-stappen></div>
    </main>
  </div>
  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="klein" href="instellingen.html" style="font-weight: 600">‹ Instellingen</a>
      <h1 class="kop-1" style="font-size: 34px">Wat je huis kan</h1>
      <span class="pil" style="color: var(--mint); align-self: start" data-stap></span>
      <div class="rij" data-stappen style="display: grid; gap: 14px"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
  </div>
  <script src="kit/nav.js"></script>
  <script src="kit/huis.js"></script>
  <script src="basis.js"></script>
  <script src="huis-kan.js"></script>
</body>
</html>
