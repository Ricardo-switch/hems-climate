<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Wat je huis kan · SunArc</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png">
<link rel="apple-touch-icon" href="icoon-192.png">

<style>
  /*
   * Wat je huis kan (besluit 130, schets Wand-Huis-kan): alles wat Smart
   * Climate voor je doet, per onderwerp, met een stand. Links het huis met
   * aanwijzers, en wat er het meeste bij zou opleveren. Een tik opent het blad.
   */
  #wand main { position: relative; display: flex; flex-direction: column; gap: 14px; height: 100%; min-height: 0; }
  .terugje { font-size: 14px; font-weight: 600; color: var(--zacht); text-decoration: none; }
  .kopregel { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .kopregel .lead { max-width: 52ch; margin-top: 6px; }
  .legenda { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .legenda button { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid transparent; background: rgb(var(--wit) / 0.06); color: var(--tekst); font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .legenda button b { font-family: var(--kop); font-size: 15px; }
  .legenda button[aria-pressed='true'] { border-color: rgb(var(--wit) / 0.5); background: rgb(var(--wit) / 0.12); }

  .veld { position: relative; flex: 1; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 16px; min-height: 0; }
  .links { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .podium { flex: 1; min-height: 0; margin: -6px -10px 0 -18px; }
  /* Haal er meer uit (besluit 132): de drie beste ideeën, de grootste winst eerst. */
  .meer { padding: 14px 16px 8px; border-color: rgba(247, 181, 72, 0.35); background: linear-gradient(160deg, rgba(247, 181, 72, 0.1), rgb(var(--wit) / 0.03)); }
  .meer .wanneer { display: block; color: var(--zon-t); font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .idee { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 7px 0; border-top: 1px solid rgb(var(--wit) / 0.06); color: inherit; text-decoration: none; }
  .idee:first-of-type { border-top: 0; }
  .idee b { display: block; font-size: 14px; font-weight: 600; }
  .idee span { display: block; font-size: 12.5px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idee .wint { text-align: right; font-family: var(--kop); font-size: 17px; font-weight: 600; color: var(--zon-t); line-height: 1.1; }
  .idee .wint small { display: block; font-family: var(--tekst, inherit); font-size: 11.5px; font-weight: 500; color: var(--gedempt); }
  .idee .wint.zacht { font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--zacht); }
  .idee:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; border-radius: 10px; }

  /* Zes groepen in drie rijen (besluit 187, schets Wand-Huis-kan-3). */
  .vakken { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); gap: 12px; min-height: 0; }
  .vak { padding: 10px 14px 4px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .vak h3 { margin: 0 0 1px; font-family: var(--kop); font-size: 15px; font-weight: 600; }
  .vak.leren { border-color: rgba(143, 134, 255, 0.3); background: linear-gradient(160deg, rgba(143, 134, 255, 0.09), rgba(255, 255, 255, 0.03)); }
  .regel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 4px 0; border: 0; border-top: 1px solid rgb(var(--wit) / 0.06); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%; }
  .regel:first-of-type { border-top: 0; }
  .regel b { display: block; font-size: 14px; font-weight: 600; }
  .regel span.nu { display: block; font-size: 12.5px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Iets om even na te kijken, zoals een bijna lege batterij: wel in orde, niet rood. */
  .regel span.nu.let { color: var(--gloed-zacht); }
  .regel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; border-radius: 10px; }
  .regel.gekozen { background: rgb(var(--wit) / 0.07); border-radius: 12px; margin: 0 -8px; padding: 6px 8px; width: calc(100% + 16px); border-top-color: transparent; }
  .regel.weg { opacity: 0.3; }

  .stand { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .stand::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .stand.werkt { color: var(--mint-t); background: rgba(110, 231, 183, 0.1); }
  .stand.kijkt { color: var(--ijs-t); background: rgba(111, 211, 255, 0.1); }
  .stand.leert { color: var(--violet-t); background: rgba(143, 134, 255, 0.14); }
  .stand.uit { color: var(--gedempt); background: rgb(var(--wit) / 0.06); }
  .stand.mis { color: var(--gloed-t); background: rgba(255, 122, 77, 0.12); }
  .stand.nodig { color: var(--zon-t); background: transparent; box-shadow: inset 0 0 0 1px rgba(247, 181, 72, 0.45); }
  .stand.nodig::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }

  /* Het blad: over de vakken heen, zoals het weer op Thuis. */
  .blad { position: absolute; left: 436px; right: 0; top: 0; bottom: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; background: rgb(var(--nacht) / 0.96); z-index: 5; overflow: auto; }
  .blad[hidden] { display: none; }
  .blad .bovenaan { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
  .blad .sluit { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; flex: none; }
  .blad .twee { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .blad h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--gedempt); }
  .blad .lijst { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--zacht); }
  .blad .lijst li { display: flex; gap: 8px; }
  .blad .lijst li::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--mint); margin-top: 7px; }
  .blad .nu { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgb(var(--wit) / 0.05); font-size: 14px; color: var(--zacht); }
  .blad .som { padding: 14px 16px; border-radius: 18px; background: rgba(247, 181, 72, 0.07); border: 1px solid rgba(247, 181, 72, 0.25); }
  .blad .som .getal { font-family: var(--kop); font-size: 34px; font-weight: 600; line-height: 1.05; color: var(--zon-t); }
  .blad .som .getal small { font-size: 16px; color: var(--zacht); font-weight: 500; }
  .blad .waar { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .kamerkaart { padding: 12px 14px; border-radius: 16px; background: rgba(110, 231, 183, 0.06); border: 1px solid rgba(110, 231, 183, 0.22); }
  .kamerkaart b { display: block; font-size: 15px; }
  .kamerkaart span { display: block; font-size: 12.5px; color: var(--zacht); margin-top: 2px; }
  .kanook { padding: 14px 16px; border-radius: 18px; border: 1px solid rgba(247, 181, 72, 0.3); background: rgba(247, 181, 72, 0.06); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; color: inherit; text-decoration: none; }
  .kanook .wanneer { color: var(--zon-t); font-size: 13px; font-weight: 700; }
  .kanook b { font-size: 16px; }
  .kanook p { margin: 0; font-size: 14px; color: var(--zacht); }
  .kanook .knop { grid-row: 1 / 4; grid-column: 2; height: 40px; padding: 0 16px; border-radius: 12px; background: var(--accent); color: var(--op-accent); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; }
  .blad .onder { margin-top: auto; display: flex; gap: 10px; align-items: center; }
  .blad .onder a { height: 42px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--op-accent); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none; }
  .achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.55); z-index: 29; }
  /* Klaarzetten in Home Assistant (besluit 179). */
  .kopknoppen { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .klaarknop { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glas-rand); background: rgb(var(--wit) / 0.08); color: var(--tekst); font: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .klaarknop b { font-family: var(--kop); font-size: 14px; }
  .klaargroep { display: flex; flex-direction: column; gap: 6px; }
  .klaargroep h4 { margin: 4px 0 0; }
  .klaarregel { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 14px; background: rgb(var(--wit) / 0.04); }
  .klaarregel.mist { background: rgba(255, 122, 77, 0.07); }
  .klaarregel b { display: block; font-size: 14.5px; }
  .klaarregel span:not(.stip), .klaarregel small { display: block; font-size: 13px; color: var(--zacht); margin-top: 1px; }
  .klaarregel small { color: var(--gedempt); }
  .klaarregel .knop { height: 34px; padding: 0 14px; font-size: 13px; }
  #tel .kopknoppen, #tel [data-klaarknop] { align-items: flex-start; }
  /* Hoe ver je huis is: de kleine zonnewaaier als knop (schets Wand-Voortgang #ingang). */
  .knoprij { display: flex; gap: 8px; align-items: center; }
  .voortgangknop { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid var(--glas-rand); background: rgb(var(--wit) / 0.08); color: inherit; text-decoration: none; font-size: 13px; font-weight: 600; }
  .voortgangknop svg { width: 50px; height: 29px; flex: none; margin-top: 2px; }
  .voortgangknop .zin { display: none; }
  .voortgangknop .pct { font-family: var(--kop); font-size: 14px; font-weight: 700; color: var(--zon-t); }
  .voortgangknop .pijl { font-size: 16px; color: var(--gedempt); }
  .voortgangknop:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  #tel .knoprij { flex-direction: column; align-items: stretch; }
  #tel .voortgangknop { height: 62px; padding: 0 14px 0 8px; border-radius: 18px; gap: 12px; }
  #tel .voortgangknop svg { width: 96px; height: 54px; }
  #tel .voortgangknop b { display: block; font-size: 14px; }
  #tel .voortgangknop .zin { display: block; font-size: 12px; font-weight: 500; color: var(--gedempt); }
  #tel .voortgangknop .pct { display: none; }
  #tel .voortgangknop .pijl { margin-left: auto; font-size: 20px; }

  /* De telefoon. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .legenda { justify-content: flex-start; }
  #tel .vakken { display: flex; flex-direction: column; }
  #tel .podium { height: 300px; margin: 0; }
  #tel .blad { position: fixed; left: 8px; right: 8px; top: auto; bottom: 8px; max-height: 84vh; border-radius: 26px; z-index: 30; }
  #tel .blad .twee { grid-template-columns: 1fr; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" data-t-aria-label="nav.hoofdmenu"></nav>
    <main>
      <a class="terugje" href="instellingen.html" data-t="jij.terugInstellingen"></a>
      <div class="kopregel">
        <div><h1 class="kop-1" data-t="instellingen.kan"></h1><p class="lead" data-t="kan.lead"></p></div>
        <div class="kopknoppen"><div class="knoprij"><div data-voortgangknop></div><div data-klaarknop></div></div><div class="legenda" role="group" data-t-aria-label="kan.alleen" data-legenda></div></div>
      </div>
      <div class="veld">
        <section class="links"><div class="podium" id="podium-wand"></div><div data-meer></div></section>
        <section class="vakken" data-vakken></section>
        <aside class="glas blad" role="dialog" data-t-aria-label="kan.uitleg" data-blad hidden></aside>
      </div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="terugje" href="instellingen.html" data-t="jij.terugInstellingen"></a>
      <h1 class="kop-1" style="font-size: 32px" data-t="instellingen.kan"></h1>
      <div data-voortgangknop></div>
      <div data-klaarknop></div>
      <div class="legenda" role="group" data-t-aria-label="kan.alleen" data-legenda></div>
      <div class="podium" id="podium-tel"></div>
      <div data-meer></div>
      <section class="vakken" data-vakken></section>
    </div>
    <div class="achter" data-achter hidden></div>
    <aside class="glas blad" role="dialog" data-t-aria-label="kan.uitleg" data-blad hidden></aside>
    <nav class="tabs" id="tabs" data-t-aria-label="nav.hoofdmenu"></nav>
  </div>
  <script src="kit/teksten.nl.js"></script>
  <script src="kit/teksten.en.js"></script>
  <script src="kit/taal.js"></script>
  <script src="kit/nav.js"></script>
  <script src="kit/huis.js"></script>
  <script src="kit/waaier.js"></script>
  <script src="basis.js"></script>
  <script src="huismodel.js"></script>
  <script src="stand.js"></script>
  <script src="huis-kan.js"></script>
  <script src="rondleiding.js"></script>
</body>
</html>
