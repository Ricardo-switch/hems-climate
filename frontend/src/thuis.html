<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png">
<link rel="apple-touch-icon" href="icoon-192.png">
<script>(function () { var d = document.documentElement, w0 = 0, h0 = 0; function s() { var a = document.activeElement; if (w0 === innerWidth && innerHeight < h0 && a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return; w0 = innerWidth; h0 = innerHeight; var b = Math.min(1700, Math.max(1280, Math.round(800 * innerWidth / innerHeight))); d.classList.toggle('tel-stand', innerHeight > innerWidth || innerWidth < 560); d.style.setProperty('--wandbreedte', b + 'px'); d.style.setProperty('--wandschaal', Math.min(innerWidth / b, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  .kopregel { display: flex; justify-content: space-between; align-items: baseline; }
  .tijd { font-family: var(--kop); font-weight: 600; font-size: 60px; letter-spacing: -0.03em; line-height: 1; }
  .datum { color: var(--zacht); font-size: 17px; margin-left: 14px; white-space: nowrap; }
  .chips { display: flex; gap: 10px; align-items: center; }
  .titel { position: absolute; left: 22px; top: 108px; width: 380px; z-index: 2; }
  .titel .lead { margin-top: 12px; }
  /*
   * Een bredere wand dan 1280 (een liggende telefoon, besluit 128): een derde
   * van wat erbij komt naar de rechterkolom, de rest naar het huis, dat er
   * groter en in het midden van zijn vak in staat.
   */
  .podium { position: absolute; left: 0; top: 96px; right: calc(420px + (var(--wandbreedte, 1280px) - 1280px) / 3); height: 612px; }
  .rechts { position: absolute; right: 26px; top: 96px; bottom: 20px; width: calc(352px + (var(--wandbreedte, 1280px) - 1280px) / 3); display: flex; flex-direction: column; gap: 14px; }
  #wand .rechts > * { flex: none; }
  .kaart { padding: 18px 20px; }
  /* Een kaart die ergens heen gaat (besluit 129): Vandaag naar de dag, Straks naar de assistent. */
  a.kaartlink { display: block; color: inherit; text-decoration: none; cursor: pointer; }
  a.kaartlink:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .kaart-kop { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .straks { background: linear-gradient(160deg, rgba(143,134,255,0.16), rgba(111,211,255,0.06)); border-color: rgba(143,134,255,0.32); }
  .apparaatkaart { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; padding: 14px 18px; }
  .apparaatkaart .ring { width: 54px; height: 54px; flex: none; }
  .apparaatkaart b { display: block; font-size: 16px; }

  .dok { position: absolute; left: 22px; right: calc(26px + 352px + 14px + (var(--wandbreedte, 1280px) - 1280px) / 3); bottom: 20px; height: 68px; border-radius: 22px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: rgba(9, 15, 28, 0.6); border: 1px solid var(--glas-rand); backdrop-filter: blur(12px); }
  .dok .vraag { flex: 1; color: var(--zacht); font-size: 16px; }
  .dok .vraag b { color: var(--tekst); }
  /* De begroeting (15 oktober 2026): klein boven de kop. */
  .groet { display: block; font-size: 15px; font-weight: 600; color: var(--zacht); margin-bottom: 6px; }
  .groet b { color: var(--tekst); }
  /* Welk comfort geldt (besluit 147): een gezicht, de reden, en terugzetten. */
  .geldt { margin-top: 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: rgba(9, 15, 28, 0.55); border: 1px solid rgba(247, 181, 72, 0.35); backdrop-filter: blur(10px); }
  .geldt[hidden] { display: none; }
  .geldt .gezicht { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--kop); font-weight: 700; color: #0b1424; background: #f7b548; }
  .geldt b { display: block; font-size: 14.5px; }
  .geldt span span { display: block; font-size: 12.5px; color: var(--zacht); margin-top: 1px; }
  .geldt .terug { grid-column: 2; justify-self: start; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, 0.1); color: var(--tekst); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .geldt .terug:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  /* Onderhoud (15 oktober 2026): een sleutel bovenin, alleen als er iets te doen is; een tik klapt hem open. */
  .onderhoud { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .onderhoud[hidden] { display: none; }
  .onderhoud .pil { color: var(--gloed); gap: 8px; min-width: 0; }
  .onderhoudknop { width: 40px; padding: 0; justify-content: center; position: relative; }
  .onderhoudknop b { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--gloed); color: #fff; font-size: 10.5px; line-height: 16px; text-align: center; }
  .onderhoudtekst { max-width: 420px; }
  #wand .onderhoudtekst { max-width: 290px; }
  .onderhoudtekst span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .onderhoudtekst a, .onderhoudtekst button { flex: none; color: var(--tekst); font: inherit; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
  .uitlegknop { width: 34px; padding: 0; justify-content: center; font-weight: 800; color: var(--zacht); }

  /* De telefoon. */
  #tel .boven { padding: 18px 18px 0; }
  #tel .kopregel { align-items: center; }
  /* De bel en het tandwiel even groot als de andere knoppen (besluit 136). */
  #tel .kopregel .pil svg { width: 17px; height: 17px; flex: none; }
  /* Past het niet naast de klok, zoals bij Afwezig, dan schuift het naar een tweede regel. */
  #tel .kopregel { gap: 10px; }
  #tel .kopregel > [data-tijd] { flex: none; }
  #tel .kopregel > span:last-child { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; min-width: 0; }
  #tel .meldbel b { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--gloed); color: #fff; font-size: 10.5px; line-height: 16px; text-align: center; }
  /* Een lange naam bij een lege batterij past binnen het scherm. */
  #tel .batterijpil { max-width: 100%; }
  #tel .tijd { font-size: 40px; }
  #tel .titel { position: static; width: auto; margin-top: 14px; }
  #tel .titel .kop-1 { font-size: 34px; }
  #tel .titel .lead { font-size: 15.5px; margin-top: 8px; max-width: none; }
  #tel .podium { position: static; width: 100%; height: 360px; margin-top: -6px; }
  #tel .inhoud { padding: 0 16px 110px; display: flex; flex-direction: column; gap: 12px; }
  .kamer { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .kamer .naam { flex: 1; min-width: 0; }
  .kamer .naam b { display: block; font-size: 16px; }
  .kamer .naam span { font-size: 13.5px; font-weight: 600; }
  .kamer .getal { font-size: 30px; }
  .weg { display: none !important; }

  /* Het weer (besluit 105): een blad over de rechterkolom, op de telefoon onderin. */
  button.pil { border: 0; color: inherit; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.pil:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .weerknop svg { width: 20px; height: 20px; margin-left: -4px; }
  .weer { padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; background: rgba(12, 20, 34, 0.94); z-index: 5; }
  #wand .weer { position: absolute; right: 26px; top: 96px; width: calc(352px + (var(--wandbreedte, 1280px) - 1280px) / 3); bottom: 108px; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; }
  #tel .weer { position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 82vh; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; border-radius: 26px; z-index: 30; }
  .weer-achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.55); z-index: 29; }
  /* Niet krimpen: wat niet past, scrolt in het blad. */
  .weer > * { flex-shrink: 0; }
  .weer .weerkop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .weer .sluit { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; }
  .weer .rij { display: grid; grid-template-columns: 74px 30px 1fr; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .weer .rij:first-of-type { border-top: 0; }
  .weer .dag { font-weight: 700; font-size: 15px; }
  .weer .dag span { display: block; font-weight: 500; font-size: 12.5px; color: var(--gedempt); }
  .weer .rij svg { width: 30px; height: 30px; }
  .weer .temp { display: flex; justify-content: space-between; font-size: 14px; color: var(--zacht); }
  .weer .temp b { color: var(--tekst); font-size: 15px; }
  .weer .opbrengst { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--zacht); }
  .weer .opbrengst i { flex: 1; position: relative; height: 8px; border-radius: 4px; background: rgba(247, 181, 72, 0.14); overflow: hidden; }
  .weer .opbrengst i b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--zon); }
  .weer .opbrengst span { min-width: 74px; text-align: right; color: var(--tekst); font-weight: 600; }
  .weer .voet { margin: auto 0 0; padding-top: 10px; }
  /* Het weer per uur (besluit 128): een strook om opzij te vegen. */
  /* Zijwaarts de uren; omhoog vegen op de uren schuift het blad, niet niets. */
  .weer .uren { display: flex; gap: 4px; overflow-x: auto; overscroll-behavior-x: contain; padding: 2px 0 10px; margin-bottom: 2px; }
  .weer .uur { flex: none; width: 46px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border-radius: 12px; background: rgba(255, 255, 255, 0.04); font-size: 12px; color: var(--zacht); }
  .weer .uur:first-child { background: rgba(255, 255, 255, 0.1); color: var(--tekst); }
  .weer .uur svg { width: 24px; height: 24px; }
  .weer .uur b { font-size: 14px; color: var(--tekst); }
  .weer .uur .kans { color: var(--ijs); min-height: 14px; font-size: 11px; }
  #tel .weer::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); margin: -6px auto 6px; flex-shrink: 0; }
  #wand .weer .rij { padding: 7px 0; }
  /* Een batterij bijna leeg (besluit 122): een rustige maar duidelijke pil. */
  /* Een knop (besluit 127): button.pil zet de kleur anders terug naar wit. */
  button.pil.batterijpil, .batterijpil { color: var(--gloed); text-decoration: none; gap: 6px; min-width: 0; max-width: 400px; }
  .batterijpil span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .batterijpil svg { flex: none; }
  /* De lijst van batterijen (besluit 127), in hetzelfde blad als het weer. */
  .weer .accu { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); color: inherit; text-decoration: none; }
  .weer .accu:first-of-type { border-top: 0; }
  .weer .accu b { font-size: 15px; }
  .weer .accu span { font-size: 12.5px; color: var(--gedempt); }
  .weer .accu .pct { grid-row: 1 / 3; grid-column: 2; font-weight: 700; font-size: 15px; color: var(--zacht); }
  .weer .accu.leeg .pct { color: var(--gloed); }
  .weer .accu i { grid-column: 1; position: relative; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 4px; }
  .weer .accu i b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--groen, #5ad19a); }
  .weer .accu.leeg i b { background: var(--gloed); }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="kopregel">
        <div><span class="tijd" data-tijd>--:--</span><span class="datum" data-datum></span></div>
        <div class="chips">
          <span class="onderhoud" data-onderhoud hidden></span>
          <a class="pil" href="inrichten.html" data-inrichten hidden style="color: var(--ijs); text-decoration: none">Inrichten</a>
          <button class="pil weerknop" type="button" data-buiten aria-haspopup="dialog" aria-controls="weer-wand"></button>
          <span class="pil" data-modus></span>
          <span class="pil" style="color: var(--mint)" data-fase><span class="stip" style="background: var(--mint)"></span>Kijkt mee</span>
          <button class="pil uitlegknop" type="button" data-uitleg aria-label="Zo werkt het huis" title="Zo werkt het huis">?</button>
        </div>
      </div>
      <div class="titel">
        <span class="groet" data-groet></span>
        <h1 class="kop-1" data-kop>Even laden</h1>
        <p class="lead" data-zin></p>
        <div class="geldt" data-geldt hidden></div>
      </div>
      <div class="podium" id="podium-wand"></div>
      <aside class="rechts schuift">
        <a class="glas kaart kaartlink" href="vandaag.html" aria-label="Vandaag: de hele dag bekijken">
          <div class="kaart-kop"><h2 class="kop-3">Vandaag</h2><span class="mini" data-opgewekt></span></div>
          <div data-dag></div>
          <p class="mini" style="margin: 6px 0 0" data-dag-zin></p>
        </a>
        <a class="glas kaart straks kaartlink" href="assistent.html#straks" data-straks hidden>
          <div style="display: flex; align-items: center; gap: 10px"><span class="bol" style="width: 24px; height: 24px"></span><span class="klein">Straks</span></div>
          <h2 class="kop-2" style="margin-top: 10px" data-straks-kop></h2>
          <p class="klein" style="margin: 8px 0 0" data-straks-zin></p>
        </a>
        <a class="glas kaart apparaatkaart" href="apparaten.html" data-apparaatkaart hidden></a>
        <section class="glas kaart" data-gevoel-kaart>
          <h2 class="kop-3" data-gevoel-kop>Hoe voelt het?</h2>
          <p class="mini" style="margin: 2px 0 0" data-gevoel-uitleg>Tik wat je nu voelt; daar leert het huis van wat jij prettig vindt.</p>
          <div class="gevoelblok" data-gevoel></div>
        </section>
      </aside>
      <section class="glas weer" id="weer-wand" role="dialog" aria-label="Het weer" hidden data-weer></section>
      <div class="dok">
        <a class="bol adem" href="assistent.html#nu" aria-label="Vraag de assistent wat het huis nu doet" style="width: 46px; height: 46px; flex: none"></a>
        <a class="vraag" href="assistent.html#typ">Tik om iets te vragen over je huis</a>
        <a class="pil" href="assistent.html#nu">Wat doe je nu?</a>
        <a class="pil" href="assistent.html#zon">Hoeveel zon vandaag?</a>
      </div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="boven">
      <div class="kopregel">
        <span class="tijd" data-tijd>--:--</span>
        <span style="display: flex; gap: 8px; align-items: center">
          <button class="pil weerknop" type="button" style="height: 32px; font-size: 13px" data-buiten aria-haspopup="dialog" aria-controls="weer-tel"></button>
          <span class="pil" style="height: 32px; font-size: 13px" data-modus></span>
          <button class="pil uitlegknop" type="button" data-uitleg aria-label="Zo werkt het huis" style="height: 32px; width: 32px">?</button>
          <button type="button" class="pil meldbel" aria-label="Meldingen" aria-haspopup="dialog" style="position: relative; height: 32px; width: 32px; padding: 0; justify-content: center; border: 0; color: inherit; cursor: pointer" data-meldbel data-meldicoon><b data-meldaantal hidden></b></button>
          <a class="pil" href="instellingen.html" aria-label="Instellingen" style="height: 32px; width: 32px; padding: 0; justify-content: center" data-tandwiel></a>
        </span>
      </div>
      <div class="titel"><span class="groet" data-groet></span><h1 class="kop-1" data-kop>Even laden</h1><p class="lead" data-zin></p><div class="geldt" data-geldt hidden></div></div>
      <span class="onderhoud" data-onderhoud hidden style="align-self: flex-start; max-width: 100%"></span>
    </div>
    <div class="podium" id="podium-tel"></div>
    <div class="inhoud">
      <div data-kamers style="display: flex; flex-direction: column; gap: 12px"></div>
      <a class="glas kaart straks kaartlink" href="assistent.html#straks" data-straks hidden>
        <div style="display: flex; align-items: center; gap: 10px"><span class="bol" style="width: 22px; height: 22px"></span><span class="klein">Straks</span></div>
        <h2 class="kop-2" style="margin-top: 8px" data-straks-kop></h2>
        <p class="klein" style="margin: 6px 0 0" data-straks-zin></p>
      </a>
      <a class="glas-klein" href="assistent.html#typ" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 20px; color: var(--zacht)"><span class="bol" style="width: 34px; height: 34px"></span>Vraag iets over je huis</a>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
    <div class="weer-achter" hidden data-weer-achter></div>
    <section class="glas weer" id="weer-tel" role="dialog" aria-label="Het weer" hidden data-weer></section>
  </div>
  <script src="kit/nav.js"></script>
  <script src="kit/huis.js"></script>
  <script src="basis.js"></script>
  <script src="huismodel.js"></script>
  <script src="gevoel.js"></script>
  <script src="film.js"></script>
  <script src="rondleiding.js"></script>
  <script src="thuis.js"></script>
</body>
</html>
