<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Smart Climate</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<script>(function () { var d = document.documentElement; function s() { d.classList.toggle('tel-stand', innerWidth < 900 || innerHeight > innerWidth); d.style.setProperty('--wandschaal', Math.min(innerWidth / 1280, innerHeight / 800)); } s(); addEventListener('resize', s); })();</script>
<style>
  .kopregel { display: flex; justify-content: space-between; align-items: baseline; }
  .tijd { font-family: var(--kop); font-weight: 600; font-size: 60px; letter-spacing: -0.03em; line-height: 1; }
  .datum { color: var(--zacht); font-size: 17px; margin-left: 14px; }
  .chips { display: flex; gap: 10px; align-items: center; }
  .titel { position: absolute; left: 22px; top: 108px; width: 380px; z-index: 2; }
  .titel .lead { margin-top: 12px; }
  .podium { position: absolute; left: 0; top: 96px; width: 860px; height: 612px; }
  .rechts { position: absolute; right: 26px; top: 96px; width: 352px; display: flex; flex-direction: column; gap: 14px; }
  .kaart { padding: 18px 20px; }
  .kaart-kop { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .straks { background: linear-gradient(160deg, rgba(143,134,255,0.16), rgba(111,211,255,0.06)); border-color: rgba(143,134,255,0.32); }
  .apparaatkaart { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; padding: 14px 18px; }
  .apparaatkaart .ring { width: 54px; height: 54px; flex: none; }
  .apparaatkaart b { display: block; font-size: 16px; }
  .gevoel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .gevoel button { height: 40px; border-radius: 12px; border: 0; font-weight: 700; font-size: 14px; cursor: pointer; }
  .gevoel button[aria-pressed='true'] { box-shadow: inset 0 0 0 2px currentColor; }
  .dok { position: absolute; left: 22px; right: 26px; bottom: 20px; height: 68px; border-radius: 22px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: rgba(9, 15, 28, 0.6); border: 1px solid var(--glas-rand); backdrop-filter: blur(12px); }
  .dok .vraag { flex: 1; color: var(--zacht); font-size: 16px; }
  .dok .vraag b { color: var(--tekst); }
  .uitlegknop { width: 34px; padding: 0; justify-content: center; font-weight: 800; color: var(--zacht); }

  /* De telefoon. */
  #tel .boven { padding: 18px 18px 0; }
  #tel .kopregel { align-items: center; }
  #tel .tijd { font-size: 40px; }
  #tel .titel { position: static; width: auto; margin-top: 14px; }
  #tel .titel .kop-1 { font-size: 34px; }
  #tel .titel .lead { font-size: 15.5px; margin-top: 8px; max-width: none; }
  #tel .podium { position: static; width: 100%; height: 360px; margin-top: -6px; }
  #tel .inhoud { padding: 0 16px 110px; display: flex; flex-direction: column; gap: 12px; }
  .kamer { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .kamer .naam { flex: 1; min-width: 0; }
  .kamer .naam b { display: block; font-size: 16px; }
  .kamer .naam span { font-size: 13.5px; font-weight: 600; }
  .kamer .getal { font-size: 30px; }
  .weg { display: none !important; }

  /* De rondleiding (schets Wand-Uitleg): het huis licht op, een ballon vertelt. */
  .dim { position: absolute; inset: 0; background: rgba(4, 8, 16, 0.62); z-index: 3; }
  #tel .dim { position: fixed; z-index: 28; }
  body.rondleiding #wand .podium { z-index: 4; }
  body.rondleiding #tel .podium { position: relative; z-index: 29; }

  .tik { position: absolute; z-index: 5; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.15), 0 0 30px rgba(111, 211, 255, 0.6); pointer-events: none; animation: tikken 1.6s ease-in-out infinite; transition: left 0.4s, top 0.4s; }
  @keyframes tikken { 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .tik { animation: none; transition: none; } }
  .ballon { position: absolute; z-index: 6; width: 330px; padding: 20px 22px; border-radius: 22px; background: #f2f6f9; color: #0b1424; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); transition: left 0.4s, top 0.4s; }
  .ballon::after { content: ''; position: absolute; top: 46px; width: 20px; height: 20px; background: #f2f6f9; transform: rotate(45deg); border-radius: 3px; }
  .ballon.rechts::after { left: -10px; }
  .ballon.links::after { right: -10px; }
  #tel .ballon { position: fixed; left: 12px; right: 12px; top: 12px; width: auto; z-index: 31; }
  #tel .ballon::after { display: none; }
  .ballon h2 { font-family: var(--kop); font-weight: 600; font-size: 24px; line-height: 1.12; margin: 0; letter-spacing: -0.01em; }
  .ballon p { margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #34414f; }
  .ballon .onder { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .stippen { display: flex; gap: 6px; }
  .stippen i { width: 8px; height: 8px; border-radius: 50%; background: #c3ccd5; }
  .stippen i.aan { background: #0b1424; width: 22px; border-radius: 4px; }
  .ballon button { height: 40px; padding: 0 18px; border-radius: 12px; border: 0; background: #0b1424; color: #fff; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .ballon .overslaan { background: transparent; color: #57636f; padding: 0 8px; }
  .ballon button:focus-visible { outline: 2px solid #0b1424; outline-offset: 2px; }
  .stappen { position: absolute; z-index: 6; left: 22px; right: 26px; bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stap { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 18px; background: #0c1422; border: 1px solid var(--glas-rand); }
  .stap.nu { border-color: rgba(111, 211, 255, 0.55); }
  .stap .mini-huis { width: 92px; height: 70px; flex: none; }
  .stap b { display: block; font-size: 15px; }

  /* Het weer (besluit 105): een blad over de rechterkolom, op de telefoon onderin. */
  button.pil { border: 0; color: inherit; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.pil:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .weerknop svg { width: 20px; height: 20px; margin-left: -4px; }
  .weer { padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; background: rgba(12, 20, 34, 0.94); z-index: 5; }
  #wand .weer { position: absolute; right: 26px; top: 96px; width: 352px; bottom: 108px; overflow: auto; }
  #tel .weer { position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 82vh; overflow: auto; border-radius: 26px; z-index: 30; }
  .weer-achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.55); z-index: 29; }
  /* Niet krimpen: wat niet past, scrolt in het blad. */
  .weer > * { flex-shrink: 0; }
  .weer .weerkop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .weer .sluit { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; }
  .weer .rij { display: grid; grid-template-columns: 74px 30px 1fr; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .weer .rij:first-of-type { border-top: 0; }
  .weer .dag { font-weight: 700; font-size: 15px; }
  .weer .dag span { display: block; font-weight: 500; font-size: 12.5px; color: var(--gedempt); }
  .weer .rij svg { width: 30px; height: 30px; }
  .weer .temp { display: flex; justify-content: space-between; font-size: 14px; color: var(--zacht); }
  .weer .temp b { color: var(--tekst); font-size: 15px; }
  .weer .opbrengst { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--zacht); }
  .weer .opbrengst i { flex: 1; position: relative; height: 8px; border-radius: 4px; background: rgba(247, 181, 72, 0.14); overflow: hidden; }
  .weer .opbrengst i b { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--zon); }
  .weer .opbrengst span { min-width: 74px; text-align: right; color: var(--tekst); font-weight: 600; }
  .weer .voet { margin: auto 0 0; padding-top: 10px; }
  #tel .weer::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); margin: -6px auto 6px; flex-shrink: 0; }
  #wand .weer .rij { padding: 7px 0; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="kopregel">
        <div><span class="tijd" data-tijd>--:--</span><span class="datum" data-datum></span></div>
        <div class="chips">
          <button class="pil weerknop" type="button" data-buiten aria-haspopup="dialog" aria-controls="weer-wand"></button>
          <span class="pil" data-modus></span>
          <span class="pil" style="color: var(--mint)" data-fase><span class="stip" style="background: var(--mint)"></span>Kijkt mee</span>
          <button class="pil uitlegknop" type="button" data-uitleg aria-label="Zo werkt het huis" title="Zo werkt het huis">?</button>
        </div>
      </div>
      <div class="titel">
        <h1 class="kop-1" data-kop>Even laden</h1>
        <p class="lead" data-zin></p>
      </div>
      <div class="podium" id="podium-wand"></div>
      <div class="dim" data-rond hidden></div>
      <span class="tik" data-tik hidden aria-hidden="true"></span>
      <div class="stappen" data-stappen hidden></div>
      <aside class="rechts">
        <section class="glas kaart">
          <div class="kaart-kop"><h2 class="kop-3">Vandaag</h2><span class="mini" data-opgewekt></span></div>
          <div data-dag></div>
          <p class="mini" style="margin: 6px 0 0" data-dag-zin></p>
        </section>
        <section class="glas kaart straks" data-straks hidden>
          <div style="display: flex; align-items: center; gap: 10px"><span class="bol" style="width: 24px; height: 24px"></span><span class="klein">Straks</span></div>
          <h2 class="kop-2" style="margin-top: 10px" data-straks-kop></h2>
          <p class="klein" style="margin: 8px 0 0" data-straks-zin></p>
        </section>
        <a class="glas kaart apparaatkaart" href="apparaten.html" data-apparaatkaart hidden></a>
        <section class="glas kaart" data-gevoel-kaart>
          <h2 class="kop-3" data-gevoel-kop>Hoe voelt het?</h2>
          <p class="mini" style="margin: 2px 0 0" data-gevoel-uitleg>Tik wat je nu voelt; daar leert het huis van wat jij prettig vindt.</p>
          <div class="gevoel" data-gevoel></div>
          <p class="mini" style="margin: 8px 0 0" data-gevoel-zin></p>
        </section>
      </aside>
      <section class="glas weer" id="weer-wand" role="dialog" aria-label="Het weer" hidden data-weer></section>
      <div class="dok">
        <span class="bol adem" style="width: 46px; height: 46px"></span>
        <a class="vraag" href="assistent.html">Tik om iets te vragen over je huis</a>
        <a class="pil" href="assistent.html#nu">Wat doe je nu?</a>
        <a class="pil" href="assistent.html#zon">Hoeveel zon vandaag?</a>
      </div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="boven">
      <div class="kopregel">
        <span class="tijd" data-tijd>--:--</span>
        <span style="display: flex; gap: 8px; align-items: center">
          <button class="pil weerknop" type="button" style="height: 32px; font-size: 13px" data-buiten aria-haspopup="dialog" aria-controls="weer-tel"></button>
          <span class="pil" style="height: 32px; font-size: 13px" data-modus></span>
          <button class="pil uitlegknop" type="button" data-uitleg aria-label="Zo werkt het huis" style="height: 32px; width: 32px">?</button>
          <a class="pil" href="instellingen.html" aria-label="Instellingen" style="height: 32px; width: 32px; padding: 0; justify-content: center" data-tandwiel></a>
        </span>
      </div>
      <div class="titel"><h1 class="kop-1" data-kop>Even laden</h1><p class="lead" data-zin></p></div>
    </div>
    <div class="podium" id="podium-tel"></div>
    <div class="inhoud">
      <div data-kamers style="display: flex; flex-direction: column; gap: 12px"></div>
      <section class="glas kaart straks" data-straks hidden>
        <div style="display: flex; align-items: center; gap: 10px"><span class="bol" style="width: 22px; height: 22px"></span><span class="klein">Straks</span></div>
        <h2 class="kop-2" style="margin-top: 8px" data-straks-kop></h2>
        <p class="klein" style="margin: 6px 0 0" data-straks-zin></p>
      </section>
      <a class="glas-klein" href="assistent.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 20px; color: var(--zacht)"><span class="bol" style="width: 34px; height: 34px"></span>Vraag iets over je huis</a>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
    <div class="dim" data-rond hidden></div>
    <div class="weer-achter" hidden data-weer-achter></div>
    <section class="glas weer" id="weer-tel" role="dialog" aria-label="Het weer" hidden data-weer></section>
  </div>
  <script src="kit/nav.js"></script>
  <script src="kit/huis.js"></script>
  <script src="basis.js"></script>
  <script src="huismodel.js"></script>
  <script src="thuis.js"></script>
</body>
</html>
