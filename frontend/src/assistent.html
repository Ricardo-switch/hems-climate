<meta charset="utf-8">

<title>Assistent · Smart Climate</title>

<style>
  /*
   * De assistent als gesprek (besluit 141, schets Wand-Assistent-Gesprek). Het
   * huis praat zelf: het begroet, vraagt hoe het kan helpen, leest zijn
   * antwoord voor en vraagt of het nog iets kan doen. De bol leeft mee met de
   * stem, de woorden komen mee, en de kamer waar het over gaat licht op.
   * Bedienen met een zin (besluit 148, schets Wand-Assistent-Bedienen): een
   * kaartje per apparaat, en terwijl een scherm beweegt een eigen stopknop.
   */
  #wand main { position: relative; overflow: hidden; }

  /* De bol. */
  .kern { position: relative; width: 300px; height: 300px; display: grid; place-items: center; flex: none; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  .kern:focus-visible { outline: 2px solid var(--tekst); outline-offset: 6px; border-radius: 50%; }
  .bol { width: 150px; height: 150px; border-radius: 50%; position: relative; z-index: 2; background: radial-gradient(circle at 34% 28%, #ffffff 0%, #bfe3ff 16%, #6fb7ff 40%, #6a5cff 72%, #2a1f6b 100%); box-shadow: 0 0 60px rgba(111, 170, 255, 0.55), 0 0 140px rgba(143, 134, 255, 0.35), inset -18px -24px 40px rgba(20, 10, 70, 0.55); transition: transform 0.25s, box-shadow 0.4s, background 0.4s; animation: adem 5s ease-in-out infinite; }
  @keyframes adem { 50% { transform: scale(1.035); } }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(143, 196, 255, 0.18); }
  .ring.r2 { inset: 22px; border-color: rgba(143, 196, 255, 0.28); }
  .ring.r3 { inset: 44px; border: 1px dashed rgba(143, 196, 255, 0.3); }
  .boog { position: absolute; inset: 10px; border-radius: 50%; border: 2px solid transparent; border-top-color: rgba(143, 196, 255, 0.55); border-right-color: rgba(143, 196, 255, 0.15); animation: draai 9s linear infinite; }
  .boog.b2 { inset: 32px; border-top-color: transparent; border-left-color: rgba(183, 176, 255, 0.6); animation-duration: 14s; animation-direction: reverse; }
  @keyframes draai { to { transform: rotate(360deg); } }
  .golf { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity 0.4s; }
  body[data-stand='praat'] .golf { opacity: 1; }
  body[data-stand='praat'] .bol { animation: none; box-shadow: 0 0 80px rgba(111, 170, 255, 0.75), 0 0 200px rgba(143, 134, 255, 0.5), inset -18px -24px 40px rgba(20, 10, 70, 0.55); }
  body[data-stand='denkt'] .boog { animation-duration: 1.6s; }
  body[data-stand='denkt'] .boog.b2 { animation-duration: 2.4s; }
  .tik { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12.5px; font-weight: 600; color: var(--gedempt); white-space: nowrap; z-index: 3; }
  @media (prefers-reduced-motion: reduce) { .boog, .bol { animation: none !important; } }

  /* Wat het zegt. */
  .wie { font-size: 14px; font-weight: 600; color: var(--violet-t); display: flex; align-items: center; gap: 8px; }
  .wie i { width: 8px; height: 8px; border-radius: 50%; background: var(--violet-t); display: block; box-shadow: 0 0 10px var(--violet-t); }
  .jij { font-size: 15px; color: var(--zacht); margin: 0 0 6px; }
  .jij b { color: var(--tekst); }
  .zegt { font-family: var(--kop); font-weight: 600; font-size: 34px; line-height: 1.13; letter-spacing: -0.01em; margin: 10px 0 0; }
  .zegt.lang { font-size: 27px; }
  .zegt .w { transition: color 0.18s; }
  .zegt.loopt .w { color: rgb(var(--wit) / 0.26); }
  .zegt.loopt .w.al { color: var(--tekst); }
  .zegt.loopt .w.nu { color: #fff; text-shadow: 0 0 18px rgba(143, 196, 255, 0.7); }
  .zegt .w.getal, .zegt.loopt .w.getal.al { color: var(--zon-t); }
  .zegt.loopt .w.getal:not(.al) { color: rgba(247, 181, 72, 0.3); }
  .klein-zegt { margin: 14px 0 0; font-size: 16px; line-height: 1.5; color: var(--zacht); max-width: 46ch; }
  .klein-zegt.nogiets { color: var(--tekst); font-weight: 600; }
  .feiten { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .feit { display: flex; flex-direction: column; padding: 9px 13px; border-radius: 14px; background: rgb(var(--wit) / 0.05); border: 1px solid rgb(var(--wit) / 0.08); min-width: 96px; }
  .feit b { font-family: var(--kop); font-size: 19px; font-weight: 600; }
  .feit span { font-size: 12px; color: var(--gedempt); }
  .verder a.knop { margin-top: 16px; text-decoration: none; display: inline-flex; align-items: center; }
  /* Wat er veranderde (besluit 148): het apparaat met zijn nieuwe stand. */
  .gedaan { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .ding { display: grid; grid-template-columns: 38px auto; gap: 1px 12px; align-items: center; padding: 9px 15px 9px 9px; border-radius: 16px; background: rgb(var(--wit) / 0.05); border: 1px solid rgb(var(--wit) / 0.08); }
  .ding.beweegt { border-color: rgba(111, 211, 255, 0.4); }
  .ding .ik { grid-row: span 2; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(111, 211, 255, 0.12); }
  .ding .ik.lamp { background: rgba(255, 183, 101, 0.16); }
  .ding .ik.violet { background: rgba(143, 134, 255, 0.18); }
  .ding .ik svg { width: 20px; height: 20px; }
  .ding b { font-family: var(--kop); font-size: 19px; font-weight: 600; }
  .ding span:last-child { font-size: 12.5px; color: var(--gedempt); }

  /* Vragen die nu ergens over gaan. */
  .suggesties { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sug { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; background: rgb(var(--nacht) / 0.72); border: 1px solid var(--glas-rand); backdrop-filter: blur(10px); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .sug:hover { border-color: rgba(143, 196, 255, 0.45); }
  .sug:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .sug .ik { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: rgba(111, 211, 255, 0.14); }
  .sug .ik.zon { background: rgba(247, 181, 72, 0.16); }
  .sug .ik.violet { background: rgba(143, 134, 255, 0.18); }
  .sug .ik.warm { background: rgba(255, 122, 77, 0.16); }
  .sug .ik.lamp { background: rgba(255, 183, 101, 0.16); }
  .sug .ik svg { width: 19px; height: 19px; }
  .sug b { display: block; font-size: 15px; }
  .sug span { font-size: 12.5px; color: var(--gedempt); }
  .sug.nee { grid-template-columns: 1fr; background: transparent; border-style: dashed; color: var(--zacht); text-align: center; font-weight: 600; }

  /* De balk onderaan. */
  .balkje { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 10px; height: 74px; border-radius: 24px; background: rgb(var(--nacht) / 0.7); border: 1px solid var(--glas-rand); backdrop-filter: blur(14px); }
  .balkje form { flex: 1; display: flex; min-width: 0; }
  .balkje input { flex: 1; min-width: 0; height: 50px; border: 0; background: none; color: var(--tekst); font: inherit; font-size: 17px; padding: 0 12px; }
  .balkje input::placeholder { color: var(--gedempt); }
  .balkje input:focus { outline: none; }
  .balkje:focus-within { border-color: rgba(143, 196, 255, 0.5); }
  .stemknop { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: rgb(var(--wit) / 0.06); color: var(--zacht); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .stemknop[aria-pressed='true'] svg { color: var(--mint-t); }
  .stemknop[aria-pressed='false'] svg { opacity: 0.5; }
  .stop { height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--tekst); color: var(--tegen); font: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; }
  /* Terwijl een scherm beweegt: "Stil" voor het praten, en een grote knop voor het scherm. */
  .stop.zacht { background: rgb(var(--wit) / 0.08); color: var(--zacht); font-weight: 600; }
  .stopscherm { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 16px; border-radius: 999px; border: 0; background: var(--tekst); color: var(--tegen); font: inherit; font-weight: 700; font-size: 15.5px; cursor: pointer; white-space: nowrap; }
  .stopscherm i { width: 13px; height: 13px; border-radius: 3px; background: #0b1424; display: block; }
  #tel .stopscherm { height: 44px; padding: 0 14px 0 12px; font-size: 14px; }
  /* De microfoon (besluit 150): tikken, praten; het huis stopt vanzelf als je stil bent. */
  .mic { width: 50px; height: 50px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(110, 231, 183, 0.16); color: var(--mint-t); cursor: pointer; }
  .mic:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  body.luistert .mic { background: var(--mint); color: #0b1424; box-shadow: 0 0 0 6px rgba(110, 231, 183, 0.18); }
  .niveau { flex: 1; display: flex; align-items: center; gap: 3px; height: 30px; padding: 0 12px; }
  .niveau i { flex: 1; border-radius: 2px; background: var(--mint); opacity: 0.8; min-height: 4px; }
  body.luistert .balkje form { display: none; }
  #tel .mic { width: 46px; height: 46px; }
  .eerder { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--gedempt); }
  .eerder button { border: 0; background: none; color: var(--zacht); font: inherit; font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  [hidden] { display: none !important; }

  /* De wand. */
  #wand .kern { position: absolute; left: 44px; top: 96px; }
  #wand .spraak { position: absolute; left: 368px; top: 104px; width: 460px; }
  #wand .podium { position: absolute; right: 0; top: 140px; width: 420px; height: 480px; opacity: 0.6; transition: opacity 0.6s; }
  body[data-stand='praat'] #wand .podium, body[data-stand='verder'] #wand .podium { opacity: 1; }
  #wand .suggesties { position: absolute; left: 44px; right: 450px; bottom: 124px; }
  #wand .balkje { position: absolute; left: 44px; right: 26px; bottom: 26px; }
  #wand .eerder { position: absolute; left: 368px; top: 66px; }

  /* De telefoon. */
  #tel .inhoud { padding: 14px 16px 200px; display: flex; flex-direction: column; gap: 14px; }
  #tel .boven { display: flex; align-items: center; gap: 14px; }
  #tel .kern { width: 132px; height: 132px; }
  #tel .bol { width: 70px; height: 70px; }
  #tel .ring.r2 { inset: 12px; }
  #tel .ring.r3 { inset: 24px; }
  #tel .boog { inset: 6px; }
  #tel .boog.b2 { inset: 18px; }
  #tel .tik { bottom: -6px; font-size: 11.5px; }
  #tel .zegt { font-size: 25px; }
  #tel .suggesties { grid-template-columns: 1fr; }
  #tel .podium { width: 100%; height: 240px; }
  #tel .balkje { position: fixed; left: 10px; right: 10px; bottom: 96px; height: 64px; z-index: 20; }
  #tel .balkje .stemknop span { display: none; }
</style>

<body class="lucht lucht-dag" data-stand="begin">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
    <main>
      <div class="eerder" data-eerder hidden></div>
      <button type="button" class="kern" data-kern aria-label="Laat het huis praten">
        <svg class="golf" viewBox="0 0 300 300" data-golf aria-hidden="true"></svg>
        <span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="boog"></span><span class="boog b2"></span>
        <span class="bol"></span>
        <span class="tik" data-tik></span>
      </button>
      <div class="spraak" data-spraak aria-live="polite"></div>
      <div class="podium" id="podium-wand" aria-hidden="true"></div>
      <div class="suggesties" data-suggesties role="group" aria-label="Vragen"></div>
      <div class="balkje">
        <form data-vrij><input type="text" name="tekst" maxlength="200" autocomplete="off" enterkeyhint="send" aria-label="Je vraag" placeholder="Typ wat je wilt"></form>
        <button type="button" class="stemknop" data-voorlezen aria-pressed="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span>Voorlezen aan</span></button>
        <div class="niveau" data-niveau hidden aria-hidden="true"></div>
        <button type="button" class="stop" data-stop hidden>Stop</button>
        <button type="button" class="mic" data-mic hidden aria-label="Praat met je huis"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="button" class="stopscherm" data-stopscherm hidden><i></i><span>Stop het screen</span></button>
      </div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <div class="boven">
        <button type="button" class="kern" data-kern aria-label="Laat het huis praten">
          <svg class="golf" viewBox="0 0 300 300" data-golf aria-hidden="true"></svg>
          <span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>
          <span class="boog"></span><span class="boog b2"></span>
          <span class="bol"></span>
          <span class="tik" data-tik></span>
        </button>
        <span class="wie"><i></i>Je huis</span>
      </div>
      <div class="spraak" data-spraak aria-live="polite"></div>
      <div class="suggesties" data-suggesties role="group" aria-label="Vragen"></div>
      <div class="eerder" data-eerder hidden></div>
      <div class="podium" id="podium-tel" aria-hidden="true"></div>
    </div>
    <div class="balkje">
      <form data-vrij><input type="text" name="tekst" maxlength="200" autocomplete="off" enterkeyhint="send" aria-label="Je vraag" placeholder="Typ wat je wilt"></form>
      <button type="button" class="stemknop" data-voorlezen aria-pressed="true" aria-label="Voorlezen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span>Voorlezen aan</span></button>
      <div class="niveau" data-niveau hidden aria-hidden="true"></div>
      <button type="button" class="stop" data-stop hidden>Stop</button>
      <button type="button" class="mic" data-mic hidden aria-label="Praat met je huis"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button type="button" class="stopscherm" data-stopscherm hidden><i></i><span>Stop het screen</span></button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
  </div>
  <script src="kit/nav.js"></script>
  <script src="kit/huis.js"></script>
