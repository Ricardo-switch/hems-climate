# Schaduwmodus op de Synology NAS.
#
# Uitrollen:
#   1. Kopieer de projectmap naar /volume1/docker/hems-climate/src
#   2. Leg .env, config/ en logs/ ernaast (zie README-NAS.md)
#   3. Container Manager → Project → Aanmaken → deze map
#
# De NAS bouwt het image zelf. Dat is met opzet: dan hoef je je niet druk te
# maken over de processorarchitectuur van je NAS tegenover die van je pc.

services:
  hems-shadow:
    # De context is de projectwortel en niet `backend/`: de weergave wordt in
    # hetzelfde image gebouwd en die staat in `frontend/`.
    build:
      context: ./src
      dockerfile: backend/Dockerfile
    image: hems-climate/shadow:latest
    container_name: hems-shadow

    # Herstart na een crash, na een herstart van de NAS, en na de zelfbeëindiging
    # van de bewaking wanneer de verbinding vastloopt. Niet `always`: dan zou hij
    # ook opstarten nadat jij hem bewust hebt stopgezet.
    restart: unless-stopped

    # HA_URL en HA_TOKEN. Blijft buiten het image en buiten versiebeheer.
    env_file:
      - .env

    environment:
      # Van belang: zonder dit draait de container in UTC. De applicatie leest
      # de tijdzone uit de configuratie en is daar niet van afhankelijk, maar
      # tijdstempels in de logregels worden er wel leesbaarder van.
      TZ: Europe/Amsterdam
      SHADOW_TICK_SECONDS: "30"
      SHADOW_MIN_INTERVAL_SECONDS: "15"
      # Sluit zichzelf af bij vastlopen; restart:unless-stopped pakt het op.
      SHADOW_WATCHDOG_MINUTES: "10"
      SHADOW_LOG_DIR: /logs
      # De read-only webweergave. Weglaten betekent: de dienst luistert nergens
      # op, zoals hij dat tot fase 5 deed.
      HEMS_WEB_PORT: "8080"

    volumes:
      # Alleen-lezen: de dienst hoort zijn eigen configuratie nooit te wijzigen.
      #
      # Let op de vorm: hier wordt `config` op `config` gemount, met `sites`
      # eronder — precies zoals de map in de repo eruitziet. Een eerdere versie
      # hernoemde de map onderweg (`./config:/app/config/sites`), en dan komt
      # een gekopieerde `config/sites` een niveau te diep terecht. Wat je
      # neerzet moet eruitzien zoals het in het project staat.
      - ./config:/app/config:ro
      # Hier komt de winterdataset te staan.
      - ./logs:/logs

    # Sinds fase 5 luistert deze dienst wél, maar alleen om te lezen: er is geen
    # route die iets wijzigt, en niet-GET krijgt 405 vóór de routering. Zie
    # DECISIONS.md, besluit 23.
    #
    # Dit bindt op alle adressen van de NAS, dus alles op je thuisnetwerk kan de
    # pagina openen. Dat is de bedoeling. Wat niet de bedoeling is: hier een
    # portforward of reverse proxy naar buiten op zetten. Er is geen
    # authenticatie, en dit proces houdt het HA-token vast.
    #
    # Alleen vanaf de NAS zelf bereikbaar maken kan met "127.0.0.1:8080:8080".
    ports:
      - "8080:8080"

    logging:
      driver: json-file
      options:
        # Zonder grenzen groeit het containerlogboek een winter lang door.
        max-size: "10m"
        max-file: "5"

    # Ruim boven wat hij nodig heeft (~70 MB), maar laag genoeg om te merken
    # dat er iets lekt in plaats van dat de NAS het merkt.
    mem_limit: 256m
