<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · Inrichten 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * Inrichten 3.0 op de telefoon (schets, 24 oktober 2026): dezelfde stappen
   * als op de wand (Wand-Inrichten-3), onder elkaar. Bovenin het hoofdstuk en
   * hoe ver je bent; daaronder het huis klein, dat net zo meegroeit; dan de
   * vraag; onderaan vast Terug en Volgende. Standen: #kamers (zonder hash),
   * #buiten, #zon.
   */
  body { margin: 0; }
  .tel3 { width: 390px; min-height: 844px; display: flex; flex-direction: column; }
  .kop3 { padding: 18px 18px 6px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 30px; height: 30px; border-radius: 10px; background: conic-gradient(from 200deg, #6fd3ff, #8f86ff, #ff7a4d, #f7b548, #6ee7b7, #6fd3ff); flex: none; }
  .kop3 .waar { flex: 1; }
  .kop3 .waar b { display: block; font-size: 14px; }
  .kop3 .waar span { font-size: 12px; color: var(--gedempt); }
  .kop3 .sluit { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgb(var(--wit) / 0.08); color: var(--zacht); }
  .voortgang { display: flex; gap: 3px; padding: 4px 18px 0; }
  .voortgang i { flex: 1; height: 4px; border-radius: 2px; background: rgb(var(--wit) / 0.12); }
  .voortgang i.klaar { background: var(--mint); }
  .voortgang i.nu { background: var(--tekst); }
  .podium { height: 250px; margin: 4px 0 -6px; }
  .vraag { padding: 4px 18px 120px; display: flex; flex-direction: column; gap: 10px; }
  .vraag h1 { margin: 0; font-family: var(--kop); font-size: 27px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
  .vraag .lead { margin: 0; font-size: 14.5px; color: var(--zacht); line-height: 1.45; }
  .lijst { display: flex; flex-direction: column; gap: 6px; }
  .etagekop { font-size: 12px; font-weight: 700; color: var(--gedempt); margin: 4px 2px 0; }
  .regel { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 9px 11px; border-radius: 14px; background: rgb(var(--wit) / 0.05); }
  .regel .ik { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); color: var(--zacht); }
  .regel .ik svg { width: 18px; height: 18px; }
  .regel b { display: block; font-size: 15px; }
  .regel span { display: block; font-size: 12.5px; color: var(--gedempt); }
  .regel span.chips { display: flex; gap: 4px; }
  .regel span.chip { display: inline-flex; }
  .regel .rechts { font-size: 13px; font-weight: 700; color: var(--zacht); }
  .regel .rechts.mint { color: var(--mint-t); }
  .regel .rechts.ijs { color: var(--ijs-t); }
  .regel.uit { background: transparent; border: 1px dashed rgb(var(--wit) / 0.14); }
  .schakel { width: 42px; height: 26px; border-radius: 13px; background: rgb(var(--wit) / 0.14); position: relative; display: block; }
  .schakel::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #c8d2dc; }
  .schakel.aan { background: var(--mint); }
  .schakel.aan::after { left: 19px; background: #0b2a1f; }
  .erbij { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px dashed rgb(111 211 255 / 0.5); color: var(--ijs-t); font-size: 14px; font-weight: 700; }
  .chips { display: flex; gap: 6px; }
  .chip { height: 30px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; background: rgb(var(--wit) / 0.06); font-size: 13px; font-weight: 700; color: var(--zacht); }
  .chip.aan { background: var(--tekst); color: #0b1424; }
  .onder { position: fixed; left: 0; width: 390px; bottom: 0; padding: 12px 16px 26px; display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, transparent, rgb(var(--nacht) / 0.95) 30%); }
  .onder .terug { color: var(--zacht); font-weight: 700; }
  .onder .later { margin-left: auto; color: var(--gedempt); font-size: 13.5px; font-weight: 600; }
  .onder .knop { height: 48px; padding: 0 24px; border-radius: 16px; display: inline-flex; align-items: center; background: var(--ijs); color: #072033; font-weight: 700; font-size: 16px; }
</style>
</head>
<body class="lucht lucht-avond">
<div class="tel3">
  <div class="kop3"><span class="logo"></span><div class="waar" id="waar"></div><span class="sluit">×</span></div>
  <div class="voortgang" id="voortgang"></div>
  <div class="podium" id="podium"></div>
  <section class="vraag" id="vraag"></section>
  <div class="onder"><span class="terug">Terug</span><span class="later">Later</span><span class="knop">Volgende</span></div>
</div>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/huis.js"></script>
<script>
  const S = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IK = {
    huis: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>', oprit: '<path d="M5 21l3-18M19 21L16 3M12 6v2M12 11v2M12 16v2"/>', auto: '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/>',
    garage: '<path d="M3 9l9-5 9 5v11H3z"/><path d="M6 20v-8h12v8"/>', tuin: '<path d="M12 21v-8M8 13c0-4 4-8 4-8s4 4 4 8a4 4 0 0 1-8 0z"/>', tuinhuis: '<path d="M4 9h16M5 9v11h14V9M3 9l2-3h14l2 3"/><path d="M10 20v-5h4v5"/>',
    jacuzzi: '<path d="M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M8 8c0-1.5 1-2 1-3M12 8c0-1.5 1-2 1-3M16 8c0-1.5 1-2 1-3"/>', terras: '<path d="M3 17h18M6 17v4M18 17v4M5 13h14l-1-5H6z"/>',
  };
  const regel = (i, t1, t2, rechts = '', k = '', rk = '') => `<div class="regel ${k}"><span class="ik">${S(IK[i])}</span><div><b>${t1}</b><span>${t2}</span></div><span class="rechts ${rk}">${rechts}</span></div>`;
  const k = (naam, gewicht = 1, apparaten = []) => ({ naam, gewicht, stil: true, apparaten });
  const etages = [
    { naam: 'Begane grond', kamers: [k('Entree', 0.55), k('Keuken', 0.9), k('Woonkamer', 1.4, [{ soort: 'bank' }])] },
    { naam: 'Eerste', kamers: [k('Badkamer', 0.8), k('Hobbykamer', 0.9), k('Matts', 0.9), k('Mylan', 0.9)] },
    { dak: true, kamers: [k('Slaapkamer', 1), k('Zolder', 1)] },
  ];
  const buiten = { oprit: {}, auto: { kleur: '#7f97b0' }, garage: {}, tuin: { tuinhuis: true }, terras: {} };
  const STAPPEN = ['woning', 'kamers', 'buiten', 'bewoners', 'klimaat', 'comfort', 'afwezig', 'aansluiting', 'zon', 'opzon', 'gemak', 'scherm', 'ha', 'klaar'];
  const STANDEN = {
    kamers: {
      h: '1. Je huis', stap: 'kamers', kop: 'Klopt de indeling?', lead: 'Uit Home Assistant, per etage. Tik een kamer om hem te veranderen.',
      inhoud: `<div class="lijst"><div class="etagekop">Zolder</div>${regel('huis', 'Slaapkamer en zolder', 'met de wasruimte', 'airco, droger')}
        <div class="etagekop">Eerste verdieping</div>${regel('huis', 'Badkamer', 'badkamer', 'vloer')}${regel('huis', 'Hobbykamer', 'werkkamer', '1 lamp')}${regel('huis', 'Matts en Mylan', 'twee kinderkamers', '4 lampen')}
        <div class="etagekop">Begane grond</div>${regel('huis', 'Woonkamer', 'met de zithoek', 'airco, Nest')}${regel('huis', 'Keuken', 'keuken', 'radiatorknop')}${regel('huis', 'Entree', 'hal', 'deurbel')}</div>
        <div class="chips"><span class="erbij">+ Kamer</span><span class="erbij">+ Etage</span></div>`,
      model: { tijd: 'avond', etages: etages.map((e) => ({ ...e, kamers: e.kamers.map((x) => ({ ...x, stil: false })) })), voordeur: {} },
    },
    buiten: {
      h: '2. Buiten', stap: 'buiten', kop: 'Wat is er rond je huis?', lead: 'Aan wat Home Assistant buiten heeft, vooraf gekozen.',
      inhoud: `<div class="lijst">${regel('oprit', 'Oprit', 'met de camera', '<span class="schakel aan"></span>')}${regel('auto', 'Een auto', 'geen laadpaal gevonden', '<span class="schakel aan"></span>')}${regel('garage', 'Garage', 'achter de oprit', '<span class="schakel aan"></span>')}${regel('tuin', 'Tuin', 'met verlichting', '<span class="schakel aan"></span>')}
        <div class="regel"><span class="ik">${S(IK.tuinhuis)}</span><div><b>In de tuin</b><span>met de lamp onder het overstek</span></div><span class="chips"><span class="chip aan">Tuinhuis</span><span class="chip">Schuur</span></span></div>
        ${regel('terras', 'Terras', 'bij de woonkamer', '<span class="schakel aan"></span>')}${regel('jacuzzi', 'Jacuzzi', 'niet gevonden', '<span class="schakel"></span>')}</div>`,
      model: { tijd: 'avond', etages, voordeur: {}, ...buiten },
    },
    zon: {
      h: '5. Energie', stap: 'zon', kop: 'Waar liggen je panelen?', lead: 'Smart Climate meet zelf naar welke kant ze liggen. Jij zegt op welk dak en hoeveel.',
      inhoud: `<div class="lijst">${regel('huis', 'Huis, oostkant', 'kijkt naar 97°, helling 47°', '6', '', 'mint')}${regel('huis', 'Huis, westkant', 'kijkt naar 277°, helling 47°', '6', '', 'mint')}${regel('garage', 'Garage', 'plat dak', '+ Panelen', 'uit', 'ijs')}${regel('tuinhuis', 'Tuinhuis', 'plat dak', '+ Panelen', 'uit', 'ijs')}</div>`,
      model: { tijd: 'dag', zon: { stand: 0.6, aandeel: 0.7, panelen: 6, panelenLinks: 6 }, etages, voordeur: {}, net: true, ...buiten },
    },
  };
  const id = location.hash.slice(1) in STANDEN ? location.hash.slice(1) : 'kamers';
  const s = STANDEN[id];
  document.body.className = `lucht lucht-${s.model.tijd === 'dag' ? 'dag' : 'avond'}`;
  const nu = STAPPEN.indexOf(s.stap);
  document.getElementById('waar').innerHTML = `<b>${s.h}</b><span>Stap ${nu + 1} van ${STAPPEN.length}</span>`;
  document.getElementById('voortgang').innerHTML = STAPPEN.map((_, i) => `<i class="${i < nu ? 'klaar' : i === nu ? 'nu' : ''}"></i>`).join('');
  document.getElementById('vraag').innerHTML = `<h1>${s.kop}</h1><p class="lead">${s.lead}</p>${s.inhoud}`;
  const podium = document.getElementById('podium');
  const r = podium.getBoundingClientRect();
  huis.teken(podium, s.model, { breedte: r.width, hoogte: r.height, wereld: true, eigenLucht: false, marge: 0.03 });
</script>
</body>
</html>
