<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Wand · Assistent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  main { position: relative; padding: 22px 26px 20px 22px; }
  .gesprek { position: absolute; left: 22px; top: 40px; width: 560px; display: flex; flex-direction: column; gap: 22px; }
  .jij { align-self: flex-start; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 20px 20px 20px 6px; background: rgba(255,255,255,0.08); font-size: 18px; font-weight: 600; }
  .golf { display: flex; gap: 3px; align-items: center; height: 20px; }
  .golf i { width: 3px; border-radius: 2px; background: var(--ijs); display: block; }
  .antwoord { font-family: var(--kop); font-size: 40px; font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; margin: 0; }
  .uitleg { font-size: 18px; line-height: 1.5; color: var(--zacht); margin: 0; max-width: 46ch; }
  .grafiek { padding: 18px 20px; }
  .knoppen { display: flex; gap: 10px; }
  .podium { position: absolute; right: 0; top: 60px; width: 640px; height: 560px; }
  .dok { position: absolute; left: 22px; right: 26px; bottom: 20px; height: 68px; border-radius: 22px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: rgba(9, 15, 28, 0.6); border: 1px solid rgba(111,211,255,0.35); backdrop-filter: blur(12px); }
  .dok .vraag { flex: 1; color: var(--zacht); font-size: 16px; }
</style>
</head>
<body>
<div class="wand lucht lucht-dag">
  <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
  <main>
    <div class="gesprek">
      <div class="jij"><span class="golf" aria-hidden="true"><i style="height: 8px"></i><i style="height: 16px"></i><i style="height: 11px"></i><i style="height: 19px"></i><i style="height: 9px"></i></span>Wanneer is de auto vol?</div>
      <div style="display: flex; gap: 16px; align-items: start">
        <span class="bol adem" style="width: 44px; height: 44px; margin-top: 4px"></span>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <p class="antwoord">Om 16:30, als de zon blijft.</p>
          <p class="uitleg">Hij laadt nu met 1,4 kW van je panelen. Rond 15:00 komen er wolken; dan gaat het langzamer, maar hij haalt het. De airco van de woonkamer gaat voor.</p>
          <section class="glas grafiek">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="kop-3">De auto, van nu tot vol</h2><span class="mini">verwacht</span></div>
            <svg viewBox="0 0 470 120" width="470" height="120" aria-label="De lading van de auto loopt van 62% nu naar 100% om 16:30">
              <defs><linearGradient id="av" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7B7" stop-opacity="0.35"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/></linearGradient></defs>
              <line x1="20" y1="20" x2="450" y2="20" stroke="#fff" stroke-opacity="0.08" stroke-dasharray="3 4"/>
              <text x="450" y="14" text-anchor="end" font-family="Figtree" font-size="11" fill="#7F8E9C">100%</text>
              <path d="M20 66 C 120 56, 200 42, 260 36 S 360 26, 430 20 L 430 100 L 20 100 Z" fill="url(#av)"/>
              <path d="M20 66 C 120 56, 200 42, 260 36 S 360 26, 430 20" fill="none" stroke="#6EE7B7" stroke-width="2.5" stroke-dasharray="6 5"/>
              <circle cx="20" cy="66" r="6" fill="#0b1424" stroke="#6EE7B7" stroke-width="2.5"/><text x="30" y="84" font-family="Figtree" font-size="12" fill="#B8C4CF">62% nu</text>
              <g transform="translate(238 52)"><ellipse rx="16" ry="6" fill="#9aabc0" opacity="0.5"/><ellipse cx="6" cy="-3" rx="8" ry="5" fill="#a7b7ca" opacity="0.5"/></g>
              <circle cx="430" cy="20" r="6" fill="#6EE7B7"/><text x="430" y="44" text-anchor="end" font-family="Figtree" font-size="12" font-weight="700" fill="#EEF3F7">16:30</text>
              <g font-family="Figtree" font-size="11" fill="#7F8E9C"><text x="20" y="116">12:41</text><text x="140" y="116">14:00</text><text x="260" y="116">15:00</text><text x="380" y="116">16:00</text></g>
            </svg>
          </section>
          <div class="knoppen"><button class="knop knop-licht">Zo is het goed</button><button class="knop">Eerder vol, ook van het net</button></div>
        </div>
      </div>
    </div>
    <div class="podium" id="podium"></div>
    <div class="dok">
      <span class="bol" style="width: 46px; height: 46px"></span>
      <span class="vraag">Ik luister…</span>
      <span class="pil">Waarom wacht de zolder?</span>
      <span class="pil">Hoeveel zon morgen?</span>
    </div>
  </main>
</div>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="../../frontend/kit/huis.js"></script>
<script>
  nav.balk(document.getElementById('balk'), 'assistent');
  huis.teken(document.getElementById('podium'), {
    beschrijving: 'Het huis, met de auto aan de laadpaal uitgelicht.',
    tijd: 'dag',
    zon: { stand: 0.56, hoogte: 0.9, aandeel: 0.85, panelen: 12 },
    wolken: 0.2,
    etages: [
      { kamers: [{ naam: 'Bijkeuken', gewicht: 0.85, stil: true, stand: 'wacht', apparaten: [{ soort: 'droger', aan: true, x: 0.55 }] }, { naam: 'Woonkamer', gewicht: 1.35, stil: true, stand: 'koelt', apparaten: [{ soort: 'airco', aan: true }, { soort: 'bank' }] }] },
      { kamers: [{ naam: 'Badkamer', gewicht: 0.8, stil: true, stand: 'goed' }, { naam: 'Slaapkamer', gewicht: 1.3, stil: true }] },
      { dak: true, kamers: [{ naam: 'Zolder', stil: true, stand: 'wacht' }] },
    ],
    buitenunit: { aan: true },
    batterij: { procent: 78, stand: 'laadt' },
    auto: { procent: 62, stand: 'laadt', bron: 'zon', kleur: '#7f97b0' },
    net: true,
    stromen: [{ van: 'zon', naar: 'auto', sterkte: 0.6 }, { van: 'zon', naar: 'kamer:Woonkamer', sterkte: 0.5 }],
    labels: [{ bij: 'auto', titel: '62%', groot: true, toon: 'mint', regels: ['laadt 1,4 kW'], dx: -20, dy: -110 }],
  }, { breedte: 640, hoogte: 560, schuifX: -16, marge: 0.06 });
</script>
</body>
</html>
