<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Wand · Inrichten 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * Inrichten 3.0 (schets, 24 oktober 2026, makeover voor het grote publiek).
   * Het huis bouwt zich op terwijl je inricht: links het eiland dat bij elk
   * hoofdstuk iets krijgt (de vorm, de kamers, buiten, de apparaten, de
   * energie, het licht), rechts één vraag. Bovenin het pad: acht hoofdstukken,
   * met per hoofdstuk zijn stappen als streepjes. Wat Home Assistant al weet,
   * staat klaar; de bewoner kijkt of het klopt. Alles wat de app nu kan, komt
   * voorbij: het woningtype, de kelder, buiten met tuinhuis of schuurtje en de
   * jacuzzi, de bewoners met hun telefoon, wat elk klimaatapparaat kan (de
   * schets Wand-Inrichten-Klimaat), panelen op elk dak, de boiler en de
   * jacuzzi op zon, de assistent met "Hé huis", en de wand met zijn kaarten.
   * Standen: #welkom (zonder hash), #woning, #kamers, #buiten, #bewoners,
   * #klimaat, #comfort, #afwezig, #zon, #opzon, #gemak, #scherm, #ha, #klaar,
   * en #zonderklimaat (de route zonder slimme regeling).
   * Gekozen (Ricardo, 24 oktober 2026): het huis groeit mee; deze volgorde;
   * op de telefoon dezelfde stappen (Tel-Inrichten-3); erbij: afwezig en
   * vakantie, een huis zonder slimme regeling, en klaarzetten in Home Assistant.
   */
  .scherm { position: relative; width: 1280px; height: 800px; overflow: hidden; }
  .boven { position: absolute; left: 28px; right: 28px; top: 20px; display: flex; align-items: center; gap: 16px; }
  .logo { width: 34px; height: 34px; border-radius: 11px; background: url('../../frontend/kit/icoon-klein.svg') center / cover; flex: none; }
  .pad { flex: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .h { padding: 7px 10px 8px; border-radius: 14px; background: rgb(var(--wit) / 0.04); border: 1px solid transparent; min-width: 0; }
  .h b { display: block; font-size: 12.5px; font-weight: 700; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h .streep { display: flex; gap: 3px; margin-top: 6px; }
  .h .streep i { flex: 1; height: 3px; border-radius: 2px; background: rgb(var(--wit) / 0.12); }
  .h.klaar b { color: var(--zacht); }
  .h.klaar .streep i, .h .streep i.klaar { background: var(--mint); }
  .h.nu { background: rgb(var(--wit) / 0.09); border-color: rgb(var(--wit) / 0.16); }
  .h.nu b { color: var(--tekst); }
  .h .streep i.nu { background: var(--tekst); }

  .podium { position: absolute; left: 0; top: 78px; width: 790px; height: 706px; }
  .vraag { position: absolute; right: 28px; top: 84px; bottom: 26px; width: 452px; padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 12px; }
  .vraag .waar { font-size: 12.5px; font-weight: 700; color: var(--gedempt); }
  .vraag h1 { margin: 0; font-family: var(--kop); font-size: 30px; font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; }
  .vraag .lead { margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--zacht); max-width: none; }
  .vraag .inhoud { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .voet { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .voet .terug { color: var(--zacht); font-weight: 700; font-size: 14px; }
  .voet .later { margin-left: auto; color: var(--gedempt); font-size: 13px; font-weight: 600; }
  .knop { height: 44px; padding: 0 20px; border-radius: 14px; display: inline-flex; align-items: center; font-weight: 700; font-size: 15px; background: rgb(var(--wit) / 0.08); }
  .knop.licht { background: var(--ijs); color: #072033; }
  .voet .knop.licht { margin-left: 8px; }

  /* Bouwstenen voor de vragen. */
  .tellen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .teller { padding: 10px 12px; border-radius: 14px; background: rgb(var(--wit) / 0.05); }
  .teller b { display: block; font-family: var(--kop); font-size: 26px; font-weight: 600; line-height: 1; }
  .teller span { font-size: 12px; color: var(--zacht); }
  .tegels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tegel { position: relative; height: 112px; border-radius: 16px; background: rgb(var(--wit) / 0.05); border: 1.5px solid transparent; overflow: hidden; }
  .tegel.aan { border-color: var(--ijs); background: rgba(111, 211, 255, 0.1); }
  .tegel .mini { position: absolute; inset: 0 0 22px 0; }
  .tegel b { position: absolute; left: 10px; right: 8px; bottom: 7px; font-size: 12.5px; }
  .rij { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rij > small { font-size: 12.5px; font-weight: 700; color: var(--zacht); width: 100%; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 999px; background: rgb(var(--wit) / 0.06); font-size: 13.5px; font-weight: 700; color: var(--zacht); }
  .chip.aan { background: var(--tekst); color: #0b1424; }
  .chip svg { width: 16px; height: 16px; }
  .lijst { display: flex; flex-direction: column; gap: 5px; }
  .regel { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 7px 10px; border-radius: 13px; background: rgb(var(--wit) / 0.045); }
  .regel .ik { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); color: var(--zacht); }
  .regel .ik svg { width: 18px; height: 18px; }
  .regel b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .regel span { display: block; font-size: 12px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .regel span.rij { display: flex; gap: 4px; }
  .regel span.chip { display: inline-flex; }
  .regel .rechts { font-size: 12.5px; font-weight: 700; color: var(--zacht); white-space: nowrap; }
  .regel .rechts.mint { color: var(--mint-t); }
  .regel .rechts.ijs { color: var(--ijs-t); }
  .regel .rechts.zon { color: var(--zon); }
  .regel.uit { background: transparent; border: 1px dashed rgb(var(--wit) / 0.14); }
  .regel.uit b { color: var(--zacht); }
  .schakel { width: 40px; height: 24px; border-radius: 12px; background: rgb(var(--wit) / 0.14); position: relative; }
  .schakel::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #c8d2dc; }
  .schakel.aan { background: var(--mint); }
  .schakel.aan::after { left: 19px; background: #0b2a1f; }
  .etagekop { font-size: 12px; font-weight: 700; color: var(--gedempt); margin: 4px 2px 0; }
  .erbij { display: inline-flex; align-items: center; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px dashed rgb(111 211 255 / 0.5); color: var(--ijs-t); font-size: 13.5px; font-weight: 700; }
  .tip { padding: 10px 12px; border-radius: 14px; background: rgba(111, 211, 255, 0.08); color: var(--ijs-zacht); font-size: 12.5px; line-height: 1.4; }
  .gezicht { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--kop); font-weight: 700; color: #0b1424; }
  .bewoner { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 10px 12px; border-radius: 15px; background: rgb(var(--wit) / 0.05); }
  .bewoner b { font-size: 15px; display: block; }
  .bewoner span { font-size: 12px; color: var(--gedempt); }
  .kleuren { display: flex; gap: 6px; }
  .kleuren i { width: 18px; height: 18px; border-radius: 50%; }
  .kleuren i.aan { box-shadow: 0 0 0 2px #0b1424, 0 0 0 4px var(--tekst); }
  .wandje { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; padding: 10px; border-radius: 16px; background: rgb(var(--wit) / 0.04); border: 1px solid rgb(var(--wit) / 0.08); height: 172px; }
  .wandje .huisvak { border-radius: 10px; background: linear-gradient(160deg, rgb(111 211 255 / 0.12), rgb(255 255 255 / 0.03)); position: relative; overflow: hidden; }
  .wandje .kaartjes { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 36px; gap: 5px; }
  .wandje .kaartjes i { border-radius: 8px; background: rgb(var(--wit) / 0.08); }
  .wandje .kaartjes i.breed { grid-column: span 2; }
  .stand { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .stand::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .stand.werkt { color: var(--mint-t); background: rgba(110, 231, 183, 0.1); }
  .stand.kijkt { color: var(--ijs-t); background: rgba(111, 211, 255, 0.1); }
  .stand.nodig { color: var(--zon); box-shadow: inset 0 0 0 1px rgba(247, 181, 72, 0.45); }
  .dagdelen { display: grid; grid-template-columns: 84px repeat(4, minmax(0, 1fr)); gap: 5px; align-items: center; font-size: 12px; }
  .dagdelen > small { font-weight: 700; color: var(--gedempt); text-align: center; }
  .dagdelen > b { font-size: 13px; }
  .dagdelen > span { height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--kop); font-size: 15px; font-weight: 600; background: rgb(var(--wit) / 0.06); }
  .dagdelen > span.warm { background: rgba(255, 122, 77, 0.16); color: #ffb090; }
  .dagdelen > span.koel { background: rgba(111, 211, 255, 0.14); color: var(--ijs-t); }
  .klaarregel { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 6px 4px; border-top: 1px solid rgb(var(--wit) / 0.06); }
  .klaarregel:first-child { border-top: 0; }
  .klaarregel i { width: 8px; height: 8px; border-radius: 50%; }
  .klaarregel b { font-size: 13.5px; display: block; }
  .klaarregel span { font-size: 12px; color: var(--gedempt); display: block; }
  .klaarregel em { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--ijs-t); }
  .groot { font-family: var(--kop); font-size: 46px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
  [data-stand] { display: none; }
</style>
</head>
<body class="lucht lucht-avond">
<div class="scherm">
  <div class="boven">
    <span class="logo"></span>
    <div class="pad" id="pad"></div>
  </div>
  <div class="podium" id="podium"></div>
  <section class="glas vraag" id="vraag"></section>
</div>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/huis.js"></script>
<script>
  const S = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IK = {
    huis: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>', oprit: '<path d="M5 21l3-18M19 21L16 3M12 6v2M12 11v2M12 16v2"/>',
    auto: '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/>', laadpaal: '<rect x="6" y="3" width="9" height="18" rx="2"/><path d="M15 8h2a2 2 0 0 1 2 2v5"/><path d="M11 8l-2 4h3l-2 4"/>',
    carport: '<path d="M3 8h18M5 8v12M19 8v12"/>', garage: '<path d="M3 9l9-5 9 5v11H3z"/><path d="M6 20v-8h12v8"/>', tuin: '<path d="M12 21v-8M8 13c0-4 4-8 4-8s4 4 4 8a4 4 0 0 1-8 0z"/>',
    tuinhuis: '<path d="M4 9h16M5 9v11h14V9M3 9l2-3h14l2 3"/><path d="M10 20v-5h4v5"/>', schuur: '<path d="M4 11l8-6 8 6v9H4z"/><path d="M10 20v-5h4v5"/>',
    terras: '<path d="M3 17h18M6 17v4M18 17v4M5 13h14l-1-5H6z"/>', jacuzzi: '<path d="M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M8 8c0-1.5 1-2 1-3M12 8c0-1.5 1-2 1-3M16 8c0-1.5 1-2 1-3"/>',
    balkon: '<path d="M4 12h16v8H4zM8 12v8M12 12v8M16 12v8M6 4h12v8"/>', airco: '<rect x="3" y="6" width="18" height="8" rx="2"/><path d="M7 18c0-1.5 1-2 1-3M12 19c0-1.5 1-2 1-3"/>',
    thermo: '<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>', knop: '<circle cx="12" cy="12" r="7"/><path d="M12 5v3"/>', droger: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="4"/>',
    vaat: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 8h14M9 13h6"/>', boiler: '<rect x="7" y="2.5" width="10" height="19" rx="5"/><path d="M10 15h4"/>', accu: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M10 2h4M12 9l-2 4h4l-2 4"/>',
    lamp: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/>', screen: '<rect x="4" y="4" width="16" height="4" rx="1"/><path d="M6 8v9h12V8"/>', camera: '<rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3"/>',
    praat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5A8 8 0 1 1 21 12z"/>', zon: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>', stekker: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
    meter: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/>', bel: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>', tel: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/>',
  };
  const ik = (n) => S(IK[n]);
  const regel = (i, titel, zin, rechts = '', klasse = '', rk = '') => `<div class="regel ${klasse}"><span class="ik">${ik(i)}</span><div><b>${titel}</b><span>${zin}</span></div><span class="rechts ${rk}">${rechts}</span></div>`;

  /* ---- het pad: acht hoofdstukken, elk met zijn stappen ---- */
  const HOOFDSTUKKEN = [
    ['Je huis', ['woning', 'kamers']],
    ['Buiten', ['buiten']],
    ['Wie woont hier', ['bewoners']],
    ['Klimaat', ['klimaat', 'comfort', 'afwezig']],
    ['Energie', ['aansluiting', 'zon', 'opzon']],
    ['Gemak', ['gemak']],
    ['Je schermen', ['scherm']],
    ['Klaar', ['ha', 'klaar']],
  ];
  const ALLE = HOOFDSTUKKEN.flatMap(([, s]) => s);

  /* ---- het huis van dit huis, zoals Home Assistant het kent ---- */
  const k = (naam, gewicht = 1, apparaten = []) => ({ naam, gewicht, stil: true, apparaten });
  const etagesKaal = [
    { naam: 'Begane grond', kamers: [k('Entree', 0.55), k('Keuken', 0.9), k('Woonkamer', 1.4, [{ soort: 'bank' }])] },
    { naam: 'Eerste', kamers: [k('Badkamer', 0.8), k('Hobbykamer', 0.9), k('Slaapkamer Matts', 0.9), k('Slaapkamer Mylan', 0.9)] },
    { dak: true, kamers: [k('Slaapkamer', 1), k('Zolder', 1)] },
  ];
  const etagesApparaten = [
    { naam: 'Begane grond', kamers: [k('Entree', 0.55), k('Keuken', 0.9, [{ soort: 'radiator', aan: true }]), k('Woonkamer', 1.4, [{ soort: 'airco', aan: false }, { soort: 'radiator' }, { soort: 'bank' }, { soort: 'screen', dicht: 0.3 }])] },
    { naam: 'Eerste', kamers: [k('Badkamer', 0.8, [{ soort: 'vloer', aan: true }]), k('Hobbykamer', 0.9), k('Slaapkamer Matts', 0.9), k('Slaapkamer Mylan', 0.9)] },
    { dak: true, kamers: [k('Slaapkamer', 1), k('Zolder', 1, [{ soort: 'airco', aan: false }, { soort: 'droger', aan: false }])] },
  ];
  const lampen = (e) => e.map((et) => ({ ...et, kamers: et.kamers.map((x, i) => ({ ...x, apparaten: [...x.apparaten, ...(i % 2 === 0 ? [{ soort: 'lamp', aan: true }] : [])] })) }));
  const buiten = { oprit: {}, auto: { kleur: '#7f97b0', procent: 60, stand: 'rust' }, garage: {}, tuin: { tuinhuis: true, tuinhuisSoort: 'tuinhuis', lampen: [{ aan: false }] }, terras: {} };

  const STANDEN = {
    welkom: {
      waar: 'Welkom', kop: 'Laten we je huis neerzetten', lead: 'SunArc vond je Home Assistant. Wat het daar al weet, staat klaar; jij kijkt of het klopt. Zo’n tien minuten.',
      inhoud: `<div class="tellen">${[['3', 'etages'], ['10', 'kamers'], ['32', 'apparaten'], ['5', 'om te verwarmen of koelen'], ['12', 'panelen'], ['2', 'camera’s']].map(([g, w]) => `<div class="teller"><b>${g}</b><span>${w}</span></div>`).join('')}</div>
        <div class="tip">Het huis links groeit mee: bij elk hoofdstuk komt er iets bij. Wat je overslaat, staat aan het eind bij Nog te doen.</div>`,
      knop: 'Begin', terugTekst: '',
      model: { tijd: 'avond', etages: etagesKaal, voordeur: {}, spook: ['panelen'] },
    },
    woning: {
      waar: '1. Je huis · Wat voor huis', kop: 'Wat voor huis is het?', lead: 'Dan tekent de app het zoals het er staat.',
      inhoud: `<div class="tegels">${[['vrijstaand', 'Vrijstaand', true], ['rij', 'Rijtjeshuis'], ['hoek', 'Hoekhuis'], ['tweekap', 'Twee-onder-een-kap'], ['appartement', 'Appartement'], ['plat', 'Plat dak']].map(([id, n, aan]) => `<div class="tegel${aan ? ' aan' : ''}"><div class="mini" data-mini="${id}"></div><b>${n}</b></div>`).join('')}</div>
        <div class="rij"><small>Een kelder?</small><span class="chip">Ja, opengewerkt</span><span class="chip aan">Nee</span></div>
        <div class="rij"><small>Onder het dak</small><span class="chip aan">Kamers</span><span class="chip">Alleen opslag</span><span class="chip">Geen zolder</span></div>`,
      model: { tijd: 'avond', etages: etagesKaal, voordeur: {} },
    },
    kamers: {
      waar: '1. Je huis · Kamers', kop: 'Klopt de indeling?', lead: 'Uit Home Assistant, per etage. Tik een kamer om de naam of soort te veranderen, of sleep hem.',
      inhoud: `<div class="lijst">
        <div class="etagekop">Zolder</div>${regel('huis', 'Slaapkamer en zolder', 'met de wasruimte', 'airco, droger')}
        <div class="etagekop">Eerste verdieping</div>${regel('huis', 'Badkamer', 'badkamer', 'vloer, thermostaat')}${regel('huis', 'Hobbykamer en twee kinderkamers', 'Matts en Mylan', '5 lampen')}
        <div class="etagekop">Begane grond</div>${regel('huis', 'Woonkamer', 'met de zithoek', 'airco, Nest, 3 screens')}${regel('huis', 'Keuken', 'keuken', 'radiatorknop')}${regel('huis', 'Entree', 'hal', 'deurbel')}
        </div><div class="rij"><span class="erbij">+ Kamer</span><span class="erbij">+ Etage</span></div>`,
      // Bij de kamers staan de namen in het huis.
      model: { tijd: 'avond', etages: etagesKaal.map((e) => ({ ...e, kamers: e.kamers.map((x) => ({ ...x, stil: false })) })), voordeur: {}, labels: [] },
    },
    buiten: {
      waar: '2. Buiten', kop: 'Wat is er rond je huis?', lead: 'Aan wat Home Assistant buiten heeft, vooraf gekozen.',
      inhoud: `<div class="lijst">
        ${regel('oprit', 'Oprit', 'met de camera', '<span class="schakel aan"></span>')}
        ${regel('auto', 'Een auto', 'geen laadpaal gevonden', '<span class="schakel aan"></span>')}
        ${regel('garage', 'Garage', 'achter de oprit', '<span class="schakel aan"></span>')}
        ${regel('carport', 'Carport', '', '<span class="schakel"></span>')}
        ${regel('tuin', 'Tuin', 'met verlichting en de border', '<span class="schakel aan"></span>')}
        <div class="regel"><span class="ik">${ik('tuinhuis')}</span><div><b>In de tuin</b><span>met de lamp onder het overstek</span></div><span class="rij" style="flex-wrap: nowrap"><span class="chip aan" style="height: 30px">Tuinhuis</span><span class="chip" style="height: 30px">Schuurtje</span></span></div>
        ${regel('terras', 'Terras', 'bij de woonkamer', '<span class="schakel aan"></span>')}
        ${regel('jacuzzi', 'Jacuzzi', 'niet gevonden in Home Assistant', '<span class="schakel"></span>')}
        </div>`,
      model: { tijd: 'avond', etages: etagesKaal, voordeur: {}, ...buiten, labels: [] },
    },
    bewoners: {
