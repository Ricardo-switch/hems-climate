<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · Inrichten, de panelen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /* Het voorstel van Wand-Inrichten-Panelen op de telefoon (schets, 17 oktober 2026). */
  .boven { padding: 18px 18px 0; display: flex; justify-content: space-between; align-items: center; }
  .stappen { display: flex; gap: 6px; }
  .stappen i { width: 26px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.14); }
  .stappen i.klaar { background: var(--mint); }
  .podium { height: 250px; }
  .inhoud { padding: 0 16px 40px; display: flex; flex-direction: column; gap: 12px; }
  .vraag { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .regel { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 15px; }
  .regel:first-of-type { border-top: 0; }
  .regel span:first-child { color: var(--zacht); }
  .regel b { text-align: right; font-weight: 600; }
  .regel b small { display: block; color: var(--gedempt); font-weight: 500; font-size: 12.5px; }
  .ok { color: var(--mint); }
  .keuzes { display: flex; flex-wrap: wrap; gap: 6px; }
  .keuzes button { height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--glas-rand); background: rgba(255,255,255,0.05); font-weight: 700; font-size: 14px; color: var(--zacht); }
  .keuzes button[aria-pressed='true'] { background: var(--tekst); color: #0b1424; border-color: transparent; }
  .knoppen { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .knoppen button { height: 52px; border-radius: 16px; border: 0; font-weight: 700; font-size: 16px; }
  .zacht { background: rgba(255,255,255,0.08); color: var(--tekst); }
  .licht { background: var(--tekst); color: #0b1424; }
</style>
</head>
<body>
<div class="tel lucht lucht-dag">
  <div class="boven">
    <span class="klein" style="font-weight: 600">‹ Terug</span>
    <span class="stappen" aria-label="Stap 5 van 5"><i class="klaar"></i><i class="klaar"></i><i class="klaar"></i><i class="klaar"></i><i></i></span>
  </div>
  <div class="podium" id="podium"></div>
  <div class="inhoud">
    <h1 class="kop-1" style="font-size: 30px">Zo liggen je panelen</h1>
    <p class="klein" style="margin: -4px 0 4px">Gevonden in wat ze de afgelopen tien dagen leverden. Klopt het?</p>
    <section class="glas vraag">
      <svg id="lijn" viewBox="0 0 326 92" width="100%" role="img" aria-label="De opbrengst op 12 oktober, met de lijn die bij deze ligging hoort"></svg>
      <div>
        <div class="regel"><span>Richting</span><b>Oost en west<small>6 panelen op elke kant</small></b></div>
        <div class="regel"><span>Helling</span><b>Rond 50°</b></div>
        <div class="regel"><span>Vermogen</span><b>Zo'n 4,9 kWp<small>ongeveer 410 Wp per paneel</small></b></div>
        <div class="regel"><span>Omvormer</span><b class="ok">✓ 3.000 W</b></div>
      </div>
    </section>
    <section class="glas vraag">
      <h2 class="kop-3">Wanneer schijnt de zon op de voorkant?</h2>
      <div class="keuzes"><button aria-pressed="true">'s Ochtends</button><button>'s Avonds</button><button>Weet ik niet</button></div>
    </section>
    <div class="knoppen"><button class="zacht">Aanpassen</button><button class="licht">Klopt</button></div>
  </div>
</div>
<script src="../../frontend/kit/huis.js"></script>
<script>
  const DAG = [[8,27,172],[8.25,186,250],[8.5,683,499],[8.75,884,710],[9,1022,883],[9.25,1122,1024],[9.5,1207,1137],[9.75,1255,1228],[10,1272,1298],[10.25,1326,1349],[10.5,1340,1383],[10.75,1341,1401],[11,1328,1405],[11.25,1308,1394],[11.5,1275,1371],[11.75,1248,1335],[12,1245,1308],[12.25,1256,1352],[12.5,1287,1387],[12.75,1326,1412],[13,1341,1427],[13.25,1410,1432],[13.5,1419,1427],[13.75,1395,1412],[14,1360,1387],[14.25,1314,1353],[14.5,1276,1309],[14.75,1247,1256],[15,1228,1194],[15.25,1205,1210],[15.5,1262,1231],[15.75,1265,1240],[16,1244,1234],[16.25,1237,1213],[16.5,1167,1176],[16.75,610,1121],[17,209,1047],[17.25,175,949],[17.5,158,824],[17.75,125,668],[18,92,474],[18.25,42,240],[18.5,6,165]];
  const X = (h) => 6 + ((h - 7.5) / 11.5) * 314, Y = (w) => 72 - (w / 1500) * 62;
  const pad = (k) => DAG.map((r, i) => `${i ? 'L' : 'M'} ${X(r[0] + 0.125).toFixed(1)} ${Y(r[k]).toFixed(1)}`).join(' ');
  document.getElementById('lijn').innerHTML = `
    <text x="6" y="10" fill="var(--zacht)" font-size="12" font-weight="600">Een heldere dag, 12 oktober</text>
    <path d="${pad(1)} L ${X(18.625)} 72 L ${X(8.125)} 72 Z" fill="rgba(247,181,72,0.16)"/>
    <path d="${pad(1)}" fill="none" stroke="var(--zon)" stroke-width="2"/>
    <path d="${pad(2)}" fill="none" stroke="var(--tekst)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7"/>
    <line x1="6" x2="320" y1="72" y2="72" stroke="rgba(255,255,255,0.12)"/>
    ${[9, 12, 15, 18].map((h) => `<text x="${X(h)}" y="88" text-anchor="middle" fill="var(--gedempt)" font-size="11">${h}:00</text>`).join('')}`;
  huis.teken(document.getElementById('podium'), {
    beschrijving: 'Je huis met de panelen op beide kanten van het dak.',
    tijd: 'dag',
    zon: { stand: 0.35, hoogte: 0.8, aandeel: 0.6, panelen: 12, panelenLinks: 6 },
    etages: [
      { kamers: [{ naam: 'Hal', stil: true, gewicht: 0.7 }, { naam: 'Woonkamer', stil: true, gewicht: 1.4, apparaten: [{ soort: 'airco' }, { soort: 'bank' }] }] },
      { kamers: [{ naam: 'Badkamer', stil: true, gewicht: 0.8 }, { naam: 'Slaapkamer', stil: true, gewicht: 1.3 }] },
      { dak: true, kamers: [{ naam: 'Zolder', stil: true, apparaten: [{ soort: 'airco' }] }] },
    ],
    buitenunit: { aan: false },
    net: true,
    labels: [{ bij: 'panelen', titel: 'Oost en west', toon: 'zon', regels: ["50° · zo'n 4,9 kWp"], dx: -40, dy: -40 }],
  }, { breedte: 390, hoogte: 250, marge: 0.03 });
</script>
</body>
</html>
