<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Tablet aan de muur</title>
<style>
body{margin:0}
.wall{position:relative;width:1600px;height:1000px;overflow:hidden;
  background:
    radial-gradient(900px 700px at 22% 8%, rgba(255,244,222,0.85), transparent 70%),
    radial-gradient(1200px 800px at 80% 110%, rgba(120,104,84,0.35), transparent 70%),
    linear-gradient(180deg,#E7E1D7,#D9D1C4)}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:multiply;
  background-image:repeating-radial-gradient(circle at 13% 27%, rgba(0,0,0,.05) 0 1px, transparent 1px 3px)}
.tablet{position:absolute;left:180px;top:120px;width:1152px;height:720px;padding:20px;border-radius:40px;
  background:linear-gradient(145deg,#2A2E33,#0E1013 40%,#090A0C);
  box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 50px 90px rgba(40,30,20,.38),0 18px 30px rgba(40,30,20,.28),0 0 0 1px rgba(0,0,0,.4)}
.tablet img{display:block;width:1152px;height:720px;border-radius:22px}
.glare{position:absolute;left:200px;top:140px;width:1152px;height:720px;border-radius:22px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%)}
.switch{position:absolute;left:1420px;top:470px;width:86px;height:86px;border-radius:10px;
  background:linear-gradient(160deg,#FBFAF7,#E9E6E0);box-shadow:0 6px 14px rgba(60,45,30,.22),0 0 0 1px rgba(0,0,0,.06)}
.switch::after{content:"";position:absolute;inset:18px;border-radius:6px;background:linear-gradient(180deg,#FFFFFF,#ECE9E3);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.floor{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,#B79B7A,#9C8062);box-shadow:0 -1px 0 rgba(255,255,255,.3) inset}
.plint{position:absolute;left:0;right:0;bottom:46px;height:16px;background:#F3F0EA;box-shadow:0 -1px 2px rgba(0,0,0,.08)}
.glow{position:absolute;left:120px;top:60px;width:1270px;height:840px;border-radius:80px;
  background:radial-gradient(closest-side,rgba(92,200,255,.18),rgba(122,108,255,.08) 60%,transparent);filter:blur(30px)}
</style>
</head>
<body>
<div class="wall">
<div class="grain"></div>
<div class="glow"></div>
<div class="tablet"><img src="screens/Wand-Thuis.png" alt="Smart Climate op een tablet aan de muur"></div>
<div class="glare"></div>
<div class="switch"></div>
<div class="plint"></div>
<div class="floor"></div>
</div>
</body>
</html>
