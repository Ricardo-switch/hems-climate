# Welke basisafbeelding per architectuur.
#
# De Supervisor vult hiermee `BUILD_FROM` in de Dockerfile wanneer hij zelf
# bouwt (een lokale add-on uit stage.ps1); de workflow op GitHub leest hem ook.
# Gelijk aan `arch` in config.yaml.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:latest
  amd64: ghcr.io/home-assistant/amd64-base:latest
