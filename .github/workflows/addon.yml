# De images van de add-on (besluit 153, 236).
#
# Home Assistant ziet een update zodra `version` in addon/config.yaml op `main`
# omhooggaat, en haalt dan het image met dat nummer op. Dit bouwt die images,
# zodat de Pi zelf niets hoeft te bouwen.
#
# Sinds besluit 236 met de bouwstappen van Home Assistant zelf
# (home-assistant/builder): per soort een image op een eigen machine van die
# soort, ondertekend met Cosign, en daarna één naam voor beide soorten
# (ghcr.io/ricardo-switch/hems-climate). De losse namen per soort
# ({arch}-hems-climate) blijven bestaan; config.yaml wijst er nog naar.
#
# - Op een pull request naar main: bouwen, niet versturen. Zo blijkt vóór het
#   samenvoegen dat het image er komt.
# - Na het samenvoegen op main: bouwen en versturen, maar alleen een versie die
#   er nog niet is. Een versienummer wijst altijd naar dezelfde code; wie code
#   naar de bewoners wil, verhoogt het nummer (een test houdt het gelijk aan de
#   app).
#
# Tussen het samenvoegen en een klaar image zitten een paar minuten. Ziet Home
# Assistant de update eerder, dan mislukt het bijwerken even; later lukt het.

name: add-on

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Kleine letters: een naam op ghcr.io mag geen hoofdletters hebben.
  REGISTRY: ghcr.io/ricardo-switch
  NAAM: hems-climate

jobs:
  klaarzetten:
    name: klaarzetten
    runs-on: ubuntu-latest
    outputs:
      versie: ${{ steps.versie.outputs.versie }}
      soorten: ${{ steps.versie.outputs.soorten }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # De versie en de soorten uit config.yaml, zodat er één plek is die ze noemt.
      - name: versie en soorten
        id: versie
        run: |
          versie=$(sed -n 's/^version: //p' addon/config.yaml)
          test -n "$versie"
          soorten=$(awk '/^arch:/{a=1;next} a&&/^  - /{print $2;next} a{exit}' addon/config.yaml | jq -Rnc '[inputs]')
          test "$soorten" != "[]"
          echo "versie=$versie" >> "$GITHUB_OUTPUT"
          echo "soorten=$soorten" >> "$GITHUB_OUTPUT"
          echo "Versie $versie voor $soorten"

      - name: per soort een machine
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.versie.outputs.soorten }}
          image-name: ${{ env.NAAM }}
          registry-prefix: ${{ env.REGISTRY }}

      # Dezelfde platte vorm als een lokale add-on, met hetzelfde script. Dat
      # staat alleen hier, omdat PowerShell op de arm-machine niet zeker is.
      - name: platslaan met stage.ps1
        shell: pwsh
        run: ./addon/stage.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: dist-addon
          path: dist-addon/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  bouwen:
    name: image ${{ matrix.arch }}
    needs: klaarzetten
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Cosign ondertekent zonder sleutel, met de identiteit van deze workflow.
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.klaarzetten.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-addon
          path: dist-addon

      - name: welke code, en wanneer
        id: tijd
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "nu=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: bouwen, en na het samenvoegen versturen en ondertekenen
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: dist-addon
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.klaarzetten.outputs.versie }}
            latest
          version: ${{ needs.klaarzetten.outputs.versie }}
          push: ${{ github.event_name != 'pull_request' }}
          # Een versie die er al is, wordt niet overschreven.
          skip-existing: ${{ needs.klaarzetten.outputs.versie }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            HEMS_COMMIT=${{ steps.tijd.outputs.commit }}
            HEMS_GEBOUWD=${{ steps.tijd.outputs.nu }}
          labels: |
            io.hass.type=addon
            io.hass.name=SunArc
            io.hass.url=https://github.com/Ricardo-switch/SunARC-HA-APP

  een-naam:
    name: één naam voor beide soorten
    needs: [klaarzetten, bouwen]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.klaarzetten.outputs.soorten }}
          image-name: ${{ env.NAAM }}
          registry-prefix: ${{ env.REGISTRY }}
          image-tags: |
            ${{ needs.klaarzetten.outputs.versie }}
            latest
          skip-existing: ${{ needs.klaarzetten.outputs.versie }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
