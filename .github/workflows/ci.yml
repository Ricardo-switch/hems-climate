# De poort vóór de NAS (besluit 54).
#
# De NAS haalt elke vijf minuten de tak op die daar is uitgecheckt en rolt die
# uit. Stond dat op `main`, dan stond elke push binnen vijf minuten in de
# schaduwdienst die de winterdataset opbouwt, zonder één automatische controle.
#
# Nu: elke push naar main draait typecheck, tests en build. Pas als alles groen
# is, schuift de tak `stable` mee naar die commit. De NAS volgt `stable`.
#
# `stable` schuift alleen vooruit. Een push die hem terug zou zetten of een
# herschreven geschiedenis zou volgen, wordt door git geweigerd en laat deze run
# falen — dat is dan een beslissing voor een mens, niet voor de CI.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, tests en build
    runs-on: ubuntu-latest
    # Dezelfde zone als de container op de NAS: Node draait daar in UTC.
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # De dienst gebruikt de WebSocket die in Node zelf zit; die is er
          # vanaf 22. Dezelfde versie als de images.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: backend — afhankelijkheden
        working-directory: backend
        run: npm ci

      - name: backend — typecheck
        working-directory: backend
        run: npm run typecheck

      - name: backend — lint
        working-directory: backend
        run: npm run lint

      - name: backend — tests
        working-directory: backend
        run: npm test

      - name: backend — build
        working-directory: backend
        run: npm run build

      - name: weergave — build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  image:
    name: image bouwen zoals de NAS
    runs-on: ubuntu-latest
    # Op 30 september 2026 kwam er een commit op stable die in de repo klopte,
    # maar op de NAS niet te bouwen was: een test importeerde uit tools/, en de
    # Dockerfile kopieerde die map niet. De NAS draaide gewoon door op de
    # vorige versie, maar elke vijf minuten mislukte het bouwen opnieuw. Dus
    # bouwt de CI nu ook het image, met dezelfde Dockerfile en context.
    steps:
      - uses: actions/checkout@v4

      - name: docker build, zoals deploy.sh op de NAS
        run: >
          docker build
          -f backend/Dockerfile
          --build-arg HEMS_COMMIT="${GITHUB_SHA::7}"
          -t hems-climate/shadow:ci
          .

  deploy:
    name: deploy.sh nakijken
    runs-on: ubuntu-latest
    # deploy.sh draait op de NAS en wordt met de hand gekopieerd. Een fout erin
    # merk je pas als de uitrol of de melding bij stilvallen het niet meer doet
    # (besluit 69). ShellCheck staat op de runner; vanaf "warning" faalt hij.
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning deploy/deploy.sh deploy/test-deploy.sh addon/run.sh

      - name: syntaxis en de melding bij stilvallen
        run: bash deploy/test-deploy.sh

  page:
    name: de pagina in een browser
    runs-on: ubuntu-latest
    # De echte pagina tegen de echte server, headless (besluit 69). Bewaakt
    # vooral dat de weergave en de API dezelfde sleutels blijven gebruiken.
    env:
      TZ: UTC
      HEMS_PAGE_TEST: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: weergave bouwen
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: backend — afhankelijkheden en browser
        working-directory: backend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: de pagina
        working-directory: backend
        run: npx vitest run test/page.test.ts

      # Bij een fout: de trace van de pagina, met elke stap en een schermafdruk.
      # Openen op trace.playwright.dev.
      - name: trace bewaren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pagina-trace
          path: backend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  stable:
    name: stable bijwerken
    needs: [test, image, deploy, page]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Twee snelle pushes na elkaar: niet tegelijk aan `stable` schrijven. De
    # latere wacht op de eerdere; een oudere commit die later klaar is, wordt
    # door de alleen-vooruit-regel geweigerd.
    concurrency:
      group: stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: stable naar deze commit, alleen vooruit
        run: git push origin "${GITHUB_SHA}:refs/heads/stable"
